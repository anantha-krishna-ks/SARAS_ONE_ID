function JobExecLog() {
  const [search, setSearch] = useState('')
  const [job, setJob] = useState('All')
  const [stat, setStat] = useState('All')
  const [win, setWin] = useState({ from:'', to:'' })
  const [sort, setSort] = useState({ col:-1, dir:'asc' })
  const [page, setPage] = useState(1)
  const [size, setSize] = useState(10)
  const [viewRec, setViewRec] = useState(null)
  React.useEffect(() => { setPage(1) }, [search, job, stat, win, size, sort])
  const jobOptions = ['All', ...Array.from(new Set(jobExecutions.map(e => e.job)))]
  const q = search.trim().toLowerCase()
  const winFrom = win.from ? drBound(win.from, false) : null
  const winTo = win.to ? drBound(win.to, true) : null
  const inWindow = (e) => {
    if (winFrom === null && winTo === null) return true
    const t = Date.parse(String(e.startedAt).replace(',', ''))
    if (isNaN(t)) return false
    return (winFrom === null || t >= winFrom) && (winTo === null || t <= winTo)
  }
  let rows = jobExecutions.filter(e =>
    (job === 'All' || e.job === job) &&
    (stat === 'All' || e.status === stat) &&
    inWindow(e) &&
    (!q || (e.id + ' ' + e.job + ' ' + e.jobCode + ' ' + e.status + ' ' + e.tenant).toLowerCase().includes(q)))
  if (sort.col >= 0) {
    const keyf = [e => e.job, e => e.status, e => e.agoHours, e => (e.durationMs == null ? -1 : e.durationMs)][sort.col]
    const dir = sort.dir === 'asc' ? 1 : -1
    rows = [...rows].sort((a, b) => { const av = keyf(a), bv = keyf(b); return (av < bv ? -1 : av > bv ? 1 : 0) * dir })
  }
  const w = pageWindow(rows.length, page, size)
  const pageRows = rows.slice(w.from > 0 ? w.from - 1 : 0, w.to)
  const doSort = (i) => setSort(s => s.col === i ? { col:i, dir: s.dir === 'asc' ? 'desc' : 'asc' } : { col:i, dir:'asc' })
  const cols = [{ label:'Job', s:true }, { label:'Status', s:true }, { label:'Started at', s:true }, { label:'Duration', s:true }]
  return (
    <div style={{ animation:'fadeUp .28s ease' }}>
      <PageHead title="Job Execution Log" sub="History of background job runs" />
      <section style={{ ...S.card, overflow:'visible' }}>
        <SearchBar value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search executions…" topRound>
          <FilterBar filters={[
            { key:'job', label:'Job', type:'search', value:job, onChange:setJob, options:jobOptions },
            { key:'stat', label:'Status', value:stat, onChange:setStat, options:['All', ...jobExecStatusOptions] },
            { key:'win', label:'Window', type:'range', value:win, onChange:setWin },
          ]} />
        </SearchBar>
        {rows.length > 0 ? (
          <>
            <div className="tscroll" style={{ overflowX:'auto' }}>
              <table style={{ width:'100%', borderCollapse:'collapse', minWidth:860 }}>
                <thead><tr>{cols.map((c, i) => <Th key={i} label={c.label} align={i >= 3 ? 'right' : 'left'} sortable={c.s} active={sort.col === i} dir={sort.dir} onSort={() => doSort(i)} />)}<th scope="col" style={{ ...S.th, background:'#EAF3FF', textAlign:'right' }}>Actions</th></tr></thead>
                <tbody>
                  {pageRows.map(e => (
                    <tr key={e.id} data-ix="row" style={{ borderBottom:'1px solid var(--border)' }}>
                      <td style={{ padding:'13px 16px' }}><div style={{ fontSize:13.8, fontWeight:600, color:'var(--ink)' }}>{e.job}</div><div style={{ fontSize:11.6, color:'var(--muted)', marginTop:2, fontFamily:mono }}>{e.jobCode}</div></td>
                      <td style={{ padding:'13px 16px' }}><ExecStatus status={e.status} /></td>
                      <td style={{ padding:'13px 16px', fontSize:13, color:'var(--ink)', whiteSpace:'nowrap' }}>{e.startedAt}</td>
                      <td style={{ padding:'13px 16px', textAlign:'right', fontSize:13, color:'var(--ink)', fontVariantNumeric:'tabular-nums', whiteSpace:'nowrap' }}>{fmtDur(e.durationMs)}</td>
                      <td style={{ padding:'13px 16px' }}>
                        <RowActions>
                          <IconBtn label="View execution details" d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" onClick={() => setViewRec(e)} />
                        </RowActions>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <Pager total={rows.length} page={w.cur} size={size} onPage={setPage} onSize={setSize} />
          </>
        ) : <Empty title="No executions match your filters" hint="Try a different job, status or time window." />}
      </section>
      {viewRec && <ExecDetail rec={viewRec} onClose={() => setViewRec(null)} stop={(e) => e.stopPropagation()} />}

function JChips({ id, values, onChange, placeholder }) {
  const [draft, setDraft] = useState('')
  const add = (v) => { const t = String(v).trim(); if (t && !values.includes(t)) onChange([...values, t]); setDraft('') }
  const remove = (i) => onChange(values.filter((_, x) => x !== i))
  const onKey = (e) => { if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); add(draft) } else if (e.key === 'Backspace' && !draft && values.length) remove(values.length - 1) }
  return (
    <div style={{ display:'flex', flexWrap:'wrap', gap:7, alignItems:'center', minHeight:44, padding:'7px 10px', borderRadius:10, border:'1.5px solid #D5DBE4', background:'var(--surface)' }}>

        </span>
      ))}
      <input id={id} value={draft} onChange={(e) => setDraft(e.target.value)} onKeyDown={onKey} onBlur={() => draft && add(draft)} placeholder={values.length ? '' : placeholder} style={{ flex:1, minWidth:130, border:'none', outline:'none', background:'transparent', fontFamily:'inherit', fontSize:14, color:'var(--ink)' }} />

const DR_ACC = '#0070E0'
const DR_FONT = "'Poppins', system-ui, sans-serif"
const DR_MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December']
const DR_PRESETS = { today:'Today', month:'This Month', last:'Last Month', last2:'Last 2 Months', custom:'Custom Range' }
const drPad = n => String(n).padStart(2, '0')
const drISO = (y, m, d) => { const x = new Date(y, m, d); return x.getFullYear() + '-' + drPad(x.getMonth() + 1) + '-' + drPad(x.getDate()) }
const drParts = s => s ? { y:+s.slice(0, 4), m:+s.slice(5, 7) - 1, d:+s.slice(8, 10) } : null
const drToday = () => { const t = new Date(); return drISO(t.getFullYear(), t.getMonth(), t.getDate()) }
const drFmt = s => { const p = drParts(s); return p ? drPad(p.d) + '/' + (p.m + 1) + '/' + p.y : '' }
const drFmtUS = s => { const p = drParts(s); return p ? drPad(p.m + 1) + '/' + drPad(p.d) + '/' + p.y : '' }
const drLong = s => { const p = drParts(s); return p ? drPad(p.d) + ' ' + DR_MONTHS[p.m].slice(0, 3) + ' ' + p.y : '' }
function drPresetRange(k) {
  const t = new Date(), y = t.getFullYear(), m = t.getMonth()
  if (k === 'today') { const s = drToday(); return { from:s, to:s } }
  if (k === 'month') return { from:drISO(y, m, 1), to:drISO(y, m + 1, 0) }
  if (k === 'last') return { from:drISO(y, m - 1, 1), to:drISO(y, m, 0) }
  if (k === 'last2') return { from:drISO(y, m - 2, 1), to:drISO(y, m, 0) }
  return null
}

function drBound(s, end) {
  if (!s) return null
  if (s.length === 10) { const p = drParts(s); return end ? new Date(p.y, p.m, p.d, 23, 59, 59, 999).getTime() : new Date(p.y, p.m, p.d).getTime() }
  return Date.parse(s)
}

function inDates(dateISO, from, to) {
  if (!from && !to) return true
  if (!dateISO) return false
  const d = String(dateISO).slice(0, 10)
  return (!from || d >= from) && (!to || d <= to)
}

  const [from, setFrom] = React.useState(null)
  const [to, setTo] = React.useState(null)

    const w = p.width, h = p.height

    left = Math.max(M, Math.min(left, vw - M - w))
    const below = vh - r.bottom - G - M, above = r.top - G - M
    let top = (h <= below || below >= above) ? r.bottom + G : r.top - G - h
    const maxH = vh - 2 * M
    top = Math.max(M, Math.min(top, vh - M - Math.min(h, maxH)))
    setPos({ left, top, maxH })
    setCompact(vw <= 720)
  }, [])

  React.useLayoutEffect(() => { if (open) place() }, [open, mode, preset, view, compact, place])
  React.useEffect(() => {

  const pickDay = iso => {

  }
  const shift = n => setView(x => { const d = new Date(x.y, x.m + n, 1); return { y:d.getFullYear(), m:d.getMonth() } })

  const label = v.from ? drFmt(v.from) + ' - ' + drFmt(v.to || v.from) : (allLabel || 'Select date range')
  const trig = { width:'100%', height:44, boxSizing:'border-box', display:'flex', alignItems:'center', justifyContent:'space-between', gap:10, padding:'0 12px 0 14px', borderRadius:11, border:'1.5px solid ' + (open ? DR_ACC : '#D5DBE4'), boxShadow: open ? '0 0 0 3px rgba(0,112,224,.14)' : 'none', background:'#fff', fontFamily:DR_FONT, fontSize:13.6, fontWeight:500, color: v.from ? '#1B2433' : '#6B7689', cursor:'pointer', textAlign:'left', transition:'border-color .15s ease, box-shadow .15s ease' }
  const btnPrimary = { height:40, padding:'0 18px', borderRadius:10, border:'none', background:DR_ACC, color:'#fff', fontFamily:DR_FONT, fontSize:13.4, fontWeight:600, cursor:'pointer', whiteSpace:'nowrap' }
  const btnGhost = { height:40, padding:'0 16px', borderRadius:10, border:'1.5px solid #D5DBE4', background:'#fff', color:'#1B2433', fontFamily:DR_FONT, fontSize:13.4, fontWeight:600, cursor:'pointer', whiteSpace:'nowrap' }

  const rangeEnd = to || (from && hover ? hover : null)

  const hi = from && rangeEnd ? (from < rangeEnd ? rangeEnd : from) : from
  const todayISO = drToday()

  const month = (y, m, nav) => {

          {['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'].map(w => <span key={w} style={{ height:28, display:'flex', alignItems:'center', justifyContent:'center', fontSize:11.4, fontWeight:600, color:'#8A94A6' }}>{w}</span>)}
          {cells.map(c => {
            const isS = lo && c.iso === lo, isE = hi && c.iso === hi
            const edge = isS || isE
            const mid = lo && hi && c.iso > lo && c.iso < hi

              <button key={c.iso + (c.inM ? '' : 'o')} type="button" aria-label={drLong(c.iso)} aria-pressed={!!edge} onClick={() => pickDay(c.iso)} onMouseEnter={() => { if (from && !to) setHover(c.iso) }}
                style={{ width:34, height:34, padding:0, border:'none', fontFamily:DR_FONT, fontSize:12.8, cursor:'pointer', fontVariantNumeric:'tabular-nums',

      </div>
    )
  }
  const next = new Date(view.y, view.m + 1, 1)
  const dateBox = (lab, val) => (

      <div style={{ height:42, boxSizing:'border-box', display:'flex', alignItems:'center', gap:8, padding:'0 12px', borderRadius:10, border:'1.5px solid #E4E7EC', background:'#F9FAFC', fontSize:13.4, color: val ? '#1B2433' : '#A0A9B8', fontVariantNumeric:'tabular-nums' }}>
        <DrIcon d={DR_CAL} size={14} color="#8A94A6" />{val ? drFmtUS(val) : 'MM/DD/YYYY'}
      </div>
    </div>
  )
  const tab = (k, lab, icon) => {
    const on = mode === k
    return <button type="button" role="tab" aria-selected={on} onClick={() => setMode(k)} style={{ flex:1, height:38, display:'inline-flex', alignItems:'center', justifyContent:'center', gap:8, border:'none', borderRadius:8, background: on ? '#fff' : 'transparent', color: on ? DR_ACC : '#46566a', boxShadow: on ? '0 1px 3px rgba(16,42,84,.16)' : 'none', fontFamily:DR_FONT, fontSize:13.2, fontWeight:600, cursor:'pointer', whiteSpace:'nowrap', transition:'all .15s ease' }}><DrIcon d={icon} size={15} />{lab}</button>
  }
  const footer = (

      {(compact || mode === 'all') && <button type="button" onClick={close} style={btnGhost}>Cancel</button>}
      <button type="button" onClick={apply} disabled={mode !== 'all' && !from} style={{ ...btnPrimary, opacity: mode !== 'all' && !from ? .5 : 1, cursor: mode !== 'all' && !from ? 'not-allowed' : 'pointer' }}>Apply</button>
      {!(compact || mode === 'all') && <button type="button" onClick={close} style={btnGhost}>Cancel</button>}
    </div>

    <div ref={popRef} data-daterange-pop="" role="dialog" aria-label={ariaLabel || 'Choose date range'}
      style={{ position:'fixed', zIndex:9000, left: pos ? pos.left : -9999, top: pos ? pos.top : 0, visibility: pos ? 'visible' : 'hidden', maxHeight: pos ? pos.maxH : undefined, maxWidth:'calc(100vw - 24px)', overflow:'auto', boxSizing:'border-box', background:'#fff', borderRadius:16, border:'1px solid #E4E7EC', boxShadow:'0 24px 60px -16px rgba(16,40,90,.4)', padding:16, fontFamily:DR_FONT, color:'#1B2433', display:'flex', flexDirection:'column', gap:14 }}>
      {allLabel && <div role="tablist" aria-label="Range mode" style={{ display:'flex', gap:4, padding:4, borderRadius:11, background:'#F1F4F8' }}>
        {tab('all', allLabel, DR_LIST)}
        {tab('custom', 'Custom Range', DR_CAL)}
      </div>}
      {mode === 'all' ? footer : (
        <div style={{ display:'flex', flexDirection: compact ? 'column' : 'row', gap:16 }}>
          <div style={{ width: compact ? 'auto' : 140, flex:'none', display:'flex', flexDirection:'column', gap:6 }}>
            <div style={{ display:'flex', flexDirection: compact ? 'row' : 'column', flexWrap: compact ? 'wrap' : 'nowrap', gap:6 }}>
              {keys.map(k => {

              </div>
            ) : (
              <div style={{ width: compact ? 'auto' : 496, boxSizing:'border-box', minHeight:250, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:10, padding:24, borderRadius:12, border:'1.5px dashed #BCD3EE', background:'#F7FAFE', textAlign:'center' }}>
                <span style={{ width:48, height:48, borderRadius:14, display:'flex', alignItems:'center', justifyContent:'center', background:'#EAF3FF', color:DR_ACC }}><DrIcon d={DR_CALCHECK} size={22} /></span>

        </div>
      )}

  return (
    <div style={{ position:'relative', width:'100%', fontFamily:DR_FONT }}>
      <button ref={trigRef} type="button" aria-haspopup="dialog" aria-expanded={open} aria-label={ariaLabel ? ariaLabel + ': ' + label : label} onClick={() => open ? close() : openPicker()} style={trig}>
        <span style={{ minWidth:0, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap', fontVariantNumeric:'tabular-nums' }}>{label}</span>
        <DrIcon d={DR_CAL} size={17} color={DR_ACC} />
      </button>
      {pop}
    </div>
  )
}

function FilterBar({ filters, wide }) {
  const isOn = (f, v) => f.type === 'range' ? !!(v && (v.from || v.to)) : (v || 'All') !== 'All'
  const blank = (f) => f.type === 'range' ? { from:'', to:'' } : 'All'
  const fmtDT = (x) => x ? (x.length === 10 ? x.slice(8, 10) + '/' + (+x.slice(5, 7)) + '/' + x.slice(0, 4) : x.replace('T', ' ')) : '…'

    if (!open) return

    const onEsc = (e) => { if (e.key === 'Escape') setOpen(false) }
    document.addEventListener('mousedown', onDown); document.addEventListener('keydown', onEsc)
    return () => { document.removeEventListener('mousedown', onDown); document.removeEventListener('keydown', onEsc) }
  }, [open])
  React.useLayoutEffect(() => {
    if (!(open && btnRef.current)) return
    const place = () => { const r = btnRef.current.getBoundingClientRect(); const W = wide ? Math.min(600, window.innerWidth - 24) : 304; const left = Math.max(12, Math.min(r.left, window.innerWidth - W - 12)); const top = Math.min(r.bottom + 8, window.innerHeight - 12); setPos(p => ({ top: wide && p && p.anchor === r.bottom ? p.top : top, left, width: W, anchor: r.bottom })) }
    place(); window.addEventListener('scroll', place, true); window.addEventListener('resize', place)
    return () => { window.removeEventListener('scroll', place, true); window.removeEventListener('resize', place) }
  }, [open])
  React.useLayoutEffect(() => {
    if (!(wide && open && pos && panelRef.current)) return
    const h = panelRef.current.offsetHeight
    const t = Math.max(76, Math.min(pos.anchor + 8, window.innerHeight - h - 12))
    if (Math.abs(t - pos.top) > 0.5) setPos(p => ({ ...p, top: t }))
  })

  const clearAll = () => setDraft(Object.fromEntries(filters.map(f => [f.key, blank(f)])))
  const openPanel = () => { setDraft(Object.fromEntries(filters.map(f => [f.key, f.value]))); setOpen(true) }
  const applyFilters = () => { filters.forEach(f => { if (d[f.key] !== f.value) f.onChange(d[f.key]) }); setOpen(false) }
  const pill = (on) => ({ padding: wide ? '5px 11px' : '6px 12px', borderRadius:999, border:'1.5px solid ' + (on ? 'var(--primary)' : '#D5DBE4'), background: on ? 'var(--primary-tint)' : 'var(--surface)', color: on ? 'var(--on-tint-blue)' : 'var(--ink)', fontFamily:'inherit', fontSize:12.8, fontWeight:600, cursor:'pointer', whiteSpace:'nowrap' })
  const panel = open && pos ? ReactDOM.createPortal(

      </div>
      <div style={wide ? { flex:1, minHeight:0, overflow:'auto', padding:'2px 16px', display:'flex', flexDirection:'column' } : { flex:1, minHeight:0, overflow:'auto', padding:14, display:'flex', flexDirection:'column', gap:16 }}>
        {filters.map((f, fi) => (
          <div key={f.key} style={wide ? { display:'grid', gridTemplateColumns:'118px minmax(0, 1fr)', alignItems:'start', gap:14, padding:'13px 0', borderTop: fi ? '1px solid var(--border)' : 'none' } : { display:'flex', flexDirection:'column', gap:8 }}>
            {wide ? (
              <span style={{ display:'flex', alignItems:'center', gap:9, minHeight:32 }}>

                <span style={{ fontSize:13, fontWeight:600, color:'var(--ink)' }}>{f.label}</span>
              </span>
            ) : <span style={{ fontSize:11.6, fontWeight:700, letterSpacing:'.05em', textTransform:'uppercase', color:'var(--muted)' }}>{f.label}</span>}

          <span style={{ color:'var(--muted)', fontWeight:600 }}>{f.label}:</span>{f.type === 'range' ? fmtDT(f.value.from) + ' \u2192 ' + fmtDT(f.value.to) : f.value}

        </span>
      ))}
      {panel}
    </div>
  )
}

const SES_CITY = ['Bengaluru, IN', 'Mysuru, IN', 'Chennai, IN', 'Pune, IN', 'Hyderabad, IN', 'Kochi, IN', 'Singapore, SG', 'Dubai, AE']
const SES_NAMES = ['Ravi Mohan', 'Anita Kulkarni', 'Rahul Menon', 'Priya Shah', 'Karthik Rao', 'Meera Iyer', 'Sara Fernandes', 'Arjun Nair', 'Divya Pillai', 'Vikram Sethi', 'Neha Joshi', 'Imran Khan', 'Lakshmi Rao', 'David Osei']
const SES_ACTIVE = [1, 3, 2, 5, 1, 0, 2, 1, 0, 4, 1, 0, 2, 1]
const SES_STATES = {
  active:{ label:'Active', fg:'var(--success-text)', bg:'var(--green-tint)', bd:'#BBE5C8' },
  idle:{ label:'Idle', fg:'var(--warning-text)', bg:'var(--amber-tint)', bd:'#F5D68A' },
  expired:{ label:'Expired', fg:'var(--muted)', bg:'var(--surface-alt)', bd:'var(--border)' },
  loggedOut:{ label:'Logged out', fg:'var(--muted)', bg:'var(--surface-alt)', bd:'var(--border)' },
  revoked:{ label:'Revoked', fg:'#B42318', bg:'#FEF2F2', bd:'#F3C2C2' },
  locked:{ label:'Locked', fg:'var(--warning-text)', bg:'var(--amber-tint)', bd:'#F5D68A' },
}
const SES_STATE_FILTER = { 'Expired':'expired', 'Logged out':'loggedOut', 'Revoked':'revoked', 'Locked':'locked' }

function sesSeed(t) {
  const s = t.code.charCodeAt(0) + t.code.charCodeAt(1) + t.code.charCodeAt(2)
  const domain = t.domain || 'example.edu'
  let id = 88000 + (s % 90) * 37
  return SES_NAMES.map((name, i) => {
    const parts = name.toLowerCase().split(' ')
    const login = parts[0] + '.' + parts[1][0]
    const sessions = []
    const nAct = SES_ACTIVE[(i + s) % SES_ACTIVE.length], nIn = ((s + i * 3) % 5) + 1
    for (let k = 0; k < nAct; k++) {
      const dv = SES_DEV[(i + k * 2 + s) % SES_DEV.length]
      const last = SES_NOW - ((i * 7 + k * 23) % 50 === 0 ? 2 : ((i * 7 + k * 23) % 200)) * SES_MIN
      const start = last - ((k + 1) * 95 + i * 11) * SES_MIN
      sessions.push({ id:'SES-' + (id++), ...dv, method:SES_METHOD[(i + k) % SES_METHOD.length], ip:(49 + (i * 13 + k) % 150) + '.' + ((s + k * 31) % 250) + '.' + ((i * 17) % 250) + '.' + (k * 41 % 250 + 2), place:SES_CITY[(i + k + s) % SES_CITY.length], start, last, expires:start + 12 * SES_H, state:'active' })
    }
    for (let k = 0; k < nIn; k++) {
      const dv = SES_DEV[(i + k + 3) % SES_DEV.length]
      const ended = SES_NOW - (k * 19 + i * 5 + 3) * SES_H
      const start = ended - (2 + (k + i) % 9) * SES_H
      const state = ['expired', 'loggedOut', 'expired', 'revoked', 'locked'][(i + k) % 5]
      const detail = state === 'expired' ? 'Timed out' : state === 'loggedOut' ? 'By user' : state === 'revoked' ? 'By ' + (k % 2 ? 'Anita Kulkarni' : 'Ravi Mohan') + ' · ' + (k % 2 ? 'Security concern' : 'Offboarding') : 'Account locked · 5 failed attempts'
      sessions.push({ id:'SES-' + (id++), ...dv, method:SES_METHOD[(i + k + 2) % SES_METHOD.length], ip:(103 + (i * 7 + k) % 120) + '.' + ((s + k * 13) % 250) + '.' + ((i * 29) % 250) + '.' + (k * 17 % 250 + 4), place:SES_CITY[(i + k * 3) % SES_CITY.length], start, last:ended, expires:start + 12 * SES_H, ended, state, detail })
    }
    return { name, login, email:login + '@' + domain, sessions }
  })
}

function Sessions({ toast, tenantScope, adminName }) {
  const scoped = !!tenantScope
  const tenantNames = tenants.map(t => t.name)
  const [tenantName, setTenantName] = useState(tenantScope || (typeof window !== 'undefined' && window.__sarasTenant) || tenantNames[0])
  React.useEffect(() => { if (scoped) return; const on = (e) => setTenantName(e.detail); window.addEventListener('saras:tenant', on); return () => window.removeEventListener('saras:tenant', on) }, [scoped])
  const tenant = tenants.find(t => t.name === tenantName) || tenants[0]
  const [data, setData] = useState(() => sesSeed(tenant))
  const [view, setView] = useState('active')
  const [search, setSearch] = useState('')
  const [fDevice, setFDevice] = useState('All')
  const [fCount, setFCount] = useState('All')
  const [fState, setFState] = useState('All')
  const [fWin, setFWin] = useState({ from:'', to:'' })
  const [sel, setSel] = useState([])
  const [openAcc, setOpenAcc] = useState(null)
  const [accView, setAccView] = useState('active')
  const [page, setPage] = useState(1)
  const [size, setSize] = useState(10)
  const [updatedAt, setUpdatedAt] = useState(SES_NOW - 2 * SES_MIN)
  const [, setTick] = useState(0)
  const [dd, setDd] = useState(null)
  const [confirm, setConfirm] = useState(null)
  React.useEffect(() => { setData(sesSeed(tenant)); setSel([]); setOpenAcc(null) }, [tenant.code])
  React.useEffect(() => { const t = setInterval(() => setTick(x => x + 1), 30000); return () => clearInterval(t) }, [])
  React.useEffect(() => { setPage(1) }, [view, search, fDevice, fState, fWin, fCount, size])

  const isActive = s => s.state === 'active'
  const isIdle = s => isActive(s) && SES_NOW - s.last > 30 * SES_MIN
  const winFrom = fWin.from ? drBound(fWin.from, false) : null, winTo = fWin.to ? drBound(fWin.to, true) : null
  const hasWin = winFrom !== null || winTo !== null
  const inWin = s => { if (!hasWin) return true; const end = s.ended || SES_NOW; return (winTo === null || s.start <= winTo) && (winFrom === null || end >= winFrom) }
  const devOk = s => fDevice === 'All' || s.type === fDevice
  const stateOk = s => fState === 'All' || s.state === SES_STATE_FILTER[fState]
  const viewOk = (s, v) => v === 'active' ? isActive(s) : v === 'inactive' ? !isActive(s) : true
  const fmtT = ts => { const d = new Date(ts), today = new Date(SES_NOW); const hm = d.toLocaleTimeString('en-GB', { hour:'2-digit', minute:'2-digit' }); return d.toDateString() === today.toDateString() ? 'Today, ' + hm : d.toLocaleDateString('en-GB', { day:'2-digit', month:'short' }) + ', ' + hm }
  const rel = ts => { const m = Math.round((SES_NOW - ts) / SES_MIN); return m < 1 ? 'Just now' : m < 60 ? m + ' min ago' : m < 1440 ? Math.round(m / 60) + ' h ago' : Math.round(m / 1440) + ' d ago' }
  const isMe = (a, s) => !!adminName && a.name === adminName && isActive(s) && s === a.sessions.find(isActive)

  const q = search.trim().toLowerCase()
  const accRows = data.map(a => {
    const scopedS = a.sessions.filter(s => inWin(s) && devOk(s))
    const act = scopedS.filter(isActive)
    const inact = scopedS.filter(s => !isActive(s))
    const inact24 = a.sessions.filter(s => !isActive(s) && (hasWin ? inWin(s) : SES_NOW - s.ended <= SES_D))
    const latest = [...a.sessions].sort((x, y) => y.last - x.last)[0]
    const match = scopedS.filter(s => viewOk(s, view) && (view === 'active' || stateOk(s)))
    return { ...a, act, inact, inact24, latest, match, locked:a.sessions.some(s => s.state === 'locked') }
  }).filter(a => a.match.length > 0 && (fCount === 'All' || (fCount === '1' ? a.act.length === 1 : fCount === '2' ? a.act.length === 2 : fCount === '3+' ? a.act.length >= 3 : a.act.length >= 5)) && (!q || (a.name + ' ' + a.email + ' ' + a.sessions.map(s => s.ip).join(' ')).toLowerCase().includes(q)))
    .sort((x, y) => (y.act.length - x.act.length) || (y.latest.last - x.latest.last))
  const w = pageWindow(accRows.length, page, size)
  const pageRows = accRows.slice(w.from > 0 ? w.from - 1 : 0, w.to)

  const allAct = data.flatMap(a => a.sessions.filter(s => isActive(s) && inWin(s)))
  const signedIn = data.filter(a => a.sessions.some(s => isActive(s) && inWin(s))).length
  const heavy = data.filter(a => a.sessions.filter(s => isActive(s) && inWin(s)).length >= 3).length
  const in24 = data.flatMap(a => a.sessions.filter(s => !isActive(s) && (hasWin ? inWin(s) : SES_NOW - s.ended <= SES_D)))
  const breakdown = arr => ['expired', 'loggedOut', 'revoked', 'locked'].map(k => [k, arr.filter(s => s.state === k).length]).filter(x => x[1]).map(([k, n]) => n + ' ' + SES_STATES[k].label.toLowerCase()).join(' · ')

  const selAccts = accRows.filter(a => sel.includes(a.login))
  const selActive = selAccts.reduce((n, a) => n + a.act.filter(s => !isMe(a, s)).length, 0)
  const pageAll = pageRows.length > 0 && pageRows.every(a => sel.includes(a.login))
  const pageSome = !pageAll && pageRows.some(a => sel.includes(a.login))
  const togglePage = () => setSel(s => pageAll ? s.filter(l => !pageRows.some(a => a.login === l)) : [...s, ...pageRows.map(a => a.login).filter(l => !s.includes(l))])
  const toggleSel = l => setSel(s => s.includes(l) ? s.filter(x => x !== l) : [...s, l])

  const doRevoke = (c, reason, reset, comment) => {
    const by = 'By ' + (adminName || 'Admin') + ' · ' + reason + (comment ? ' — “' + comment + '”' : '')
    setData(d => d.map(a => {
      if (!c.logins.includes(a.login)) return a
      const mine = adminName && a.name === adminName ? a.sessions.find(isActive) : null
      return { ...a, sessions:a.sessions.map(s => {
        const hit = c.ids ? c.ids.includes(s.id) : isActive(s) && s !== mine
        if (!hit || !isActive(s)) return s
        return { ...s, state:'revoked', ended:SES_NOW, last:SES_NOW, detail:by }
      }) }
    }))
    setConfirm(null); setSel([])
    toast && toast((c.ids ? 'Session revoked' : c.count + ' session' + (c.count === 1 ? '' : 's') + ' revoked') + (c.logins.length > 1 ? ' across ' + c.logins.length + ' accounts' : '') + '.' + (reset ? ' Password reset required on next sign-in.' : ''), 'success')
  }
  const askOne = (a, s) => setConfirm({ kind:'one', title:'Revoke session?', logins:[a.login], ids:[s.id], count:1, msg:<span>Revoke <b style={{ fontWeight:600 }}>{s.id}</b> on <b style={{ fontWeight:600 }}>{s.device}</b> for {a.name}? They’ll be signed out on this device.</span> })
  const askAll = a => { const n = a.act.filter(s => !isMe(a, s)).length; setConfirm({ kind:'all', title:'Revoke all sessions?', logins:[a.login], count:n, msg:<span>Revoke all <b style={{ fontWeight:600 }}>{n} active session{n === 1 ? '' : 's'}</b> for {a.name}? They’ll be signed out on every device.</span> }) }
  const askBulk = () => setConfirm({ kind:'bulk', title:'Revoke sessions for ' + selAccts.length + ' accounts?', logins:selAccts.map(a => a.login), count:selActive, msg:<span>Revoke <b style={{ fontWeight:600 }}>{selActive} active session{selActive === 1 ? '' : 's'}</b> across {selAccts.length} accounts? Each account will be signed out on every device.</span> })
  const refresh = () => { setUpdatedAt(Date.now()); toast && toast('Sessions refreshed.', 'success') }
  const ago = Math.max(0, Math.round((Date.now() - updatedAt) / SES_MIN))
  const canRevoke = view !== 'inactive'
  const openRow = (a, open) => { setOpenAcc(open ? null : a.login); setAccView(view === 'inactive' ? 'inactive' : 'active') }

  const seg = (value, onChange, opts, small) => (
    <div role="tablist" style={{ display:'inline-flex', alignItems:'stretch', boxSizing:'border-box', height: small ? undefined : 44, background:'var(--surface-page)', border:'1px solid var(--border)', borderRadius: small ? 9 : 10, padding:3, gap:2, flex:'none' }}>
      {opts.map(([v, l, n]) => { const on = value === v; return <button key={v} type="button" role="tab" aria-selected={on} onClick={() => onChange(v)} style={{ border:'none', borderRadius:7, padding: small ? '5px 12px' : '0 16px', fontFamily:'inherit', fontSize: small ? 12.2 : 12.8, fontWeight:600, cursor:'pointer', whiteSpace:'nowrap', display:'inline-flex', alignItems:'center', gap:6, background: on ? '#fff' : 'transparent', color: on ? 'var(--primary)' : 'var(--muted)', boxShadow: on ? '0 1px 3px rgba(16,42,84,.14)' : 'none', transition:'all .15s ease' }}>{l}{n != null && <span style={{ fontSize:11.4, fontWeight:700, opacity:.8, fontVariantNumeric:'tabular-nums' }}>{n}</span>}</button> })}
    </div>
  )
  const badge = (n, warn) => <span style={{ display:'inline-flex', alignItems:'center', gap:6, padding:'3px 10px', borderRadius:999, fontSize:12, fontWeight:600, whiteSpace:'nowrap', fontVariantNumeric:'tabular-nums', ...(n === 0 ? { background:'var(--surface-alt)', color:'var(--muted)', border:'1px solid var(--border)' } : warn ? { background:'var(--amber-tint)', color:'var(--warning-text)', border:'1px solid #F5D68A' } : { background:'var(--green-tint)', color:'var(--success-text)', border:'1px solid #BBE5C8' }) }}>{n > 0 && <span aria-hidden style={{ width:6, height:6, borderRadius:999, background:'currentColor' }} />}{n} active</span>
  const KTONE = { blue:'var(--primary)', green:'var(--success)', amber:'var(--warning)', red:'#DC2626' }
  const kpi = (label, value, sub, tone, pct, icon) => (
    <div style={{ ...S.card, padding:'17px 18px 15px', marginBottom:0, display:'flex', flexDirection:'column', gap:12, minWidth:0, border:'1px solid var(--border-blue)', boxShadow:'0 1px 2px rgba(16,42,84,.05), 0 5px 16px -8px rgba(16,42,84,.12)' }}>
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:10 }}>
        <span style={{ fontSize:11.5, fontWeight:600, letterSpacing:'.06em', textTransform:'uppercase', color:'var(--muted)' }}>{label}</span>
        <Icon d={icon} size={17} style={{ color:'var(--muted)', opacity:.5, flex:'none' }} />
      </div>
      <div style={{ fontSize:30, fontWeight:600, color:'var(--ink)', lineHeight:1, fontVariantNumeric:'tabular-nums', letterSpacing:'-.02em' }}>{value.toLocaleString()}</div>
      <div style={{ display:'flex', alignItems:'center', gap:10, marginTop:'auto', minHeight:24, minWidth:0 }}>
        <div style={{ flex:'1 0 48px', height:5, borderRadius:999, background:'#E9EEF5', overflow:'hidden' }}>
          <div style={{ height:'100%', borderRadius:999, width:Math.min(100, Math.max(2, pct || 0)) + '%', background:KTONE[tone] || KTONE.blue }} />
        </div>
        {sub && <span title={sub} style={{ fontSize:11.8, color:'var(--muted)', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis', minWidth:0 }}>{sub}</span>}
      </div>
    </div>
  )
  const idleN = allAct.filter(isIdle).length
  const endedHard = in24.filter(s => s.state === 'revoked' || s.state === 'locked').length
  const th = { fontSize:11.5, fontWeight:600, letterSpacing:'.06em', textTransform:'uppercase', color:'#0a4a8c', padding:'12px 14px', textAlign:'left', whiteSpace:'nowrap', borderBottom:'1px solid var(--border-blue)', background:'#EAF3FF' }
  const td = { padding:'12px 14px', fontSize:13.2, color:'var(--ink)', verticalAlign:'middle' }
  const sth = { fontSize:'11.5px', fontWeight:600, letterSpacing:'.06em', textTransform:'uppercase', color:'#0a4a8c', padding:'12px 16px', textAlign:'left', whiteSpace:'nowrap', background:'#EAF3FF', borderBottom:'1px solid var(--border-blue)' }
  const std = { padding:'13px 16px', fontSize:'13.5px', color:'var(--ink)', whiteSpace:'nowrap', verticalAlign:'middle' }
  const dangerGhost = { height:32, padding:'0 12px', borderRadius:9, border:'1px solid #F3C2C2', background:'#FEF2F2', color:'#B42318', fontFamily:'inherit', fontSize:12.6, fontWeight:600, cursor:'pointer', whiteSpace:'nowrap', display:'inline-flex', alignItems:'center', gap:6 }
  const winDay = x => x.length === 10 ? x.slice(8, 10) + '/' + (+x.slice(5, 7)) + '/' + x.slice(0, 4) : x.replace('T', ' ')
  const winLabel = hasWin ? (fWin.from ? winDay(fWin.from) : '…') + ' → ' + (fWin.to ? winDay(fWin.to) : 'now') : null
  const monoS = { fontFamily:'ui-monospace,SFMono-Regular,Menlo,monospace', fontSize:'12.9px', color:'var(--muted)' }

  return (
    <div style={{ animation:'fadeUp .28s ease' }}>
      <PageHead title="Sessions" sub={'Sign-in sessions for ' + tenant.name + ' accounts. Inactive history loads on demand.'}>
        <div style={{ display:'flex', alignItems:'center', gap:10, flexWrap:'wrap' }}>
          <span style={{ fontSize:12.4, color:'var(--muted)', whiteSpace:'nowrap' }}>{'Updated ' + (ago < 1 ? 'just now' : ago + ' min ago')}</span>
          <button data-ix="ghost" onClick={refresh} style={S.ghost}><Icon d="M23 4v6h-6 M20.49 15a9 9 0 1 1-2.12-9.36L23 10" size={15} />Refresh</button>
          <button data-ix="ghost" aria-label="Export to Excel" onClick={() => toast && toast('Export started. You will be notified when the file is ready.', 'success')} style={S.ghost}><ExcelIcon />Export</button>
        </div>
      </PageHead>

      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(210px, 1fr))', gap:14, marginBottom:16 }}>
        {kpi(hasWin ? 'Active in range' : 'Active sessions', allAct.length, idleN + ' idle > 30 min', 'green', allAct.length ? (allAct.length - idleN) / allAct.length * 100 : 0, 'M3 5h18v11H3z M8 20h8 M12 16v4')}
        {kpi('Accounts signed in', signedIn, signedIn + ' of ' + data.length, 'blue', data.length ? signedIn / data.length * 100 : 0, 'M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M23 21v-2a4 4 0 0 0-3-3.87 M16 3.13a4 4 0 0 1 0 7.75')}
        {kpi('3+ sessions', heavy, heavy ? 'Review shared use' : 'None flagged', 'amber', signedIn ? heavy / signedIn * 100 : 0, 'M12 9v4 M12 17h.01 M10.3 3.9L1.8 18a2 2 0 0 0 1.7 3h17a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z')}
        {kpi(hasWin ? 'Inactive in range' : 'Inactive · 24h', in24.length, breakdown(in24) || '—', 'red', in24.length ? endedHard / in24.length * 100 : 0, 'M12 8v4l3 2 M12 21a9 9 0 1 1 0-18 9 9 0 0 1 0 18z')}
      </div>

      <section style={S.card}>
        <div style={{ display:'flex', gap:12, alignItems:'center', flexWrap:'wrap', padding:'14px 16px', borderBottom:'1px solid var(--border)', background:'var(--surface-alt)' }}>
          <div style={{ position:'relative', flex:1, minWidth:220, maxWidth:340 }}>
            <span aria-hidden style={{ position:'absolute', left:12, top:'50%', transform:'translateY(-50%)', color:'var(--muted)', display:'flex' }}><SearchIcon /></span>
            <input aria-label="Search sessions" type="text" value={search} onChange={(e) => setSearch(e.target.value)} placeholder="Search name, email or IP…" style={{ ...S.input, height:38, fontSize:13.8, padding:'0 12px 0 36px' }} />
          </div>
          <FilterBar filters={[
            { key:'win', label:'Date', type:'range', value:fWin, onChange:setFWin },
            { key:'device', label:'Device', value:fDevice, onChange:setFDevice, options:['All', 'Desktop', 'Mobile', 'Tablet'] },
            ...(view !== 'inactive' ? [{ key:'count', label:'Active sessions', value:fCount, onChange:setFCount, options:['All', '1', '2', '3+', '5+'] }] : []),
            ...(view !== 'active' ? [{ key:'state', label:'State', value:fState, onChange:setFState, options:['All', 'Expired', 'Logged out', 'Revoked', 'Locked'] }] : []),
          ]} />
          <div style={{ marginLeft:'auto' }}>{seg(view, (v) => { setView(v); if (v === 'active') setFState('All'); if (v === 'inactive') { setSel([]); setFCount('All') } }, [['active', 'Active'], ['inactive', 'Inactive'], ['all', 'All']])}</div>
        </div>

        {hasWin && <div style={{ display:'flex', alignItems:'center', gap:10, flexWrap:'wrap', padding:'10px 16px', borderBottom:'1px solid var(--border)', fontSize:12.8, color:'var(--muted)' }}>
          <Icon d="M8 2v4 M16 2v4 M3 9h18 M3 5h18v16H3z" size={14} style={{ color:'var(--primary)' }} />
          <span>Showing sessions <b style={{ fontWeight:600, color:'var(--ink)' }}>active at any time between {winLabel}</b> · {accRows.length} account{accRows.length === 1 ? '' : 's'}</span>
          <button type="button" onClick={() => setFWin({ from:'', to:'' })} style={{ marginLeft:'auto', border:'none', background:'transparent', color:'var(--primary)', fontFamily:'inherit', fontSize:12.8, fontWeight:600, cursor:'pointer', padding:0 }}>Back to live view</button>
        </div>}

        {canRevoke && sel.length > 0 && <div style={{ display:'flex', alignItems:'center', gap:12, flexWrap:'wrap', padding:'10px 16px', background:'var(--primary-tint)', borderBottom:'1px solid var(--border-blue)', fontSize:13 }}>
          <b style={{ fontWeight:600, color:'var(--on-tint-blue)' }}>{sel.length} account{sel.length === 1 ? '' : 's'} selected</b>
          <span style={{ color:'var(--muted)' }}>· {selActive} active session{selActive === 1 ? '' : 's'}</span>
          <button type="button" disabled={!selActive} onClick={askBulk} style={{ marginLeft:'auto', ...S.modalBtnPrimary, height:34, padding:'0 14px', fontSize:13, background:'var(--danger)', boxShadow:'none', display:'inline-flex', alignItems:'center', gap:7, opacity: selActive ? 1 : .5 }}><Icon d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4 M16 17l5-5-5-5 M21 12H9" size={14} sw={2.2} />Revoke all sessions ({selAccts.length})</button>
          <button type="button" data-ix="ghost" onClick={() => setSel([])} style={{ ...S.ghost, height:34, fontSize:13 }}>Clear</button>
        </div>}

        {accRows.length ? (
          <>
            <div className="tscroll" style={{ overflowX:'auto' }}>
              <table style={{ width:'100%', borderCollapse:'collapse', minWidth:920 }}>
                <thead><tr>
                  {canRevoke && <th scope="col" style={{ ...th, width:44, textAlign:'center' }}><span role="checkbox" aria-checked={pageAll ? 'true' : pageSome ? 'mixed' : 'false'} aria-label="Select all on page" tabIndex={0} onClick={togglePage} onKeyDown={(e) => { if (e.key === ' ') { e.preventDefault(); togglePage() } }} style={{ display:'inline-flex', cursor:'pointer' }}><span style={{ display:'flex', pointerEvents:'none' }}><Checkbox checked={pageAll} indeterminate={pageSome} /></span></span></th>}
                  <th scope="col" style={th}>Account</th>
                  <th scope="col" style={th}>Active sessions</th>
                  <th scope="col" style={th}>Last activity</th>
                  <th scope="col" style={th}>Last device · location</th>
                  <th scope="col" style={th}>{hasWin ? 'Inactive (range)' : 'Inactive (24h)'}</th>
                  <th scope="col" style={{ ...th, textAlign:'right' }}>Actions</th>
                </tr></thead>
                <tbody>
                  {pageRows.map(a => {
                    const on = sel.includes(a.login), open = openAcc === a.login
                    const revocable = a.act.filter(s => !isMe(a, s)).length
                    const accList = a.sessions.filter(s => inWin(s) && devOk(s) && viewOk(s, accView) && (accView === 'active' || stateOk(s))).sort((x, y) => y.last - x.last)
                    return (
                      <React.Fragment key={a.login}>

                                {accList.map((s, k) => {
                                  const st = SES_STATES[isIdle(s) ? 'idle' : s.state], me = isMe(a, s), act = isActive(s)
                                  return (
                                    <tr key={s.id} data-ix="row" style={{ borderBottom: k < accList.length - 1 ? '1px solid var(--border)' : 'none' }}>

                                      <td style={std}>{s.method}</td>
                                      <td style={{ ...std, ...monoS }}>{s.ip}</td>

                                        <span style={{ display:'flex', flexDirection:'column', gap:2 }}>
                                          <span style={{ display:'inline-flex', alignItems:'center', gap:6, width:'fit-content', padding:'1px 9px', borderRadius:999, background:st.bg, border:'1px solid ' + st.bd, color:st.fg, fontSize:11.6, fontWeight:600 }}><span aria-hidden style={{ width:6, height:6, borderRadius:999, background:'currentColor' }} />{st.label}</span>
                                          {!act && s.detail && <span style={{ fontSize:11.2, color:'var(--muted)' }}>{s.detail}</span>}
                                        </span>
                                      </td>
                                      <td style={{ ...std, textAlign:'right' }}>{act ? (me ? <span style={{ fontSize:11.6, color:'var(--muted)' }}>Current</span> : <button type="button" onClick={() => askOne(a, s)} style={{ ...dangerGhost, height:28, fontSize:12, padding:'0 10px', background:'var(--surface)' }}>Revoke</button>) : s.state === 'locked' ? <span style={{ fontSize:11.6, color:'var(--muted)' }}>Unlock in Accounts</span> : null}</td>
                                    </tr>
                                  )

                              </tbody>
                            </table>
                          </div>
                          {accView !== 'active' && <div style={{ marginTop:8, fontSize:11.6, color:'var(--muted)' }}>Inactive sessions are read-only{hasWin ? '' : ' · last 7 days, newest first'}.</div>}
                          </div>
                        </td></tr>}
                      </React.Fragment>
                    )
                  })}
                </tbody>
              </table>
            </div>
            <Pager total={accRows.length} page={w.cur} size={size} onPage={setPage} onSize={setSize} />
          </>
        ) : <Empty title={view === 'active' ? 'No active sessions' : 'No sessions match'} hint={q || hasWin || fDevice !== 'All' || fState !== 'All' || fCount !== 'All' ? 'Try clearing the search or filters.' : view === 'active' ? 'Nobody in this tenant is signed in right now.' : 'There is no inactive session history.'} />}
      </section>

      {confirm && <SessionRevokeModal c={confirm} onClose={() => setConfirm(null)} onConfirm={doRevoke} />}
    </div>
  )
}

          <textarea id="revoke-comment" value={comment} maxLength={250} rows={3} onChange={(e) => setComment(e.target.value)} placeholder="Add context for the audit trail, e.g. ticket number" style={{ ...S.input, height:'auto', minHeight:84, padding:'10px 14px', lineHeight:1.5, resize:'vertical', fontSize:13.6 }} />

          <span style={{ display:'flex', marginTop:1, pointerEvents:'none' }}><Checkbox checked={reset} /></span>

        </div>}
        <div style={{ display:'flex', gap:10, alignItems:'flex-start', padding:'10px 12px', borderRadius:10, background:'var(--surface-alt)', border:'1px solid var(--border)', fontSize:12.2, color:'var(--muted)', lineHeight:1.5 }}>
          <Icon d="M12 16v-4 M12 8h.01 M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z" size={14} style={{ flex:'none', marginTop:2 }} />
          Refresh tokens for these sessions are invalidated too, so the user can’t silently sign back in.
        </div>
      </div>
    </Modal>
  )
}

function GenericList({ list, listSearch, setListSearch }) {
  const [sort, setSort] = useState({ col:-1, dir:'asc' })
  const [page, setPage] = useState(1)
  const [size, setSize] = useState(10)
  const [fStatus, setFStatus] = useState('All')
  const [fTag, setFTag] = useState('All')
  const [fWin, setFWin] = useState({ from:'', to:'' })
  React.useEffect(() => { setPage(1) }, [listSearch, size, sort, fStatus, fTag, fWin])
  const dataCols = list.hasActions ? list.columns.length - 1 : list.columns.length
  let rows = list.rows
  const fDef = list.filters
  const statusOpts = fDef && fDef.status != null ? ['All', ...Array.from(new Set(list.rows.map(r => r.cells[fDef.status].text)))] : null
  const tagOpts = fDef && fDef.tag ? ['All', ...Array.from(new Set(list.rows.map(r => r.tag).filter(Boolean)))] : null
  if (fDef) {
    const wf = fWin.from ? drBound(fWin.from, false) : null
    const wt = fWin.to ? drBound(fWin.to, true) : null
    const parseTs = (x) => {
      const s0 = String(x).replace(',', '')
      const hasYear = /\b\d{4}\b/.test(s0)
      return Date.parse(hasYear ? s0 : s0.replace(/^(\d{1,2} [A-Za-z]{3}) (?=\d)/, '$1 2026 '))
    }
    rows = rows.filter(r => {
      if (fDef.tag && fTag !== 'All' && r.tag !== fTag) return false
      if (fDef.status != null && fStatus !== 'All' && r.cells[fDef.status].text !== fStatus) return false
      if (fDef.window != null && (wf !== null || wt !== null)) {
        const t = parseTs(r.cells[fDef.window].text)
        if (isNaN(t)) return false
        if (wf !== null && t < wf) return false
        if (wt !== null && t > wt) return false
      }
      return true
    })
  }
  if (sort.col >= 0 && sort.col < dataCols) {
    const dir = sort.dir === 'asc' ? 1 : -1
    rows = [...rows].sort((a, b) => {
      const av = a.cells[sort.col].text, bv = b.cells[sort.col].text
      const an = parseFloat(String(av).replace(/[^\d.\-]/g, '')), bn = parseFloat(String(bv).replace(/[^\d.\-]/g, ''))
      if (!isNaN(an) && !isNaN(bn) && /\d/.test(String(av)) && /\d/.test(String(bv))) return (an - bn) * dir
      return String(av).localeCompare(String(bv)) * dir
    })
  }
  const w = pageWindow(rows.length, page, size)
  const pageRows = rows.slice(w.from > 0 ? w.from - 1 : 0, w.to)
  const doSort = (i) => setSort(s => s.col === i ? { col:i, dir: s.dir === 'asc' ? 'desc' : 'asc' } : { col:i, dir:'asc' })
  return (
    <div style={{ animation:'fadeUp .28s ease' }}>
      <PageHead title={list.title} sub={list.subtitle}>
        {list.exportable && <button data-ix="ghost" aria-label="Export to Excel" onClick={list.exportAction} style={S.ghost}><ExcelIcon />Export</button>}
        {list.newAction && <button data-ix="primary" onClick={list.newAction.onClick} style={S.primary}><Icon d="M12 5v14 M5 12h14" size={15} />{list.newAction.label}</button>}
      </PageHead>
      <section style={S.card}>
        <div style={{ display:'flex', gap:12, alignItems:'center', flexWrap:'wrap', padding:'14px 16px', borderBottom:'1px solid var(--border)', background:'var(--surface-alt)' }}>
          <div style={{ position:'relative', flex:1, minWidth:220, maxWidth:340 }}>
            <span aria-hidden style={{ position:'absolute', left:12, top:'50%', transform:'translateY(-50%)', color:'var(--muted)', display:'flex' }}><SearchIcon /></span>
            <input aria-label="Search" type="text" value={listSearch} onChange={(e) => setListSearch(e.target.value)} placeholder="Search…" style={{ ...S.input, height:38, fontSize:13.8, padding:'0 12px 0 36px' }} />
          </div>
          {fDef && <FilterBar filters={[
            ...(fDef.tag ? [{ key:'tag', label:fDef.tag.label || 'Set', value:fTag, onChange:setFTag, options:tagOpts }] : []),
            ...(fDef.status != null ? [{ key:'status', label:'Status', value:fStatus, onChange:setFStatus, options:statusOpts }] : []),
            ...(fDef.window != null ? [{ key:'win', label:'Window', type:'range', value:fWin, onChange:setFWin }] : []),
          ]} />}
        </div>
        {list.hasRows ? (
          <>
            <div className="tscroll" style={{ overflowX:'auto' }}>
              <table style={{ width:'100%', borderCollapse:'collapse', minWidth:list.minWidth }}>
                <thead><tr>{list.columns.map((c, i) => <Th key={i} label={c.label} align={c.align} sortable={c.sortable} active={sort.col === i} dir={sort.dir} onSort={() => doSort(i)} />)}</tr></thead>
                <tbody>
                  {pageRows.map(row => (
                    <tr key={row.key} data-ix="row" style={{ borderBottom:'1px solid var(--border)' }}>
                      {row.cells.map((cell, i) => (
                        <td key={i} style={cell.tdStyle}>{cell.isBadge ? <span style={cell.badgeStyle}>{cell.text}</span> : cell.text}</td>
                      ))}
                      {list.hasActions && (
                        <td style={{ padding:'13px 16px' }}>
                          <RowActions>{row.actions.map((a, i) => <IconBtn key={i} label={a.ariaLabel} d={a.icon} onClick={a.onClick} />)}</RowActions>
                        </td>
                      )}
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <Pager total={rows.length} page={w.cur} size={size} onPage={setPage} onSize={setSize} />
          </>
        ) : <Empty title="Nothing matches your search" hint="Try a different term." />}
      </section>
    </div>
  )
}

function PasswordPolicy({ minLen, setMinLen, toast }) {
  const allToggles = [...pwToggles, ...pwPatternToggles, ...pwMfaToggles]
  const [tgState, setTgState] = useState(() => { const o = {}; allToggles.forEach(t => { o[t.key] = t.on }); return o })
  const [nums, setNums] = useState({ max_length:128, max_age_days:90, min_age_days:1, history_count:5, max_failed_attempts:5, lockout_duration_minutes:15 })
  const flip = (k) => setTgState(s => ({ ...s, [k]: !s[k] }))
  const complexity = pwToggles.filter(t => tgState[t.key]).length
  const summary = [
    'Minimum ' + minLen + ' characters, maximum ' + nums.max_length,
    complexity + ' of 4 complexity rules enforced',
    'Repeated and common passwords blocked',
    'Expires every ' + nums.max_age_days + ' days, changeable after ' + nums.min_age_days + ' day' + (nums.min_age_days === 1 ? '' : 's'),
    'Cannot reuse last ' + nums.history_count + ' passwords',
    'Locks for ' + nums.lockout_duration_minutes + ' min after ' + nums.max_failed_attempts + ' failed attempts',
    tgState.require_mfa_for_reset ? 'MFA required to reset a password' : 'MFA not required to reset',
  ]
  const numField = (label, code, unit, min, max, step) => (
    <Stepper key={code} label={label} value={nums[code]} min={min} max={max} step={step}
      onChange={(v) => setNums(s => ({ ...s, [code]: v }))} helperText={unit + ' \u00B7 ' + code} />
  )
  const toggleRow = (tg) => (
    <button key={tg.key} type="button" role="switch" aria-checked={tgState[tg.key]} data-ix="ix" onClick={() => flip(tg.key)} style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:16, padding:'12px 14px', border:'1px solid var(--border)', borderRadius:10, background:'var(--surface-alt)', textAlign:'left', font:'inherit', width:'100%' }}>
      <span style={{ flex:1, minWidth:0 }}>
        <span style={{ display:'block', fontSize:13.8, fontWeight:600, color:'var(--ink)', lineHeight:1.4 }}>{tg.label}</span>
        <span style={{ display:'block', fontSize:12, color:'var(--muted)', lineHeight:1.45, marginTop:3 }}>{tg.hint}</span>
      </span>
      <span aria-hidden style={{ width:44, height:26, borderRadius:999, background: tgState[tg.key] ? 'var(--primary)' : '#C7D0DD', position:'relative', flex:'none', transition:'background-color .16s ease' }}><span style={{ position:'absolute', top:3, left: tgState[tg.key] ? 21 : 3, width:20, height:20, borderRadius:'50%', background:'#fff', transition:'left .16s cubic-bezier(.22,1,.36,1)' }} /></span>
    </button>
  )
  const cardHead = (title, note) => (
    <div style={{ ...S.cardHead, display:'flex', alignItems:'baseline', justifyContent:'space-between', gap:12, flexWrap:'wrap' }}>
      <h2 style={{ fontSize:15.6, fontWeight:600, margin:0, color:'var(--ink)' }}>{title}</h2>
      <span style={{ fontSize:12, color:'var(--muted)' }}>{note}</span>
    </div>
  )
  return (
    <div style={{ animation:'fadeUp .28s ease', maxWidth:1040 }}>
      <div style={{ marginBottom:18 }}><h1 style={S.h1}>Password Policy</h1><p style={S.sub}>Applies to all users across every tenant.</p></div>
      <div style={{ display:'grid', gridTemplateColumns:'1.5fr 1fr', gap:16, alignItems:'start' }}>
        <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
          <section style={S.card}>
            {cardHead('Length', 'Prevents short, brute-forceable passwords')}
            <div style={{ padding:18, display:'grid', gridTemplateColumns:'repeat(2, minmax(0, 1fr))', gap:16, alignItems:'start' }}>
              <Stepper label="Minimum length" value={minLen} min={6} max={64} step={1} onChange={setMinLen} helperText={'chars · min_length'} />
              {numField('Maximum length', 'max_length', 'chars', 32, 256, 8)}
            </div>
          </section>
          <section style={S.card}>
            {cardHead('Complexity', 'Character classes a password must contain')}
            <div style={{ padding:18, display:'flex', flexDirection:'column', gap:12 }}>{pwToggles.map(toggleRow)}</div>
          </section>
          <section style={S.card}>
            {cardHead('Repetition & patterns', 'Blocks predictable and breached passwords')}
            <div style={{ padding:18, display:'flex', flexDirection:'column', gap:12 }}>{pwPatternToggles.map(toggleRow)}</div>
          </section>
          <section style={S.card}>
            {cardHead('Rotation, reuse & lockout', 'Ageing, history and failed-attempt handling')}
            <div style={{ padding:18, display:'grid', gridTemplateColumns:'repeat(2, minmax(0, 1fr))', gap:16 }}>
              {numField('Expires after', 'max_age_days', 'days', 0, 365, 15)}
              {numField('Minimum age', 'min_age_days', 'days', 0, 30, 1)}
              {numField('Remember last', 'history_count', 'passwords', 0, 24, 1)}
              {numField('Max failed attempts', 'max_failed_attempts', 'tries', 3, 10, 1)}
              {numField('Lockout duration', 'lockout_duration_minutes', 'minutes', 5, 120, 5)}
            </div>
          </section>
          <section style={S.card}>
            {cardHead('MFA integration', 'Secures the password reset flow')}
            <div style={{ padding:18, display:'flex', flexDirection:'column', gap:12 }}>{pwMfaToggles.map(toggleRow)}</div>
          </section>
        </div>
        <aside style={{ ...S.card, border:'1px solid var(--border-blue)', position:'sticky', top:88 }}>
          <div style={S.cardHead}><h2 style={{ fontSize:15.6, fontWeight:600, margin:0, color:'var(--ink)' }}>Current policy</h2></div>
          <ul style={{ listStyle:'none', margin:0, padding:'14px 18px', display:'flex', flexDirection:'column', gap:11 }}>
            {summary.map((row, i) => (
              <li key={i} style={{ display:'flex', alignItems:'center', gap:10, fontSize:13.3, color:'var(--ink)' }}>
                <span aria-hidden style={{ flex:'none', width:20, height:20, borderRadius:'50%', background:'var(--green-tint)', color:'var(--success)', display:'flex', alignItems:'center', justifyContent:'center' }}><Icon d="M20 6L9 17l-5-5" size={12} sw={3} /></span>{row}
              </li>
            ))}
          </ul>
        </aside>
      </div>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'center', flexWrap:'wrap', gap:12, marginTop:16, padding:'14px 18px', background:'var(--surface)', border:'1px solid var(--border-blue)', borderRadius:14, boxShadow:'0 4px 16px -8px rgba(16,42,84,.12)' }}>
        <span style={{ display:'inline-flex', alignItems:'center', gap:8, fontSize:12.9, color:'var(--success-text)' }}><Icon d="M20 6L9 17l-5-5" size={15} sw={2.5} />All changes saved automatically.</span>
        <div style={{ display:'flex', gap:10, flexWrap:'wrap' }}>
          <button data-ix="ghost" onClick={() => toast('Policy reset to defaults.', 'info')} style={S.modalBtnGhost}>Reset to defaults</button>
          <button data-ix="primary" onClick={() => toast('Password policy saved.', 'success')} style={S.modalBtnPrimary}>Save policy</button>
        </div>
      </div>
    </div>
  )
}

function UnitMenu({ node, openUnit, openStatus, confirmDelete, onDelete, toast }) {
  const [open, setOpen] = useState(false)

function Privileges({ tree, toast, onToggleActive }) {
  const allCodes = () => { const a = []; const w = (ns) => ns.forEach(n => { if (n.children && n.children.length) { a.push(n.code); w(n.children) } }); w(tree); return a }
  const [expanded, setExpanded] = useState(() => new Set(tree.map(a => a.code)))
  const [selected, setSelected] = useState(tree[0] ? tree[0].code : null)
  const [search, setSearch] = useState('')
  const [appFilter, setAppFilter] = useState('All applications')
  const [ddOpen, setDdOpen] = useState(false)
  const [view, setView] = useState('table')
  const toggle = (code) => setExpanded(s => { const n = new Set(s); n.has(code) ? n.delete(code) : n.add(code); return n })

  const q = search.trim().toLowerCase()
  const matches = (n) => !q || n.name.toLowerCase().includes(q) || (n.code || '').toLowerCase().includes(q) || (n.wbs || '').toLowerCase().includes(q)
  const prune = (nodes) => nodes.map(n => {
    const kids = prune(n.children || [])
    if (matches(n) || kids.length) return { ...n, children: kids }
    return null
  }).filter(Boolean)

function OrgStructure({ toast, openUnit, openStatus, confirmDelete, tree, onDelete, viewOnly }) {

  const [selected, setSelected] = useState('EXA-ROOT')

  const allCodes = () => { const a = []; const w = (ns) => ns.forEach(n => { if (n.children && n.children.length) { a.push(n.code); w(n.children) } }); w(tree); return a }
  const find = (nodes, code) => { for (const n of nodes) { if (n.code === code) return n; if (n.children) { const r = find(n.children, code); if (r) return r } } return null }
  const cur = find(tree, selected) || tree[0]
  const curKids = cur ? (cur.children || []) : []
  const pickChild = (c) => { setSelected(c.code); setExpanded(s => { const x = new Set(s); x.add(cur.code); return x }) }
  const wrapRef = React.useRef(null)
  const treeRef = React.useRef(null)
  const panelRef = React.useRef(null)
  const [line, setLine] = useState(null)
  React.useLayoutEffect(() => {
    const calc = () => {
      const wrap = wrapRef.current, tree = treeRef.current, panel = panelRef.current
      if (!wrap || !tree || !panel) { setLine(null); return }
      const row = wrap.querySelector('[data-node-code="' + selected + '"]')

      const w = wrap.getBoundingClientRect(), tr = tree.getBoundingClientRect(), pr = panel.getBoundingClientRect(), rr = row.getBoundingClientRect()
      if (pr.left < tr.right - 4) { setLine(null); return }
      setLine({ x1: tr.right - w.left, y1: rr.top - w.top + rr.height / 2, x2: pr.left - w.left, y2: pr.top - w.top + 34, col: LVLC[Math.min(cur ? cur.level : 0, LVLC.length - 1)] })

function Toasts({ toasts, onDismiss }) {
  const map = {
    success: { icon:'M20 6L9 17l-5-5', color:'var(--success)', tint:'var(--green-tint)', title:'Success' },
    info: { icon:'M12 16v-4 M12 8h.01 M12 22a10 10 0 1 1 0-20 10 10 0 0 1 0 20z', color:'var(--primary)', tint:'var(--primary-tint)', title:'Info' },
    danger: { icon:'M12 8v4 M12 16h.01 M12 22a10 10 0 1 1 0-20 10 10 0 0 1 0 20z', color:'var(--danger)', tint:'#FDECEC', title:'Error' },
    warning: { icon:'M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z M12 9v4 M12 17h.01', color:'var(--warning)', tint:'var(--amber-tint)', title:'Warning' },
  }
  return (
    <div aria-live="polite" style={{ position:'fixed', right:20, top:80, zIndex:5000, display:'flex', flexDirection:'column', gap:10, pointerEvents:'none' }}>
      {toasts.map(t => {
        const c = map[t.kind] || map.info
        return (
          <div key={t.id} role="status" style={{ position:'relative', display:'flex', alignItems:'flex-start', gap:12, width:344, padding:'13px 14px 13px 15px', background:'var(--surface)', border:'1px solid var(--border-blue)', borderLeft:'4px solid '+c.color, borderRadius:12, boxShadow:'0 12px 32px -12px rgba(16,42,84,.28)', animation:'toastIn .24s cubic-bezier(.22,1,.36,1)', pointerEvents:'auto', overflow:'hidden' }}>
            <span aria-hidden style={{ flex:'none', display:'inline-flex', alignItems:'center', justifyContent:'center', width:30, height:30, borderRadius:8, background:c.tint, color:c.color }}><Icon d={c.icon} size={17} sw={2.3} /></span>
            <div style={{ flex:1, minWidth:0, paddingTop:1 }}>
              <div style={{ fontSize:12.6, fontWeight:600, color:'var(--ink)', lineHeight:1.3 }}>{c.title}</div>
              <div style={{ fontSize:12.9, fontWeight:400, color:'var(--muted)', lineHeight:1.45, marginTop:2 }}>{t.msg}</div>
            </div>
            <button type="button" onClick={() => onDismiss(t.id)} aria-label="Dismiss notification" data-ix="tclose"
              style={{ flex:'none', width:24, height:24, marginTop:-1, marginRight:-2, borderRadius:7, border:'none', background:'transparent', color:'var(--muted)', display:'flex', alignItems:'center', justifyContent:'center', cursor:'pointer' }}>
              <Icon d="M18 6L6 18 M6 6l12 12" size={14} sw={2.2} />
            </button>
            <span aria-hidden style={{ position:'absolute', left:0, bottom:0, height:2.5, background:c.color, opacity:.5, animation:'toastBar 4.5s linear forwards', width:'100%', transformOrigin:'left' }} />
          </div>
        )
      })}
    </div>
  )
}

/* ===================== modals ===================== */
function Modal({ title, desc, onClose, stop, width = 540, children, footer, shake, onShakeEnd }) {
  const titleId = 'modal-title-' + React.useId()
  const [entered, setEntered] = useState(false)
  const anim = shake ? 'shakeX .3s ease' : (entered ? 'none' : 'popIn .2s ease')
  const onEnd = () => { if (shake) onShakeEnd && onShakeEnd(); else setEntered(true) }
  return (
    <div onClick={onClose} role="dialog" aria-modal="true" aria-labelledby={titleId} aria-describedby={titleId + '-desc'} style={S.overlay}>
      <div onClick={stop} onAnimationEnd={onEnd} style={{ ...S.modal, maxWidth:width, animation:anim }}>
        <div style={S.modalHead}>
          <div>
            <h3 id={titleId} style={{ fontSize:19, fontWeight:500, margin:0, color:'var(--ink)', lineHeight:1.25 }}>{title}</h3>
            <p id={titleId + '-desc'} style={{ fontSize:14, color:'var(--muted)', margin:'5px 0 0', lineHeight:1.4 }}>{desc}</p>
          </div>
          <CloseBtn onClose={onClose} />
        </div>
        <div style={S.modalBody}>{children}</div>
        <div style={S.modalFoot}>{footer}</div>
      </div>
    </div>
  )
}
function ModalFooter({ onClose, onSave, save, danger }) {
  return <><button data-ix="ghost" onClick={onClose} style={S.modalBtnGhost}>Cancel</button><button data-ix="primary" onClick={onSave} style={danger ? { ...S.modalBtnPrimary, background:'var(--danger)', boxShadow:'0 2px 6px -2px rgba(220,38,38,.35)' } : S.modalBtnPrimary}>{save}</button></>
}
function Toggle({ title, hint }) {
  return (
    <div style={{ gridColumn:'1 / -1', display:'flex', alignItems:'center', justifyContent:'space-between', padding:'12px 14px', border:'1px solid var(--border)', borderRadius:10, background:'var(--surface-alt)' }}>
      <span style={{ display:'flex', flexDirection:'column', gap:2 }}><span style={{ fontSize:13.8, fontWeight:600, color:'var(--ink)' }}>{title}</span><span style={{ fontSize:12, color:'var(--muted)' }}>{hint}</span></span>
      <span aria-hidden style={S.toggleTrack}><span style={S.toggleKnob} /></span>
    </div>
  )
}
function ToggleField({ title, hint, checked, onChange }) {
  return (
    <div style={{ gridColumn:'1 / -1', display:'flex', alignItems:'center', justifyContent:'space-between', gap:14, padding:'12px 14px', border:'1px solid var(--border)', borderRadius:10, background:'var(--surface)' }}>
      <span style={{ display:'flex', flexDirection:'column', gap:2 }}><span style={{ fontSize:13.8, fontWeight:600, color:'var(--ink)' }}>{title}</span><span style={{ fontSize:12, color:'var(--muted)' }}>{hint}</span></span>
      <button type="button" role="switch" aria-checked={checked} aria-label={title} onClick={() => onChange(!checked)}
        style={{ flex:'none', width:44, height:26, borderRadius:999, border:'none', padding:3, background: checked ? 'var(--primary)' : '#C4CDD9', cursor:'pointer', display:'inline-flex', alignItems:'center', transition:'background .2s ease' }}>
        <span aria-hidden style={{ width:20, height:20, borderRadius:'50%', background:'#fff', boxShadow:'0 1px 3px rgba(16,42,84,.3)', transform: checked ? 'translateX(18px)' : 'translateX(0)', transition:'transform .2s cubic-bezier(.22,1,.36,1)' }} />
      </button>
    </div>
  )
}
function Section({ title, hint, icon, children, cols = 3 }) {
  return (
    <section style={{ border:'1px solid var(--border)', borderRadius:12, background:'var(--surface)', boxShadow:'0 1px 2px rgba(16,42,84,.03)' }}>
      <header style={{ display:'flex', alignItems:'center', gap:11, padding:'11px 16px', background:'var(--surface-alt)', borderBottom:'1px solid var(--border)', borderRadius:'12px 12px 0 0' }}>
        <span aria-hidden style={{ flex:'none', width:30, height:30, borderRadius:8, background:'var(--primary-tint)', color:'var(--primary)', display:'flex', alignItems:'center', justifyContent:'center' }}><Icon d={icon} size={16} sw={2.1} /></span>
        <div style={{ display:'flex', flexDirection:'column', gap:1 }}>
          <h4 style={{ fontSize:13.3, fontWeight:600, color:'var(--ink)', margin:0, lineHeight:1.2 }}>{title}</h4>
          {hint && <span style={{ fontSize:11.8, color:'var(--muted)' }}>{hint}</span>}
        </div>
      </header>
      <div style={{ padding:16, display:'grid', gridTemplateColumns:'repeat(' + cols + ',1fr)', gap:16, background:'var(--primary-tint-2)', borderRadius:'0 0 12px 12px' }}>{children}</div>
    </section>
  )
}

function TenantModal({ onClose, stop, ddProps, toast, record, confirmCreate }) {

  const validateMsg = () => {
    const issues = []
    if (!f.values.subject.trim()) issues.push('Subject is empty.')

    if ((channels.includes('SMS') || channels.includes('Push')) && !f.values.shortMsg.trim()) issues.push('Short message is required for SMS / push channels.')
    const used = []

    const scan = f.values.subject + ' ' + f.values.shortMsg + ' ' + f.values.longMsg
    let m
    while ((m = re.exec(scan))) used.push(m[1] || m[2])

function OrgUnitNode({ node, depth, value, onSelect, expanded, setExpanded }) {
  const kids = node.children || []
  const open = !!expanded[node.code]
  const sel = value === node.name
  return (
    <div>
      <div data-ix="row" role="treeitem" aria-selected={sel} aria-expanded={kids.length ? open : undefined} onClick={() => onSelect(node.name)}
        style={{ display:'flex', alignItems:'center', gap:8, padding:'7px 10px', paddingLeft:10 + depth * 22, borderRadius:8, cursor:'pointer', background: sel ? 'var(--primary-tint)' : 'transparent' }}>
        {kids.length > 0
          ? <button type="button" aria-label={(open ? 'Collapse ' : 'Expand ') + node.name} onClick={(e) => { e.stopPropagation(); setExpanded(x => ({ ...x, [node.code]: !open })) }}
              style={{ flex:'none', width:20, height:20, display:'flex', alignItems:'center', justifyContent:'center', border:'none', background:'transparent', color:'var(--muted)', cursor:'pointer', padding:0 }}>
              <Icon d="M9 18l6-6-6-6" size={12} style={{ transform: open ? 'rotate(90deg)' : 'none', transition:'transform .15s ease' }} />

        <span style={{ fontSize:13.2, fontWeight: sel ? 600 : 500, color:'var(--ink)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{node.name}</span>

}

              </div>
              <label style={{ display:'flex', alignItems:'center', gap:10, cursor:'pointer', flex:'none' }}>
                <span style={{ fontSize:13, fontWeight:600, color: appCount > 0 ? 'var(--primary)' : 'var(--muted)' }}>{appCount > 0 ? 'Enabled' : 'Disabled'}</span>
                <button type="button" role="switch" aria-checked={appCount > 0} aria-label={'Toggle all privileges in ' + app.name} onClick={() => setKeys(appLeaves, appCount === 0)}
                  style={{ flex:'none', width:46, height:26, borderRadius:999, border:'none', padding:3, background: appCount > 0 ? 'var(--primary)' : '#C4CDD9', cursor:'pointer', display:'inline-flex', justifyContent: appCount > 0 ? 'flex-end' : 'flex-start', transition:'background .16s ease' }}>
                  <span style={{ width:20, height:20, borderRadius:'50%', background:'#fff', boxShadow:'0 1px 2px rgba(0,0,0,.25)' }} />
                </button>
              </label>
            </div>
            <div style={{ display:'flex', alignItems:'center', gap:14, marginTop:16 }}>
              <div aria-hidden style={{ flex:1, height:8, borderRadius:999, background:'var(--surface-alt)', overflow:'hidden', boxShadow:'inset 0 0 0 1px var(--border)' }}>
                <div style={{ height:'100%', width: appPct + '%', borderRadius:999, background:'var(--primary)', transition:'width .2s ease' }} />
              </div>
              <span style={{ fontSize:12.6, color:'var(--muted)', fontVariantNumeric:'tabular-nums', flex:'none' }}><b style={{ color:'var(--ink)', fontWeight:700 }}>{appCount}</b> of {appLeaves.length} permissions</span>
            </div>
          </div>
          <div style={{ padding:'8px 26px 22px', overflowY:'auto', flex:1, minHeight:0 }}>
            {cats.map(cat => {
              const keys = cat.perms.map(p => p.k)
              const on = keys.filter(k => sel.has(k)).length
              const st = stateOf(keys)
              return (
                <div key={cat.id} style={{ padding:'16px 0', borderBottom:'1px solid var(--border)' }}>
                  <div style={{ display:'flex', alignItems:'center', gap:10, marginBottom:12 }}>
                    <h4 style={{ fontSize:13.6, fontWeight:600, color:'var(--ink)', margin:0 }}>{cat.name}</h4>
                    <span style={{ fontSize:11.4, fontWeight:700, fontVariantNumeric:'tabular-nums', color: st === 'all' ? 'var(--success)' : on > 0 ? 'var(--on-tint-blue)' : 'var(--muted)', background: st === 'all' ? 'var(--green-tint)' : on > 0 ? 'var(--primary-tint)' : 'var(--surface-alt)', borderRadius:999, padding:'2px 9px' }}>{on}/{keys.length}</span>
                    <button data-ix="lnk" onClick={() => setKeys(keys, st !== 'all')} style={{ marginLeft:'auto', background:'none', border:'none', font:'inherit', fontSize:12.4, fontWeight:600, color: st === 'all' ? 'var(--muted)' : 'var(--primary)', cursor:'pointer', padding:'4px 6px', borderRadius:7 }}>{st === 'all' ? 'Deselect all' : 'Select all'}</button>
                  </div>
                  <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill,minmax(320px,1fr))', gap:12 }}>
                    {cat.perms.map(p => {
                      const isOn = sel.has(p.k)
                      return (
                        <label key={p.k} data-ix="prow" style={{ display:'flex', alignItems:'flex-start', gap:12, padding:'12px 13px', borderRadius:11, cursor:'pointer', border:'1px solid ' + (isOn ? 'var(--border-blue)' : 'var(--border)'), background: isOn ? 'var(--primary-tint)' : 'var(--surface)', transition:'background .13s ease,border-color .13s ease' }}>
                          <Check on={isOn} onClick={() => toggleLeaf(p.k)} label={p.name} />
                          <span style={{ display:'flex', flexDirection:'column', gap:3, minWidth:0 }}>
                            <span style={{ fontSize:13.4, fontWeight:600, color:'var(--ink)', lineHeight:1.3 }}>{p.name}</span>
                            {p.desc && <span style={{ fontSize:11.8, color:'var(--muted)', lineHeight:1.45, textWrap:'pretty' }}>{p.desc}</span>}
                          </span>
                        </label>
                      )
                    })}
                  </div>
                </div>
              )
            })}
          </div>
        </div>
      </div>
    </Modal>
  )
}


function PolicyModal({ onClose, stop, toast, record }) {

  const [active, setActive] = React.useState(record ? record.status === 'Active' : true)
  const [conds, setConds] = React.useState(() => (seed && seed.conditions.length ? seed.conditions.map(c => ({ ...blank(), ...c })) : [blank()]))

  )
  const upd = (id, patch) => setConds(cs => cs.map(c => {
    if (c.id !== id) return c
    const n = { ...c, ...patch }
    const attr = findAttr(n.lt, n.la)
    const ops = attr ? OPS[attr.type] : []
    if (!ops.find(o => o[0] === n.op)) n.op = ops.length ? ops[0][0] : ''
    if (n.rt !== 'Static value') { const ra = findAttr(n.rt, n.ra); if (!ra || !attr || ra.type !== attr.type) n.ra = '' }
    if (n.op === 'between' && n.rt !== 'Static value') n.rt = 'Static value'
    return n
  }))
  const remove = (id) => setConds(cs => cs.length > 1 ? cs.filter(c => c.id !== id) : cs)
  const add = () => setConds(cs => [...cs, blank()])
  const complete = (c) => { const a = findAttr(c.lt, c.la); if (!a || !c.op) return false; if (c.rt === 'Static value') return c.op === 'between' ? !!(c.v1 && c.v2) : !!c.v1; return !!c.ra }
  const errs = { name: !name.trim() ? 'Policy name is required.' : '', code: !edit && !code.trim() ? 'Code is required.' : '', conds: !conds.every(complete) ? 'Complete every condition or remove the unfinished ones.' : '' }
  const valid = !errs.name && !errs.code && !errs.conds
  const save = () => { if (!valid) { setSubmitted(true); setShake(true); return } onClose(); toast(edit ? 'Policy \u201c' + name + '\u201d updated.' : 'Policy \u201c' + name + '\u201d created.', 'success') }
  const opLabel = (c) => { const a = findAttr(c.lt, c.la); const o = a && OPS[a.type].find(x => x[0] === c.op); return o ? o[1] : '' }
  const rhs = (c) => c.rt === 'Static value' ? (c.op === 'between' ? (c.v1 || '\u2026') + ' and ' + (c.v2 || '\u2026') : (c.v1 ? (c.op === 'in' ? '[' + c.v1 + ']' : '\u201c' + c.v1 + '\u201d') : '\u2026')) : (c.ra ? c.rt.toLowerCase() + '.' + c.ra : '\u2026')
  const sentence = (c) => (c.la ? c.lt.toLowerCase() + '.' + c.la : '\u2026') + ' ' + (opLabel(c) || '\u2026') + ' ' + rhs(c)

    : <><button data-ix="ghost" onClick={onClose} style={S.modalBtnGhost}>Cancel</button><button data-ix="primary" onClick={save} style={S.modalBtnPrimary}>{edit ? 'Save changes' : 'Create policy'}</button></>
  return (
    <Modal title={ro ? 'Policy \u2014 ' + name : edit ? 'Edit policy' : 'New ABAC policy'} desc={ro ? 'Read-only view of this policy\u2019s rules.' : 'Define who may access what, under which conditions.'} onClose={onClose} stop={stop} width={1160} shake={shake} onShakeEnd={() => setShake(false)} footer={footer}>
      <div style={{ padding: '22px 26px 26px', display: 'flex', flexDirection: 'column', gap: 20 }}>

        <div style={{ display: 'grid', gridTemplateColumns: 'minmax(0, 1.6fr) minmax(160px, 260px)', gap: 16 }}>

                      </div>

                  </div>

            })}
            {!ro && <button type="button" data-ix="ghost" onClick={add} style={{ marginTop: 14, alignSelf: 'flex-start', display: 'inline-flex', alignItems: 'center', gap: 8, height: 40, padding: '0 14px', border: '1.5px dashed var(--border-blue)', borderRadius: 10, background: 'var(--primary-tint-2)', color: 'var(--primary)', fontFamily: 'inherit', fontSize: 13.4, fontWeight: 600, cursor: 'pointer' }}><Icon d="M12 5v14 M5 12h14" size={15} sw={2.4} />Add condition</button>}
          </div>
          <div style={{ padding: '14px 18px', borderTop: '1px solid var(--border)', background: 'var(--surface-page)', display: 'flex', gap: 12, alignItems: 'flex-start' }}>
            <span aria-hidden style={{ flex: 'none', width: 30, height: 30, borderRadius: 8, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', background: effect === 'Allow' ? '#ECFDF3' : '#FDECEC', color: effect === 'Allow' ? '#1F7A4D' : '#B42318' }}><Icon d={effect === 'Allow' ? 'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z M9 12l2 2 4-4' : 'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z M15 9l-6 6 M9 9l6 6'} size={15} /></span>

            </div>
          </div>
        </section>
      </div>
    </Modal>
  )
}

function AppClientModal({ onClose, stop, toast, record }) {
  const det = (record && appClientDetails[record.code]) || {}
  const [active, setActive] = useState(record ? record.status === 'Active' : true)
  const f = useForm({ code: record?.code || '', name: record?.name || '', desc: det.desc || '', redirectUri: det.redirectUri || '' }, v => {
    const e = {}
    if (!v.name.trim()) e.name = 'Client name is required.'
    if (!v.redirectUri.trim()) e.redirectUri = 'Redirect URI is required.'
    else if (!/^https:\/\/.+\..+/i.test(v.redirectUri.trim())) e.redirectUri = 'Enter a valid https:// URL.'
    return e
  })
  const validateMsg = () => {
    const issues = []
    if (!f.values.subject.trim()) issues.push('Subject is empty.')
    if (!f.values.shortMsg.trim() && !f.values.longMsg.trim()) issues.push('Provide a short or long message body.')
    if ((channels.includes('SMS') || channels.includes('Push')) && !f.values.shortMsg.trim()) issues.push('Short message is required for SMS / push channels.')
    const used = []
    const re = /\{\{\s*([\w.]+)\s*\}\}|\{(\w+)\}/g
    const scan = f.values.subject + ' ' + f.values.shortMsg + ' ' + f.values.longMsg
    let m
    while ((m = re.exec(scan))) used.push(m[1] || m[2])
    used.filter((v, i) => used.indexOf(v) === i).forEach(p => { if (!params.includes(p)) issues.push('Placeholder \u201c' + p + '\u201d is not in the parameters list.') })
    const ok = issues.length === 0
    setMsgCheck({ ok, issues })
    toast(ok ? 'Message validated \u2014 ready to send.' : 'Validation found ' + issues.length + ' issue' + (issues.length > 1 ? 's' : '') + '.', ok ? 'success' : 'warning')
  }
  const exportEvt = () => toast('Exporting event configuration\u2026', 'success')
  const save = () => f.trySubmit(() => { onClose(); toast('Application client updated successfully.', 'success') })
  return (
    <Modal title="Edit application client" desc="Update this client application registration." onClose={onClose} stop={stop} width={640} shake={f.shake} onShakeEnd={f.clearShake} footer={<ModalFooter onClose={onClose} onSave={save} save="Save changes" />}>

        {f.submitted && !f.valid && <ErrBanner />}
        <div>
          <label style={S.label}>Code</label>
          <div style={{ minHeight:44, borderRadius:10, border:'1.5px solid #E4E9F0', background:'var(--surface-alt)', padding:'10px 14px', fontSize:14, color:'var(--muted)', display:'flex', alignItems:'center' }}>{record?.code || '\u2014'}</div>
        </div>
        <Field id="ac-name" label="Name" req value={f.values.name} onChange={f.set('name')} error={f.err('name')} placeholder="e.g. Career Portal" />
        <div>
          <label htmlFor="ac-desc" style={S.label}>Description</label>
          <textarea id="ac-desc" rows={3} value={f.values.desc} onChange={f.set('desc')} placeholder="What does this client application do?" style={{ ...S.input, height:'auto', padding:'11px 14px', resize:'vertical' }} />
        </div>
        <Field id="ac-uri" label="Redirect URI" req value={f.values.redirectUri} onChange={f.set('redirectUri')} error={f.err('redirectUri')} placeholder="https://app.example.edu/callback" />

      </div>
    </Modal>
  )
