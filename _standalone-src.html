        </div>}
        summary={(lapsed ? lapsed + ' app' + (lapsed === 1 ? ' has' : 's have') + ' lapsed · ' : '') + (in30 ? in30 + ' app' + (in30 === 1 ? '' : 's') + ' expire within 30 days.' : 'No apps expire in the next 30 days.') + (nextApp ? ' Next: ' + nextApp.name + ' on ' + dashDate(nextApp.days) + '.' : '')}>
        <div style={{ display:'flex', flexDirection:'column', padding:'6px 18px 10px' }}>
          {appShown.length === 0 && <div style={{ padding:'22px 0', textAlign:'center', fontSize:13, color:'var(--muted)' }}>No application licenses end in this window.</div>}
          {appShown.map((a, i) => { const tn = expTone(a.days); return (
            <div key={a.code} style={{ display:'grid', gridTemplateColumns:'34px minmax(0,1.4fr) 96px minmax(64px,1fr) 118px', alignItems:'center', gap:'10px 14px', padding:'10px 0', borderTop: i ? '1px solid var(--border)' : 'none' }}>
              <span aria-hidden="true" style={{ width:34, height:34, borderRadius:9, display:'flex', alignItems:'center', justifyContent:'center', background:'var(--primary-tint)', border:'1px solid var(--border-blue)', color:'var(--on-tint-blue)', fontSize:11.5, fontWeight:700 }}>{a.code}</span>
              <span style={{ display:'flex', flexDirection:'column', gap:2, minWidth:0 }}><span style={{ fontSize:13.2, fontWeight:600, color:'var(--ink)', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{a.name}</span><span style={{ fontSize:12, color:'var(--muted)' }}>{dashFmt(a.active)} active accounts</span></span>
              <span style={{ display:'flex', flexDirection:'column', gap:2 }}><span style={{ fontSize:11, fontWeight:600, letterSpacing:'.05em', textTransform:'uppercase', color:'var(--muted)' }}>{a.days < 0 ? 'Ended' : 'Ends'}</span><span style={{ fontSize:13, fontWeight:500, color:'var(--ink)', fontVariantNumeric:'tabular-nums', whiteSpace:'nowrap' }}>{dashDate(a.days)}</span></span>
              <span style={{ display:'flex', flexDirection:'column', gap:5 }}>
                <span style={{ fontSize:12.4, fontWeight:600, color:tn.c, fontVariantNumeric:'tabular-nums' }}>{a.days < 0 ? Math.abs(a.days) + ' days ago' : a.days + ' days left'}</span>
                <span aria-hidden="true" style={{ height:6, borderRadius:999, background:'var(--surface-alt)', overflow:'hidden' }}><span style={{ display:'block', height:'100%', width: (a.days < 0 ? 100 : Math.max(4, Math.min(100, a.days / 365 * 100))) + '%', borderRadius:999, background:tn.bar, opacity: a.days < 0 ? .35 : 1 }} /></span>
              </span>
              <span style={{ justifySelf:'end', display:'inline-flex', alignItems:'center', gap:6, padding:'3px 10px', borderRadius:999, background:tn.bg, border:'1px solid ' + tn.bd, color:tn.c, fontSize:11.8, fontWeight:600, whiteSpace:'nowrap' }}><span aria-hidden="true" style={{ width:6, height:6, borderRadius:999, background:'currentColor' }} />{tn.l}</span>
            </div>
          ) })}
        </div>
      </DashCard>

      <div style={flexRow}>
        {!self && <DashCard title="Concurrent users" sub="Signed in right now" style={{ flex:'1 1 min(100%, 240px)' }} summary={`Peak of ${dashFmt(ccPeak)} at ${ccPeakAt} in the last 24 hours.`}>
          <div style={{ flex:1, display:'flex', flexDirection:'column', justifyContent:'center', gap:10, padding:'20px 20px 22px' }}>
            <span style={{ display:'inline-flex', alignItems:'center', gap:8, width:'fit-content', height:26, padding:'0 10px', borderRadius:999, background:'#EAF6EF', border:'1px solid #BFE3CE', fontSize:12, fontWeight:600, color:'#1E7A4F' }}><span aria-hidden="true" style={{ width:7, height:7, borderRadius:'50%', background:'#16A34A', boxShadow:'0 0 0 3px rgba(22,163,74,.18)' }} />Live</span>
            <span style={{ fontSize:44, fontWeight:600, lineHeight:1, color:'var(--ink)', fontVariantNumeric:'tabular-nums' }}>{dashFmt(ccNow)}</span>
            <span style={{ fontSize:12.8, color:'var(--muted)' }}>{(t.users ? Math.round(ccNow / t.users * 100) : 0) + '% of ' + dashFmt(t.users) + ' accounts online'}</span>
          </div>
        </DashCard>}
        {self && <DashCard title="Application usage" sub="Active accounts per app, last 7 days" style={{ flex:'2 1 min(100%, 420px)' }}
          action={go && <button data-ix="ghost" onClick={() => go('appClients')} style={{ ...S.ghost, height:32, fontSize:12.5, padding:'0 12px', whiteSpace:'nowrap' }}>App clients<Icon d="M5 12h14 M12 5l7 7-7 7" size={13} /></button>}
          summary={`${apps[0].name} is the most used app (${apps[0].pct}% of accounts). ${appsLow.length ? appsLow.map(a => a.name).join(', ') + ' adoption is under 25%.' : 'All apps are above 25% adoption.'}`}>
          <DashAppUsage apps={apps} />
        </DashCard>}
        <DashCard title="Failed notifications" sub="Last 24 hours" style={{ flex:'1 1 min(100%, 300px)' }}
          action={go && <button data-ix="ghost" onClick={() => go('notifications')} style={{ ...S.ghost, height:32, fontSize:12.5, padding:'0 12px', whiteSpace:'nowrap' }}>View all<Icon d="M5 12h14 M12 5l7 7-7 7" size={13} /></button>}
          summary={nf.failed ? `${dashFmt(nf.failed)} of ${dashFmt(nf.sent)} notifications failed in the last 24 hours.` : 'All notifications were delivered.'}>
          <div style={{ flex:1, display:'flex', flexDirection:'column', gap:16, padding:'16px 18px' }}>
            <div style={{ display:'flex', alignItems:'flex-end', gap:12, flexWrap:'wrap' }}>
              <span style={{ fontSize:32, fontWeight:600, lineHeight:1, color: nfTone, fontVariantNumeric:'tabular-nums' }}>{dashFmt(nf.failed)}</span>
              <span style={{ fontSize:12.5, color:'var(--muted)', paddingBottom:3 }}>{'of ' + dashFmt(nf.sent) + ' sent · ' + nfRate + '% failure rate'}</span>
            </div>
            <div style={{ display:'flex', flexDirection:'column', gap:11 }}>
              {nf.channels.map(c => <div key={c.label} style={{ display:'grid', gridTemplateColumns:'56px minmax(0,1fr) 36px', alignItems:'center', gap:10, fontSize:12.8 }}>
                <span style={{ color:'var(--ink)', fontWeight:500 }}>{c.label}</span>
                <span aria-hidden="true" style={{ height:8, borderRadius:999, background:'var(--surface-alt)', overflow:'hidden' }}><span style={{ display:'block', height:'100%', width: (nfMax ? c.value / nfMax * 100 : 0) + '%', borderRadius:999, background:'linear-gradient(90deg,#F37B7B,#DC2626)' }} /></span>
                <span style={{ textAlign:'right', fontWeight:600, color:'var(--ink)', fontVariantNumeric:'tabular-nums' }}>{dashFmt(c.value)}</span>
              </div>)}
            </div>
          </div>
        </DashCard>
      </div>

      {!self && <div style={flexRow}>{attnCard}</div>}

      <div style={flexRow}>
        <DashCard title="Daily sign-ins" sub="Last 14 days" style={{ flex:'2 1 min(100%, 420px)' }} summary={`Averaging ${dashFmt(avg)} sign-ins per day; peak of ${dashFmt(peak)} on ${peakDay}.`}>
          <div style={{ padding:'14px 16px 6px' }}><DashBars id={'dashSi' + t.code} data={st.signins} labels={days} unit="sign-ins" /></div>
        </DashCard>
        <DashCard title="MFA adoption" sub="Accounts with a second factor" style={{ flex:'1 1 min(100%, 240px)' }} summary={st.mfa < 80 ? 'Below the 80% recommended baseline.' : 'Meets the 80% recommended baseline.'}>
          <div style={{ flex:1, display:'flex', flexDirection:'column', justifyContent:'center', alignItems:'center', gap:6, padding:'18px 16px' }}>
            <DashGauge id={'dashMfa' + t.code} pct={st.mfa} />
            <span style={{ fontSize:13, color:'var(--ink)', fontWeight:500 }}>{dashFmt(Math.round(t.users * st.mfa / 100))} of {dashFmt(t.users)} accounts</span>
          </div>
        </DashCard>
      </div>

      <div style={flexRow}>
        {self && attnCard}
        {self && (
        <DashCard title="Recent admin activity" sub="Changes made in this tenant" style={{ flex:'1 1 min(100%, 340px)' }}
          action={go && <button data-ix="ghost" onClick={() => go('auditLog')} style={{ ...S.ghost, height:32, fontSize:12.5, padding:'0 12px', whiteSpace:'nowrap' }}>Audit log<Icon d="M5 12h14 M12 5l7 7-7 7" size={13} /></button>}
          summary={st.activity.length + ' recent changes; latest ' + st.activity[0].when + '.'}>
          <ol style={{ listStyle:'none', margin:0, padding:'8px 18px 12px', display:'flex', flexDirection:'column' }}>
            {st.activity.map((a, i) => <li key={i} style={{ display:'grid', gridTemplateColumns:'30px minmax(0,1fr) auto', alignItems:'start', gap:12, padding:'10px 0', borderTop: i ? '1px solid var(--border)' : 'none' }}>
              <span aria-hidden="true" style={{ width:30, height:30, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', background:'var(--primary-tint)', color:'var(--primary)', fontSize:11, fontWeight:600 }}>{a.who.split(' ').map(w => w[0]).join('')}</span>

                <span style={{ fontSize:13, color:'var(--ink)', lineHeight:1.4, textWrap:'pretty' }}><strong style={{ fontWeight:600 }}>{a.who}</strong>{' ' + a.what + ' '}<strong style={{ fontWeight:600 }}>{a.target}</strong></span>
                <span style={{ fontSize:11.8, color:'var(--muted)' }}>{a.area}</span>
              </span>
              <span style={{ fontSize:11.8, color:'var(--muted)', whiteSpace:'nowrap', paddingTop:2 }}>{a.when}</span>
            </li>)}
          </ol>
        </DashCard>
        )}
        {!self && <DashCard title="Accounts by role" style={{ flex:'1 1 min(100%, 320px)' }}><DashDonut id={'dashR' + t.code} parts={st.rolesSplit} center={dashK(t.users)} centerSub="accounts" /></DashCard>}
        {!self && <DashCard title="Accounts by status" style={{ flex:'1 1 min(100%, 320px)' }}><DashDonut id={'dashS' + t.code} parts={st.status} center={Math.round(st.active / t.users * 100) + '%'} centerSub="active" /></DashCard>}
      </div>

    </div>
  )
}

function SearchBar({ value, onChange, placeholder, children, standalone, topRound }) {
  return (
    <div style={{ display:'flex', gap:12, alignItems:'center', flexWrap:'wrap', padding:'14px 16px', borderBottom: standalone ? 'none' : '1px solid var(--border)', borderRadius: standalone ? 13 : (topRound ? '13px 13px 0 0' : 0), background:'var(--surface-alt)' }}>
      <div style={{ position:'relative', flex:1, minWidth:220, maxWidth:340 }}>
        <span aria-hidden style={{ position:'absolute', left:12, top:'50%', transform:'translateY(-50%)', color:'var(--muted)', display:'flex' }}><SearchIcon /></span>
        <input aria-label="Search" type="text" value={value} onChange={onChange} placeholder={placeholder} style={{ ...S.input, height:44, fontSize:13.8, padding:'0 12px 0 36px' }} />
      </div>
      {children}
    </div>
  )
}

function RowActions({ children }) { return <div style={{ display:'flex', gap:8, alignItems:'center', justifyContent:'flex-end' }}>{children}</div> }
function IconBtn({ label, d, ix = 'ic', onClick, style }) {
  return <button data-ix={ix} aria-label={label} title={label} onClick={onClick} style={{ ...S.icon, ...style }}><Icon d={d} size={15} /></button>
}

function StatusToggle({ status, name, toast }) {
  const COLORS = { Draft:{bg:'var(--surface-alt)',color:'var(--muted)',bd:'var(--border)',dot:'#9AA6B4'}, Provisioning:{bg:'var(--primary-tint)',color:'var(--on-tint-blue)',bd:'transparent',dot:'var(--on-tint-blue)'}, Active:{bg:'var(--green-tint)',color:'var(--success-text)',bd:'transparent',dot:'var(--success)'}, Inactive:{bg:'var(--surface-alt)',color:'var(--muted)',bd:'var(--border)',dot:'#9AA6B4'}, Suspended:{bg:'#FDECEC',color:'#B42318',bd:'transparent',dot:'#DC2626'}, Expired:{bg:'var(--amber-tint)',color:'var(--warning-text)',bd:'transparent',dot:'var(--warning)'}, Deleted:{bg:'#FDECEC',color:'#B42318',bd:'transparent',dot:'#DC2626'} }
  const c = COLORS[status] || COLORS.Inactive
  return (
    <span aria-label={`${name} status: ${status}`} style={{ display:'inline-flex', alignItems:'center', gap:8, padding:'4px 11px', borderRadius:999, background:c.bg, color:c.color, border:'1px solid '+c.bd, fontSize:12.6, fontWeight:600, whiteSpace:'nowrap' }}>
      <span aria-hidden style={{ width:9, height:9, borderRadius:'50%', flex:'none', background:c.dot }} />
      {status}
    </span>
  )
}

function TenantMenu({ tenant, go, toast, confirm, openConfig, openAuthProviders, openHealth, openStatus, openLicense, openCreateLicense }) {
  const [open, setOpen] = React.useState(false)
  const [pos, setPos] = React.useState(null)
  const btnRef = React.useRef(null)
  const menuRef = React.useRef(null)
  React.useEffect(() => {
    if (!open) return
    const onDown = (e) => { if (btnRef.current && !btnRef.current.contains(e.target) && !(menuRef.current && menuRef.current.contains(e.target))) setOpen(false) }
    const onEsc = (e) => { if (e.key === 'Escape') setOpen(false) }
    document.addEventListener('mousedown', onDown); document.addEventListener('keydown', onEsc)
    return () => { document.removeEventListener('mousedown', onDown); document.removeEventListener('keydown', onEsc) }
  }, [open])
  const toggle = () => {
    if (!open && btnRef.current) {
      const r = btnRef.current.getBoundingClientRect()
      const W = 246, H = 364
      let left = Math.max(12, Math.min(r.right - W, window.innerWidth - W - 12))
      let top = r.bottom + 6
      if (top + H > window.innerHeight - 12) top = Math.max(12, r.top - H - 6)
      setPos({ top, left })
    }
    setOpen(o => !o)
  }
  const items = [
    { label:'Configure', icon:'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z', on:() => openConfig(tenant) },
    { label:'Business Configuration', icon:'M3 21h18 M5 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16 M9 7h4 M9 11h4 M9 15h4 M14 12h5a2 2 0 0 1 2 2v7', on:() => openConfig(tenant, 'business') },
    { label:'Authentication providers', icon:'M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z M9 12l2 2 4-4', on:() => openAuthProviders(tenant) },
    { label:'Manage status', icon:'M12 22a10 10 0 1 1 0-20 10 10 0 0 1 0 20z M8.5 12.5l2.5 2.5 4.5-5', on:() => openStatus(tenant) },
    { label:'Password policy', icon:'M5 11h14v10H5z M8 11V7a4 4 0 0 1 8 0 M12 15v2', on:() => go('passwordPolicy') },
    tenant.hasOrg
      ? { label:'Organization structure', icon:'M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7 M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4z', on:() => go('org') }
      : { label:'Create organization structure', icon:'M9 3H5v4h4z M19 3h-4v4h4z M12 11V7 M6 11v4h12v-4 M4 15h4v4H4z M16 15h4v4h-4z', on:() => go('org') },
    { label:'Run health check', icon:'M22 12h-4l-3 9L9 3l-3 9H2', on:() => openHealth(tenant) },
    { label:'License info', icon:'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6 M9 13h6 M9 17h6', on:() => openLicense(tenant) },
    { label:'Create license', icon:'M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6 M12 12v6 M9 15h6', on:() => openCreateLicense(tenant) },
  ]
  const run = (fn) => { setOpen(false); fn() }
  const menu = open && pos ? ReactDOM.createPortal(
    <ul ref={menuRef} role="menu" aria-label={'Actions for ' + tenant.name} style={{ position:'fixed', top:pos.top, left:pos.left, zIndex:4000, width:246, listStyle:'none', margin:0, padding:6, background:'var(--surface)', border:'1px solid var(--border)', borderRadius:12, boxShadow:'0 16px 40px -16px rgba(16,42,84,.32)', animation:'popIn .14s ease' }}>

function HealthCheckModal({ tenant, onClose, stop, toast }) {
  const [running, setRunning] = useState(true)
  React.useEffect(() => { const id = setTimeout(() => setRunning(false), 900); return () => clearTimeout(id) }, [])
  const checks = [
    { label:'Authentication service', ok:true, detail:'Responding · 42 ms' },
    { label:'Directory sync', ok:true, detail:'Last run 6 min ago' },
    { label:'MFA provider', ok:true, detail:'Operational' },
    { label:'License quota', ok:false, detail:'82% of seats used' },
    { label:'Audit log pipeline', ok:true, detail:'Streaming' },
    { label:'Data backup', ok:true, detail:'Completed 03:00' },
  ]
  const warns = checks.filter(c => !c.ok).length
  return (
    <Modal title={'Health check — ' + tenant.name} desc="Live status of core services for this tenant." onClose={onClose} stop={stop} width={560}
      footer={<><button data-ix="ghost" onClick={onClose} style={S.modalBtnGhost}>Close</button><button data-ix="primary" onClick={() => { onClose(); toast('Health report exported.', 'success') }} style={S.modalBtnPrimary}>Export report</button></>}>
      <div style={{ padding:24, display:'flex', flexDirection:'column', gap:14 }}>
        <div style={{ display:'flex', alignItems:'center', gap:12, padding:'14px 16px', borderRadius:12, background: warns ? 'var(--amber-tint)' : 'var(--green-tint)', border:'1px solid ' + (warns ? '#F1D8A8' : '#BFE6CC') }}>
          <span aria-hidden style={{ flex:'none', width:38, height:38, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', background: warns ? 'var(--warning)' : 'var(--success)', color:'#fff' }}><Icon d={warns ? 'M12 9v4 M12 17h.01 M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z' : 'M20 6L9 17l-5-5'} size={19} sw={2.4} /></span>
          <div style={{ display:'flex', flexDirection:'column', gap:2, flex:1, minWidth:0 }}>
            <span style={{ fontSize:14.3, fontWeight:600, color:'var(--ink)', lineHeight:1.3 }}>{running ? 'Running checks…' : warns ? warns + ' item needs attention' : 'All systems healthy'}</span>
            <span style={{ fontSize:12.4, color:'var(--muted)', lineHeight:1.3 }}>{checks.length} services checked</span>
          </div>
        </div>
        <div style={{ display:'flex', flexDirection:'column', gap:8 }}>
          {checks.map((c, i) => (
            <div key={c.label} style={{ display:'flex', alignItems:'center', gap:12, padding:'11px 14px', border:'1px solid var(--border)', borderRadius:10, background:'var(--surface)', opacity: running ? .5 : 1, transition:'opacity .3s ease ' + (i * 60) + 'ms' }}>
              <span aria-hidden style={{ flex:'none', width:26, height:26, borderRadius:'50%', display:'flex', alignItems:'center', justifyContent:'center', background: c.ok ? 'var(--green-tint)' : 'var(--amber-tint)', color: c.ok ? 'var(--success)' : 'var(--warning)' }}><Icon d={c.ok ? 'M20 6L9 17l-5-5' : 'M12 8v4 M12 16h.01 M12 22a10 10 0 1 1 0-20 10 10 0 0 1 0 20z'} size={14} sw={2.6} /></span>
              <span style={{ flex:1, minWidth:0, fontSize:13.5, fontWeight:500, color:'var(--ink)' }}>{c.label}</span>
              <span style={{ fontSize:12, color:'var(--muted)', whiteSpace:'nowrap', flex:'none' }}>{running ? '…' : c.detail}</span>
            </div>
          ))}
        </div>
      </div>
    </Modal>
  )
}

  const bandOpts = ['Any size', 'Under 500', '500–1,000', 'Over 1,000']
  const bandMatch = (b, n) => b === 'Any size' ? true : b === 'Under 500' ? n < 500 : b === '500–1,000' ? (n >= 500 && n <= 1000) : n > 1000
  const q = search.trim().toLowerCase()

        </svg>

function pageWindow(total, page, size) {
  const pageCount = Math.max(1, Math.ceil(total / size))
  const cur = Math.min(Math.max(1, page), pageCount)
  const from = total === 0 ? 0 : (cur - 1) * size + 1
  const to = Math.min(total, cur * size)
  let pages
  if (pageCount <= 7) pages = Array.from({ length: pageCount }, (_, i) => i + 1)
  else {
    const set = [...new Set([1, pageCount, cur, cur - 1, cur + 1])].filter(n => n >= 1 && n <= pageCount).sort((a, b) => a - b)
    pages = []; let prev = 0
    for (const n of set) { if (n - prev > 1) pages.push('\u2026'); pages.push(n); prev = n }
  }
  return { from, to, pages, cur, pageCount }
}

function EventMenu({ event, onView, onToggle, toast }) {
  const [open, setOpen] = React.useState(false)
  const [pos, setPos] = React.useState(null)
  const btnRef = React.useRef(null)
  const menuRef = React.useRef(null)
  React.useEffect(() => {
    if (!open) return
    const onDown = (e) => { if (btnRef.current && !btnRef.current.contains(e.target) && !(menuRef.current && menuRef.current.contains(e.target))) setOpen(false) }
    const onEsc = (e) => { if (e.key === 'Escape') setOpen(false) }
    document.addEventListener('mousedown', onDown); document.addEventListener('keydown', onEsc)
    return () => { document.removeEventListener('mousedown', onDown); document.removeEventListener('keydown', onEsc) }
  }, [open])
  const toggle = () => {
    if (!open && btnRef.current) {
      const r = btnRef.current.getBoundingClientRect()
      const W = 220, H = 108
      let left = Math.max(12, Math.min(r.right - W, window.innerWidth - W - 12))
      let top = r.bottom + 6
      if (top + H > window.innerHeight - 12) top = Math.max(12, r.top - H - 6)
      setPos({ top, left })
    }
    setOpen(o => !o)
  }
  const items = [
    { label:'View details', icon:'M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z', on:() => onView(event) },
    { label: event.active ? 'Deactivate' : 'Activate', icon:'M18.36 6.64a9 9 0 1 1-12.73 0 M12 2v10', on:() => { onToggle(event); toast(event.active ? 'Event deactivated.' : 'Event activated.', 'success') } },
  ]
  const run = (fn) => { setOpen(false); fn() }
  const menu = open && pos ? ReactDOM.createPortal(
    <ul ref={menuRef} role="menu" aria-label={'Actions for ' + event.name} style={{ position:'fixed', top:pos.top, left:pos.left, zIndex:4000, width:220, listStyle:'none', margin:0, padding:6, background:'var(--surface)', border:'1px solid var(--border)', borderRadius:12, boxShadow:'0 16px 40px -16px rgba(16,42,84,.32)', animation:'popIn .14s ease' }}>
      {items.map(it => (
        <li key={it.label} role="menuitem" tabIndex={0} data-ix="opt" onClick={() => run(it.on)} onKeyDown={(e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); run(it.on) } }}
          style={{ display:'flex', alignItems:'center', gap:11, padding:'10px 11px', borderRadius:8, cursor:'pointer', fontSize:13.3, fontWeight:500, color:'var(--ink)' }}>
          <Icon d={it.icon} size={16} style={{ stroke:'var(--muted)', flex:'none' }} />{it.label}
        </li>
      ))}
    </ul>, document.body) : null
  return (<React.Fragment><button ref={btnRef} data-ix="ic" title="More actions" aria-label={'More actions for ' + event.name} aria-haspopup="menu" aria-expanded={open} onClick={toggle} style={{ ...S.icon }}><Icon d="M5 12h.01 M12 12h.01 M19 12h.01" size={18} /></button>{menu}</React.Fragment>)
}

                <thead><tr>{cols.map((c, i) => <Th key={i} label={c.label} align="left" sortable={c.s} active={sort.col === i} dir={sort.dir} onSort={() => doSort(i)} />)}<th scope="col" style={{ ...S.th, background:'#EAF3FF', textAlign:'right' }}>Actions</th></tr></thead>
                <tbody>
                  {pageRows.map(e => (
                    <tr key={e.code} data-ix="row" style={{ borderBottom:'1px solid var(--border)' }}>
                      <td style={{ padding:'13px 16px' }}><span style={{ fontSize:12.4, fontWeight:700, fontFamily:mono, color:'#0a4a8c', letterSpacing:'.02em', background:'var(--primary-tint)', border:'1px solid #0a4a8c22', borderRadius:6, padding:'3px 8px', whiteSpace:'nowrap' }}>{e.code}</span></td>
                      <td style={{ padding:'13px 16px' }}><div style={{ fontSize:13.8, fontWeight:600, color:'var(--ink)' }}>{e.name}</div><div style={{ fontSize:12, color:'var(--muted)', marginTop:2, maxWidth:300, overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{e.subject}</div></td>
                      <td style={{ padding:'13px 16px' }}><PriorityPill p={e.priority} /></td>
                      <td style={{ padding:'13px 16px' }}>
                        <span style={{ display:'inline-flex', alignItems:'center', gap:7, fontSize:12.8, fontWeight:500, color:'var(--ink)' }}><Icon d={e.hasJob ? 'M8 2v4 M16 2v4 M3 9h18 M3 5h18v16H3z' : 'M13 2L3 14h9l-1 8 10-12h-9z'} size={14} style={{ stroke:'var(--muted)' }} />{e.hasJob ? 'Scheduled job' : 'Manual trigger'}</span>
                        {e.hasJob && e.jobName && <div style={{ fontSize:11.6, color:'var(--muted)', marginTop:3, marginLeft:21 }}>{e.jobName}</div>}
                      </td>
                      <td style={{ padding:'13px 16px' }}><ChannelBadges channels={e.channels} /></td>
                      <td style={{ padding:'13px 16px' }}><StatusToggle status={e.active ? 'Active' : 'Inactive'} name={e.name} /></td>
                      <td style={{ padding:'13px 16px' }}>
                        <RowActions>
                          <IconBtn label="Edit event" d="M12 20h9 M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z" onClick={() => openEdit(e)} />
                          <EventMenu event={e} onView={openView} onToggle={toggleEvent} toast={toast} />
                        </RowActions>
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
            <Pager total={rows.length} page={w.cur} size={size} onPage={setPage} onSize={setSize} />
          </>
        ) : <Empty title="No events match your filters" hint="Try a different term or priority." />}
      </section>
    </div>
  )
}

function ChipsInput({ id, values, onChange, placeholder, suggestions, mono }) {
  const [draft, setDraft] = useState('')
  const add = (v) => { const t = String(v).trim(); if (t && !values.includes(t)) onChange([...values, t]); setDraft('') }
  const remove = (i) => onChange(values.filter((_, x) => x !== i))
  const onKey = (e) => { if (e.key === 'Enter' || e.key === ',') { e.preventDefault(); add(draft) } else if (e.key === 'Backspace' && !draft && values.length) remove(values.length - 1) }
  const avail = (suggestions || []).filter(s => !values.includes(s))
  return (
    <div>
      <div style={{ display:'flex', flexWrap:'wrap', gap:7, alignItems:'center', minHeight:44, padding:'7px 10px', borderRadius:10, border:'1.5px solid #D5DBE4', background:'var(--surface)' }}>
        {values.map((v, i) => (
          <span key={v + i} style={{ display:'inline-flex', alignItems:'center', gap:6, padding:'4px 6px 4px 10px', borderRadius:8, background:'var(--primary-tint)', color:'var(--on-tint-blue)', fontSize:12.8, fontWeight:600, fontFamily: mono ? MONO : 'inherit' }}>
            {v}
            <button type="button" aria-label={'Remove ' + v} onClick={() => remove(i)} style={{ display:'inline-flex', border:'none', background:'transparent', color:'var(--on-tint-blue)', cursor:'pointer', padding:2, lineHeight:0, borderRadius:5 }}><Icon d="M18 6L6 18 M6 6l12 12" size={12} sw={2.4} /></button>
          </span>
        ))}
        <input id={id} value={draft} onChange={(e) => setDraft(e.target.value)} onKeyDown={onKey} onBlur={() => draft && add(draft)} placeholder={values.length ? '' : placeholder} style={{ flex:1, minWidth:130, border:'none', outline:'none', background:'transparent', fontFamily:'inherit', fontSize:14, color:'var(--ink)' }} />
      </div>
      {avail.length > 0 && (
        <div style={{ display:'flex', flexWrap:'wrap', gap:6, marginTop:8 }}>
          {avail.map(s => <button key={s} type="button" onClick={() => add(s)} style={{ display:'inline-flex', alignItems:'center', gap:5, padding:'4px 10px', borderRadius:999, border:'1px dashed #C7D0DD', background:'var(--surface-alt)', color:'var(--muted)', fontSize:12.4, fontWeight:600, cursor:'pointer' }}><Icon d="M12 5v14 M5 12h14" size={12} sw={2.4} />{s}</button>)}
        </div>
      )}
    </div>
  )
}

function ChoiceChips({ options, values, onChange }) {
  const toggle = (o) => onChange(values.includes(o) ? values.filter(v => v !== o) : [...values, o])
  return (
    <div style={{ display:'flex', flexWrap:'wrap', gap:8 }}>
      {options.map(o => {
        const on = values.includes(o)
        return (
          <button key={o} type="button" role="checkbox" aria-checked={on} onClick={() => toggle(o)} style={{ display:'inline-flex', alignItems:'center', gap:8, padding:'8px 13px', borderRadius:10, cursor:'pointer', fontSize:13.2, fontWeight:600, border:'1.5px solid ' + (on ? 'var(--primary)' : '#D5DBE4'), background: on ? 'var(--primary-tint)' : 'var(--surface)', color: on ? 'var(--on-tint-blue)' : 'var(--ink)' }}>
            <span aria-hidden style={{ width:17, height:17, borderRadius:5, flex:'none', display:'inline-flex', alignItems:'center', justifyContent:'center', border:'1.5px solid ' + (on ? 'var(--primary)' : '#C4CDD9'), background: on ? 'var(--primary)' : 'transparent' }}>{on && <Icon d="M20 6L9 17l-5-5" size={11} sw={3} style={{ stroke:'#fff' }} />}</span>
            {CH_ICON[o] && <Icon d={CH_ICON[o]} size={15} sw={1.9} style={{ stroke: on ? 'var(--on-tint-blue)' : 'var(--muted)', flex:'none' }} />}
            {o}
          </button>
        )
      })}
    </div>
  )
}

function EvtRow({ label, children, full }) {
  return (
    <div style={{ gridColumn: full ? '1 / -1' : 'auto', display:'flex', flexDirection:'column', gap:6, minWidth:0 }}>
      <span style={{ fontSize:11.4, fontWeight:700, letterSpacing:'.05em', textTransform:'uppercase', color:'var(--muted)' }}>{label}</span>
      <div style={{ fontSize:13.8, color:'var(--ink)', lineHeight:1.55 }}>{children}</div>
    </div>
  )
}

function tagRow(arr, mono) {
  if (!arr || !arr.length) return <span style={{ color:'var(--muted)' }}>—</span>
  return <div style={{ display:'flex', flexWrap:'wrap', gap:6 }}>{arr.map(x => <span key={x} style={{ fontSize:12.2, fontWeight:600, color:'var(--on-tint-blue)', background:'var(--primary-tint)', borderRadius:6, padding:'3px 9px', fontFamily: mono ? MONO : 'inherit' }}>{x}</span>)}</div>
}

function RO({ children }) {
  const empty = children === '' || children === undefined || children === null
  return <div style={{ minHeight:44, borderRadius:10, border:'1.5px solid #E4E9F0', background:'var(--surface-alt)', padding:'10px 14px', fontSize:14, color:'var(--muted)', display:'flex', alignItems:'center', gap:8, lineHeight:1.5 }}><span style={{ minWidth:0, flex:1 }}>{empty ? '—' : children}</span><span aria-hidden style={{ flex:'none', color:'#B9C2CF', display:'flex' }} title="Read-only"><Icon d="M5 11h14v10H5z M8 11V7a4 4 0 0 1 8 0v4" size={14} /></span></div>
}

function EventModal({ onClose, stop, toast, record, mode, onSubmit, onEdit }) {
  const view = mode === 'view'
  const edit = mode === 'edit'
  const [ddo, setDdo] = useState(null)
  const [app, setApp] = useState((record && record.app) || appClientNames[0])
  const [priority, setPriority] = useState((record && record.priority) || 'Medium')
  const [channels, setChannels] = useState(record && record.channels ? [...record.channels] : ['Email'])
  const [timings] = useState(record && record.timings ? [...record.timings] : ['Immediate'])
  const [deliveryMode, setDeliveryMode] = useState(record && record.timings && !(record.timings.length === 1 && record.timings[0] === 'Immediate') ? 'Scheduled' : 'Immediate')
  const [schedTimings, setSchedTimings] = useState(record && record.timings ? record.timings.filter(t => t !== 'Immediate').map(t => { const m = String(t).match(/([01]?\d|2[0-3]):[0-5]\d/); return m ? (m[0].length === 4 ? '0' + m[0] : m[0]) : null }).filter(Boolean) : [])
  const [schedTime, setSchedTime] = useState('')
  const addSchedTime = () => { if (!/^\d{2}:\d{2}$/.test(schedTime)) { toast('Pick a time in HH:MM format.', 'warning'); return } setSchedTimings(v => v.includes(schedTime) ? v : [...v, schedTime].sort()); setSchedTime('') }
  const [bcc, setBcc] = useState(record && record.bcc ? [...record.bcc] : [])
  const [msgCheck, setMsgCheck] = useState(null)
  const [params, setParams] = useState(record && record.parameters ? [...record.parameters] : [])
  const [hasJob, setHasJob] = useState(!!(record && record.hasJob))
  const [jobName, setJobName] = useState((record && record.jobName) || '')
  const [active, setActive] = useState(record ? record.active !== false : true)
  const f = useForm({ code:(record && record.code) || '', name:(record && record.name) || '', description:(record && record.description) || '', subject:(record && record.subject) || '', shortMsg:(record && record.shortMsg) || '', longMsg:(record && record.longMsg) || '' }, v => {
    const e = {}
    if (!v.code.trim()) e.code = 'Code is required.'
    if (!v.name.trim()) e.name = 'Name is required.'
    if (!v.subject.trim()) e.subject = 'Subject is required.'
    return e
  })
  const dd = (id, value, options, onSelect) => ({ value, options, open: ddo === id, onToggle: () => setDdo(o => o === id ? null : id), onSelect: (v) => { onSelect(v); setDdo(null) } })
  const validateMsg = () => {
    const issues = []
    if (!f.values.subject.trim()) issues.push('Subject is empty.')
    if (!f.values.shortMsg.trim() && !f.values.longMsg.trim()) issues.push('Provide a short or long message body.')
    if ((channels.includes('SMS') || channels.includes('Push')) && !f.values.shortMsg.trim()) issues.push('Short message is required for SMS / push channels.')
    const used = []
    const re = /\{\{\s*([\w.]+)\s*\}\}|\{(\w+)\}/g
    const scan = f.values.subject + ' ' + f.values.shortMsg + ' ' + f.values.longMsg
    let m
    while ((m = re.exec(scan))) used.push(m[1] || m[2])
    used.filter((v, i) => used.indexOf(v) === i).forEach(p => { if (!params.includes(p)) issues.push('Placeholder \u201c' + p + '\u201d is not in the parameters list.') })
    const ok = issues.length === 0
    setMsgCheck({ ok, issues })
    toast(ok ? 'Message validated \u2014 ready to send.' : 'Validation found ' + issues.length + ' issue' + (issues.length > 1 ? 's' : '') + '.', ok ? 'success' : 'warning')
  }
  const exportEvt = () => toast('Exporting event configuration\u2026', 'success')
  const save = () => f.trySubmit(() => {
    if (channels.length === 0) { toast('Select at least one delivery channel.', 'warning'); return }
    if (hasJob && !jobName) { toast('Select a job for scheduled invocation.', 'warning'); return }
    if (deliveryMode === 'Scheduled' && schedTimings.length === 0) { toast('Add at least one scheduled delivery timing.', 'warning'); return }
    if (bcc.some(b => !EMAIL_RE.test(b))) { toast('BCC contains an invalid email id.', 'warning'); return }
    onSubmit({ code:f.values.code.trim(), name:f.values.name.trim(), app, description:f.values.description.trim(), parameters:params, priority, subject:f.values.subject.trim(), shortMsg:f.values.shortMsg.trim(), longMsg:f.values.longMsg.trim(), channels, timings: deliveryMode === 'Immediate' ? ['Immediate'] : schedTimings, bcc, hasJob, jobName: hasJob ? jobName : '', active }, record)
    onClose()
    toast(edit ? 'Event updated successfully.' : 'Event created successfully.', 'success')
  })
  const taStyle = { ...S.input, height:'auto', padding:'10px 14px', resize:'vertical', lineHeight:1.5 }

  if (view) {
    return (
      <Modal title={record.name} desc={'Event configuration · ' + record.code} onClose={onClose} stop={stop} width={820}
        footer={<><button data-ix="ghost" onClick={() => toast('Exporting event configuration\u2026', 'success')} style={S.modalBtnGhost}><Icon d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4 M7 10l5 5 5-5 M12 15V3" size={15} />Export</button><button data-ix="ghost" onClick={onClose} style={S.modalBtnGhost}>Close</button><button data-ix="primary" onClick={onEdit} style={S.modalBtnPrimary}><Icon d="M12 20h9 M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z" size={15} />Edit event</button></>}>
        <div style={{ padding:24, display:'flex', flexDirection:'column', gap:16 }}>
          <div style={{ display:'flex', flexWrap:'wrap', alignItems:'center', gap:10, padding:'13px 16px', borderRadius:12, background:'var(--primary-tint-2)', border:'1px solid var(--border-blue)' }}>
            <span style={{ fontSize:12.6, fontWeight:700, fontFamily:MONO, color:'#0a4a8c', background:'var(--primary-tint)', border:'1px solid #0a4a8c22', borderRadius:6, padding:'3px 9px' }}>{record.code}</span>
            <span style={{ display:'inline-flex', alignItems:'center', gap:7, fontSize:12.8, fontWeight:600, color:'var(--ink)' }}><span aria-hidden style={{ width:8, height:8, borderRadius:'50%', background:PRIO_DOT[record.priority] || PRIO_DOT.Low }} />{record.priority} priority</span>
            <span aria-hidden style={{ width:1, height:16, background:'var(--border-blue)' }} />
            <span style={{ fontSize:12.8, fontWeight:600, color: record.active ? 'var(--success-text)' : 'var(--muted)' }}>{record.active ? 'Active' : 'Inactive'}</span>
          </div>
          <Section title="Identification" hint="What this event is and where it belongs." icon="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6" cols={2}>
            <EvtRow label="Code"><span style={{ fontFamily:MONO }}>{record.code}</span></EvtRow>
            <EvtRow label="Name">{record.name}</EvtRow>
            <EvtRow label="Application">{record.app}</EvtRow>
            <EvtRow label="Parameters">{tagRow(record.parameters, true)}</EvtRow>
            <EvtRow label="Description" full>{record.description || <span style={{ color:'var(--muted)' }}>—</span>}</EvtRow>
          </Section>
          <Section title="Message content" hint="Subject and body dispatched to recipients." icon="M4 4h16v16H4z M22 6l-10 7L2 6" cols={1}>
            <EvtRow label="Subject">{record.subject}</EvtRow>
            <EvtRow label="Short message">{record.shortMsg || <span style={{ color:'var(--muted)' }}>—</span>}</EvtRow>
            <EvtRow label="Long message"><span style={{ whiteSpace:'pre-wrap' }}>{record.longMsg || '—'}</span></EvtRow>
          </Section>
          <Section title="Delivery & invocation" hint="Channels, timings and how the event fires." icon="M22 2L11 13 M22 2l-7 20-4-9-9-4z" cols={2}>
            <EvtRow label="Delivery channels">{tagRow(record.channels)}</EvtRow>
            <EvtRow label="Message delivery timings">{tagRow(record.timings)}</EvtRow>
            <EvtRow label="Invocation through">{record.hasJob ? 'Scheduled job' : 'Manual trigger'}</EvtRow>
            <EvtRow label="Job name">{record.hasJob ? (record.jobName || '—') : <span style={{ color:'var(--muted)' }}>Not applicable</span>}</EvtRow>
          </Section>
        </div>
      </Modal>
    )
  }

  return (
    <Modal title={edit ? 'Edit event' : 'New event'} desc={edit ? 'Update this event’s configuration.' : 'Define a notification-triggering event.'} onClose={onClose} stop={stop} width={880} shake={f.shake} onShakeEnd={f.clearShake}
      footer={<><button data-ix="ghost" onClick={exportEvt} style={S.modalBtnGhost}><Icon d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4 M7 10l5 5 5-5 M12 15V3" size={15} />Export</button><button data-ix="ghost" onClick={onClose} style={S.modalBtnGhost}>Cancel</button><button data-ix="primary" onClick={save} style={S.modalBtnPrimary}>{edit ? 'Save changes' : 'Create event'}</button></>}>
      <div style={{ padding:24, display:'flex', flexDirection:'column', gap:16 }}>
        {f.submitted && !f.valid && <div style={{ display:'grid' }}><ErrBanner /></div>}
        {edit && <div style={{ display:'flex', alignItems:'center', gap:9, padding:'10px 14px', borderRadius:10, background:'var(--primary-tint-2)', border:'1px solid var(--border-blue)', color:'var(--ink)', fontSize:12.8, lineHeight:1.5 }}><Icon d="M12 16v-4 M12 8h.01 M12 22a10 10 0 1 1 0-20 10 10 0 0 1 0 20z" size={16} style={{ stroke:'var(--on-tint-blue)', flex:'none' }} />When editing an event, the subject, messages, delivery channels, delivery timing and status can be changed.</div>}
        <Section title="Identification" hint="Code, name and the application this event belongs to." icon="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6" cols={2}>
          <Field id="ev-code" label="Code" req value={f.values.code} onChange={f.set('code')} error={f.err('code')} placeholder="e.g. EVT_USER_INVITED">{edit ? <RO>{f.values.code}</RO> : null}</Field>
          <Field id="ev-name" label="Name" req value={f.values.name} onChange={f.set('name')} error={f.err('name')} placeholder="e.g. User Invited">{edit ? <RO>{f.values.name}</RO> : null}</Field>
          <Field id="ev-app" label="Application">{edit ? <RO>{app}</RO> : <Dropdown menuPortal {...dd('app', app, appClientNames, setApp)} ariaLabel="Application" leadIcon="M3 5h18v14H3z M3 9h18 M7 7h.01" />}</Field>
          <Field id="ev-desc" label="Description" full>
            {edit ? <RO>{f.values.description || '—'}</RO> : <textarea id="ev-desc" value={f.values.description} onChange={f.set('description')} rows={2} maxLength={500} placeholder="What this event represents and when it fires…" style={taStyle} />}

          <Field id="ev-short" label="Short message" hint="Up to 250 characters — used for SMS and push.">
            <textarea id="ev-short" value={f.values.shortMsg} onChange={f.set('shortMsg')} rows={2} maxLength={250} placeholder="Concise message for SMS / push…" style={taStyle} />
          </Field>
          <Field id="ev-long" label="Long message" hint="Up to 500 characters — used for email and in-app.">
            <textarea id="ev-long" value={f.values.longMsg} onChange={f.set('longMsg')} rows={4} maxLength={500} placeholder="Full message body…" style={taStyle} />

          <div style={{ display:'flex', flexDirection:'column', gap:10 }}>
            <div>
              <button type="button" data-ix="ghost" onClick={validateMsg} style={{ ...S.ghost, fontFamily:'inherit' }}><Icon d="M9 12l2 2 4-4 M12 22a10 10 0 1 1 0-20 10 10 0 0 1 0 20z" size={15} />Validate message</button>
            </div>
            {msgCheck && (msgCheck.ok
              ? <div role="status" style={{ display:'flex', alignItems:'center', gap:9, padding:'10px 14px', borderRadius:10, background:'var(--green-tint)', border:'1px solid #BBE3C5', color:'var(--success-text)', fontSize:13 }}><Icon d="M20 6L9 17l-5-5" size={15} sw={2.5} style={{ flex:'none' }} />Message looks good — subject, body and parameters are consistent.</div>

                  <ul style={{ margin:'6px 0 0', paddingLeft:22 }}>{msgCheck.issues.map((x, i) => <li key={i}>{x}</li>)}</ul>
                </div>)}

                {['Immediate', 'Scheduled'].map(o => {

  }, [open])

          style={{ display:'flex', alignItems:'center', gap:11, padding:'10px 11px', borderRadius:8, cursor: it.disabled ? 'not-allowed' : 'pointer', opacity: it.disabled ? .45 : 1, fontSize:13.3, fontWeight:500, color: it.danger ? '#B42318' : 'var(--ink)' }}>

function Notifications({ notifications, toast, openNew, openView, openEdit, deleteNotif, resendNotif, cancelNotif, exportAction }) {
  const [search, setSearch] = useState('')

  React.useEffect(() => { setPage(1) }, [search, status, evt, prio, chan, win, size, sort])
  const statusOpts = ['All', 'Draft', 'Queued', 'Processing', 'Sent', 'Delivered', 'Failed', 'Cancelled']
  const eventOpts = ['All', ...Array.from(new Set(notifications.map(n => n.event)))]
  const q = search.trim().toLowerCase()
  const winFrom = win.from ? drBound(win.from, false) : null
  const winTo = win.to ? drBound(win.to, true) : null
  const inWindow = (n) => {
    if (winFrom === null && winTo === null) return true
    const t = Date.parse(String(n.completedAt).replace(',', ''))
    if (isNaN(t)) return false
    return (winFrom === null || t >= winFrom) && (winTo === null || t <= winTo)
  }
  let rows = notifications.filter(n => (status === 'All' || n.status === status) && (evt === 'All' || n.event === evt) && (prio === 'All' || n.priority === prio) && (chan === 'All' || n.channel === chan) && inWindow(n) && (!q || (n.event + ' ' + n.recipient + ' ' + n.message).toLowerCase().includes(q)))
  if (sort.col >= 0) {
    const keyf = [n => n.event, n => n.recipient, n => n.channel, n => ({ High:0, Medium:1, Low:2 }[n.priority]), n => n.status][sort.col]
    const dir = sort.dir === 'asc' ? 1 : -1
    rows = [...rows].sort((a, b) => { const av = keyf(a), bv = keyf(b); return (av < bv ? -1 : av > bv ? 1 : 0) * dir })
  }
  const w = pageWindow(rows.length, page, size)
  const pageRows = rows.slice(w.from > 0 ? w.from - 1 : 0, w.to)
  const doSort = (i) => setSort(s => s.col === i ? { col:i, dir: s.dir === 'asc' ? 'desc' : 'asc' } : { col:i, dir:'asc' })
  const cols = [{ label:'Event', s:true }, { label:'Recipient', s:true }, { label:'Channel', s:true }, { label:'Priority', s:true }, { label:'Status', s:true }, { label:'Completed' }]

        {rows.length > 0 ? (

function fmtDur(ms) {
  if (ms == null) return '\u2014'
  if (ms < 1000) return ms + ' ms'
  const s = Math.round(ms / 100) / 10
  if (s < 60) return s + ' s'
  const m = Math.floor(s / 60), rem = Math.round(s % 60)
  return m + 'm' + (rem ? ' ' + rem + 's' : '')
}

function diSeeded(seed) { let s = seed; return () => { s = (s * 1103515245 + 12345) % 2147483648; return s / 2147483648 } }

function diGenerateRecords(connector, count, seed) {
  const rand = diSeeded(seed + connector.id.length * 977)
  const active = DI_RULES_SEED.filter(r => r.enabled && r.appliesTo.includes(connector.kind))
  const seenIds = new Set()
  const records = []
  const pick = (arr) => arr[Math.floor(rand() * arr.length)] || arr[0]
  for (let i = 0; i < count; i++) {
    const first = pick(DI_FIRST), last = pick(DI_LAST), roll = rand()
    let externalId = 'EMP-' + (1000 + i * 7)
    let email = first.toLowerCase() + '.' + last.toLowerCase() + '@excelsoftcorp.com'
    let department = pick(DI_DEPTS)
    let managerEmail = 'lead.' + pick(DI_DEPTS).split(' ')[0].toLowerCase() + '@excelsoftcorp.com'
    let displayName = first + ' ' + last
    if (roll > 0.93) email = first.toLowerCase() + '.' + last.toLowerCase() + '@contractor.io'
    else if (roll > 0.88) email = first.toLowerCase() + '[at]excelsoftcorp.com'
    else if (roll > 0.84) externalId = ''
    else if (roll > 0.8) department = 'Growth Hacking'
    else if (roll > 0.74) managerEmail = 'unknown.manager@excelsoftcorp.com'
    else if (roll > 0.71) displayName = first.slice(0, 1)
    else if (roll > 0.69 && records.length) externalId = records[0].externalId
    const issues = []
    const push = (ruleId, message) => { const rule = active.find(r => r.id === ruleId); if (rule) issues.push({ ruleId, ruleName:rule.name, severity:rule.severity, message }) }
    if (!externalId) push('R-01', 'Required field externalId is empty in the source row.')
    else if (seenIds.has(externalId)) push('R-07', 'Duplicate external ID ' + externalId + ' already present in this batch.')
    if (!/^[^@\s]+@[^@\s]+\.[a-z]{2,}$/i.test(email)) push('R-02', email + ' is not a valid email address.')
    else if (!/@(excelsoftcorp\.com|excelsoft\.edu)$/i.test(email)) push('R-04', 'Domain ' + email.split('@')[1] + ' is not on the allow-list.')
    if (displayName.trim().length < 2) push('R-03', 'Display name must be between 2 and 120 characters.')
    if (!DI_DEPTS.includes(department)) push('R-05', 'Department "' + department + '" was not found in the reference list.')
    if (managerEmail.indexOf('unknown.') === 0) push('R-06', 'Manager ' + managerEmail + ' could not be resolved to an existing account.')
    if (externalId) seenIds.add(externalId)
    const hasError = issues.some(x => x.severity === 'Error')
    const status = hasError ? 'Failed' : issues.length ? 'Warning' : 'Success'
    records.push({ rowNumber:i + 2, externalId:externalId || '\u2014', displayName, email, department, managerEmail, status, issues })
  }
  return records
}

function diSummarize(records) {
  const failed = records.filter(r => r.status === 'Failed').length
  const warnings = records.filter(r => r.status === 'Warning').length
  return { total:records.length, failed, warnings, succeeded:records.length - failed }
}

function diBuildRun(id, connectorId, startedAt, count, seed, triggeredBy, status) {
  const connector = DI_CONNECTORS.find(c => c.id === connectorId)
  const records = diGenerateRecords(connector, count, seed)
  const s = diSummarize(records)
  return { id, connectorId, startedAt, durationMs:4200 + count * 31, triggeredBy, status: status || (s.failed > 0 ? 'Partial' : 'Completed'), records, total:s.total, succeeded:s.succeeded, failed:s.failed, warnings:s.warnings }
}

function DISpark({ values }) {
  const w = 76, h = 24, n = values.length
  const max = Math.max.apply(null, values), min = Math.min.apply(null, values)
  const span = (max - min) || 1
  const pts = values.map((v, i) => ((n > 1 ? i * (w - 8) / (n - 1) : 0) + 4) + ',' + (h - 4 - ((v - min) / span) * (h - 9)))
  const last = pts[pts.length - 1].split(',')
  return (
    <svg width={w} height={h} viewBox={'0 0 ' + w + ' ' + h} aria-hidden="true" style={{ flex:'none', display:'block' }}>
      <polyline points={pts.join(' ')} fill="none" stroke="var(--primary)" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" opacity="0.8" />
      <circle cx={last[0]} cy={last[1]} r="2.6" fill="var(--primary)" />
    </svg>
  )
}

  const myRuns = runs.filter(r => r.connectorId === connector.id)
  const myRules = rules.filter(r => r.appliesTo.includes(connector.kind))
  const tabs = [{ k:'config', t:'Configuration' }, { k:'mapping', t:'Field mapping' }, { k:'rules', t:'Validation' }, { k:'history', t:'Recent runs' }]
  return (
    <div style={{ animation:'fadeUp .28s ease' }}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:16, flexWrap:'wrap', marginBottom:14 }}>
        <div style={{ display:'flex', gap:14, alignItems:'flex-start' }}>
          <button type="button" data-ix="ghost" aria-label="Back to catalog" title="Back to catalog" onClick={onBack} style={{ ...diBtnSec, width:46, padding:0, justifyContent:'center', flex:'none' }}><Icon d="M19 12H5 M12 19l-7-7 7-7" size={16} /></button>
          <div>
            <h1 style={{ fontSize:20, fontWeight:600, margin:0, color:'var(--ink)' }}>{connector.name}</h1>
            <p style={{ margin:'4px 0 0', fontSize:13.2, color:'var(--muted)', maxWidth:640 }}>{connector.description}</p>
          </div>
        </div>
        <button type="button" data-ix="primary" onClick={() => onRunConnector(connector.id)} style={diBtnPri}><Icon d="M5 3l14 9-14 9V3z" size={14} />Run this connector</button>
      </div>
      <div style={{ display:'flex', gap:8, flexWrap:'wrap', alignItems:'center', marginBottom:16 }}>
        <DIPill status={connector.status} />
        <DITag label={DI_KIND_LABEL[connector.kind]} />
        <DITag label={'Feature: ' + connector.feature} />
        <DITag label={'Owner: ' + connector.owner} />
        <DITag label={'Schedule: ' + connector.schedule} />
      </div>
      <div style={{ marginBottom:14, maxWidth:'100%', overflowX:'auto' }}>
        <SegTabs tabs={tabs} value={tab} onChange={setTab} ariaLabel="Connector detail sections" />
      </div>
      {tab === 'config' && (
        <section style={{ ...S.card, marginBottom:0 }}>
          {connector.config.map((c, i) => (
            <div key={c.label} style={{ display:'grid', gridTemplateColumns:'220px 1fr', gap:8, padding:'13px 18px', borderTop: i ? '1px solid var(--border)' : 'none' }}>
              <div style={{ ...diCaps, alignSelf:'center' }}>{c.label}</div>
              <div style={{ fontSize:13, fontFamily:diMono, color:'var(--ink)', wordBreak:'break-all' }}>{c.value}</div>
            </div>
          ))}
        </section>
      )}
      {tab === 'mapping' && (
        <section style={{ ...S.card, marginBottom:0, overflow:'hidden' }}>
          <table style={{ width:'100%', borderCollapse:'collapse' }}>
            <colgroup><col style={{ width:'32%' }} /><col style={{ width:'30%' }} /><col style={{ width:'20%' }} /><col style={{ width:'18%' }} /></colgroup>
            <thead><tr><Th label="Source field" align="left" sortable={false} /><Th label="Target attribute" align="left" sortable={false} /><Th label="Data type" align="left" sortable={false} /><Th label="Required" align="left" sortable={false} /></tr></thead>
            <tbody>
              {connector.fieldMap.map(f => (
                <tr key={f.source} style={{ borderBottom:'1px solid var(--border)' }}>
                  <td style={{ padding:'12px 16px', fontSize:12.6, fontFamily:diMono }}>{f.source}</td>
                  <td style={{ padding:'12px 16px', fontSize:12.6, fontFamily:diMono, color:'var(--primary)', fontWeight:600 }}>{f.target}</td>
                  <td style={{ padding:'12px 16px' }}><span style={{ fontSize:11.8, fontWeight:600, fontFamily:diMono, color:'var(--muted)', background:'var(--surface-alt)', border:'1px solid var(--border)', borderRadius:6, padding:'2px 8px' }}>{f.type || DI_TARGET_TYPE[f.target] || 'string'}</span></td>
                  <td style={{ padding:'12px 16px', fontSize:13.2, color: f.required ? 'var(--ink)' : 'var(--muted)' }}>{f.required ? 'Yes' : 'Optional'}</td>
                </tr>
              ))}
            </tbody>
          </table>
        </section>
      )}
      {tab === 'rules' && (
        <section style={{ ...S.card, marginBottom:0 }}>
          {myRules.map((r, i) => (
            <div key={r.id} style={{ display:'flex', flexWrap:'wrap', alignItems:'center', gap:10, padding:'12px 18px', borderTop: i ? '1px solid var(--border)' : 'none' }}>
              <span style={{ fontSize:12, fontFamily:diMono, color:'var(--muted)' }}>{r.id}</span>
              <span style={{ fontSize:13.4, fontWeight:600, color:'var(--ink)' }}>{r.name}</span>
              <DITag label={r.kind === 'schema' ? 'Schema' : 'Business rule'} />
              <DIPill status={r.severity} />
              {!r.enabled && <DITag label="Disabled" />}
              <code style={{ marginLeft:'auto', fontSize:12, fontFamily:diMono, color:'var(--muted)' }}>{r.expression}</code>
            </div>
          ))}
        </section>
      )}
      {tab === 'history' && (
        <section style={{ ...S.card, marginBottom:0 }}>
          {myRuns.length === 0 && <div style={{ padding:'22px 18px', fontSize:13.2, color:'var(--muted)' }}>This connector has not been run yet.</div>}
          {myRuns.map((r, i) => (
            <button key={r.id} type="button" data-ix="row" onClick={() => onOpenRun(r.id)} style={{ display:'flex', flexWrap:'wrap', alignItems:'center', gap:14, width:'100%', padding:'13px 18px', border:'none', borderTop: i ? '1px solid var(--border)' : 'none', background:'transparent', cursor:'pointer', fontFamily:'inherit', textAlign:'left' }}>
              <span style={{ fontSize:13, fontFamily:diMono, fontWeight:600, color:'var(--primary)' }}>{r.id}</span>
              <span style={{ fontSize:12.8, color:'var(--muted)' }}>{diFmtDate(r.startedAt)}</span>
              <DIPill status={r.status} />
              <span style={{ marginLeft:'auto', fontSize:12.4, fontFamily:diMono, color:'var(--muted)' }}>{r.succeeded + '/' + r.total + ' imported \u00b7 ' + r.failed + ' failed'}</span>
            </button>
          ))}
        </section>
      )}
    </div>
  )
}

function DIWizard({ runs, addRun, preselect, clearPreselect, toast, onOpenRun }) {
  const [step, setStep] = useState(preselect ? 1 : 0)
  const [selected, setSelected] = useState(preselect || null)
  const [fetching, setFetching] = useState(false)
  const [upFile, setUpFile] = useState(null)
  const [progress, setProgress] = useState(0)
  const [records, setRecords] = useState(null)
  const [committed, setCommitted] = useState(null)
  const connector = selected ? diConnectorById(selected) : null
  const summary = records ? diSummarize(records) : null
  const steps = ['Choose connector', 'Fetch data', 'Review validation', 'Commit']
  const runFetch = () => {
    if (!connector) return
    setFetching(true); setProgress(8)
    const count = 40 + (connector.name.length % 5) * 6
    const timer = setInterval(() => setProgress(p => p >= 100 ? 100 : p + 12), 160)
    setTimeout(() => {
      clearInterval(timer); setProgress(100)
      setRecords(diGenerateRecords(connector, count, connector.name.length * 3))
      setFetching(false); setStep(2)
    }, 1500)
  }
  const commit = () => {
    if (!connector || !records || !summary) return
    const maxId = Math.max.apply(null, runs.map(r => parseInt(r.id.slice(4), 10)))
    const run = { id:'RUN-' + (maxId + 1), connectorId:connector.id, startedAt:new Date().toISOString(), durationMs:1500 + records.length * 22, triggeredBy:'you@excelsoftcorp.com', status: summary.failed > 0 ? 'Partial' : 'Completed', records, total:summary.total, succeeded:summary.succeeded, failed:summary.failed, warnings:summary.warnings }
    addRun(run); setCommitted(run); setStep(3)
    toast(summary.succeeded + ' of ' + summary.total + ' records imported. ' + summary.failed + ' rejected.', 'success')
  }
  const reset = () => { setStep(0); setSelected(null); setRecords(null); setCommitted(null); setProgress(0); clearPreselect() }
  return (
    <div>
      <ol style={{ ...S.card, display:'flex', flexWrap:'wrap', listStyle:'none', margin:'0 0 16px', padding:0, overflow:'hidden' }}>
        {steps.map((label, i) => (
          <li key={label} style={{ flex:'1 1 160px', display:'flex', alignItems:'center', gap:9, padding:'13px 16px', borderLeft: i ? '1px solid var(--border)' : 'none', background: i === step ? 'var(--primary-tint)' : 'transparent', fontSize:13, fontWeight: i === step ? 600 : 500, color: i === step ? 'var(--primary)' : 'var(--muted)' }}>
            <span style={{ display:'flex', alignItems:'center', justifyContent:'center', width:21, height:21, borderRadius:'50%', flex:'none', fontSize:11, fontWeight:700, border:'1.5px solid ' + (i < step ? 'var(--success)' : i === step ? 'var(--primary)' : 'var(--border)'), background: i < step ? 'var(--success)' : 'transparent', color: i < step ? '#fff' : 'inherit' }}>
              {i < step ? <Icon d="M20 6L9 17l-5-5" size={11} sw={3} /> : i + 1}
            </span>
            {label}
          </li>
        ))}
      </ol>
      {step === 0 && (
        <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(360px, 1fr))', gap:14 }}>
          {DI_CONNECTORS.map(c => (
            <button key={c.id} type="button" disabled={c.status !== 'Active'} data-ix={c.status === 'Active' ? 'row' : undefined} onClick={() => { setSelected(c.id); setStep(1) }}
              style={{ ...S.card, marginBottom:0, padding:16, textAlign:'left', fontFamily:'inherit', cursor: c.status === 'Active' ? 'pointer' : 'not-allowed', opacity: c.status === 'Active' ? 1 : 0.55, border:'1px solid var(--border)' }}>
              <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:10 }}>
                <span style={{ fontSize:14, fontWeight:600, color:'var(--ink)' }}>{c.name}</span>
                <DIPill status={c.status} />
              </div>
              <div style={{ display:'flex', gap:6, flexWrap:'wrap', marginTop:9 }}>
                <DITag label={DI_KIND_LABEL[c.kind]} />
                <DITag label={'Feature: ' + c.feature} />
              </div>
              {c.status !== 'Active' && <p style={{ margin:'9px 0 0', fontSize:12.2, color:'var(--muted)' }}>Not runnable: connector is {c.status.toLowerCase()}.</p>}
            </button>
          ))}
        </div>
      )}
      {step === 1 && connector && (
        <div style={{ display:'grid', gridTemplateColumns:'minmax(0,1fr) 320px', gap:16 }}>
          <div style={{ ...S.card, marginBottom:0, padding:22 }}>
            <div style={diCaps}>Ready to invoke</div>
            <h2 style={{ margin:'6px 0 0', fontSize:17, fontWeight:600, color:'var(--ink)' }}>{connector.name}</h2>
            <p style={{ margin:'6px 0 0', fontSize:13.2, color:'var(--muted)' }}>{connector.description}</p>
            {connector.kind === 'excel' && (
              <div style={{ marginTop:16 }}>
                {upFile ? (
                  <div style={{ display:'flex', alignItems:'center', gap:11, padding:'10px 12px', border:'1px solid var(--border-blue)', borderRadius:10, background:'var(--primary-tint-2)' }}>
                    <span aria-hidden style={{ display:'flex', alignItems:'center', justifyContent:'center', width:32, height:32, borderRadius:8, flex:'none', background:'var(--green-tint)', color:'var(--success-text)' }}><Icon d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z M14 2v6h6" size={15} /></span>
                    <div style={{ flex:1, minWidth:0 }}>
                      <div style={{ fontSize:13.2, fontWeight:600, color:'var(--ink)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{upFile.name}</div>
                      <div style={{ fontSize:11.6, color:'var(--muted)', marginTop:1 }}>{((upFile.size / 1024).toFixed(1)) + ' KB \u00b7 ready to import'}</div>
                    </div>
                    <button type="button" aria-label="Remove uploaded file" onClick={() => setUpFile(null)} style={{ display:'flex', border:'none', background:'transparent', color:'var(--muted)', cursor:'pointer', padding:4, borderRadius:6, flex:'none' }}><Icon d="M18 6L6 18 M6 6l12 12" size={14} sw={2.2} /></button>
                  </div>
                ) : (
                  <label data-ix="row" style={{ display:'flex', alignItems:'center', gap:11, padding:'12px 14px', border:'1.5px dashed #C7D0DD', borderRadius:10, background:'var(--surface-alt)', cursor:'pointer' }}>
                    <span aria-hidden style={{ display:'flex', alignItems:'center', justifyContent:'center', width:32, height:32, borderRadius:8, flex:'none', background:'var(--primary-tint)', color:'var(--primary)' }}><Icon d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4 M17 8l-5-5-5 5 M12 3v12" size={15} /></span>
                    <span style={{ flex:1, minWidth:0 }}>
                      <span style={{ display:'block', fontSize:13.2, fontWeight:600, color:'var(--ink)' }}>Upload workbook</span>
                      <span style={{ display:'block', fontSize:11.8, color:'var(--muted)', marginTop:1 }}>{'.xlsx or .csv \u2014 defaults to the configured file if skipped'}</span>
                    </span>
                    <span style={{ flex:'none', fontSize:12.6, fontWeight:600, color:'var(--primary)' }}>Browse</span>
                    <input type="file" accept=".xlsx,.xls,.csv" style={{ display:'none' }} onChange={(e) => { const fl = e.target.files && e.target.files[0]; if (fl) setUpFile({ name:fl.name, size:fl.size }); e.target.value = '' }} />
                  </label>
                )}
              </div>
            )}
            <div style={{ marginTop:20, height:9, borderRadius:999, background:'#E9EEF5', boxShadow:'inset 0 1px 2px rgba(16,42,84,.12)', overflow:'hidden' }}>
              <div style={{ height:'100%', width:progress + '%', borderRadius:999, background:'linear-gradient(180deg, #4AA3F0, var(--primary))', boxShadow:'inset 0 1px 0 rgba(255,255,255,.45)', transition:'width .18s ease' }} />
            </div>
            <div style={{ marginTop:9, fontSize:12.2, fontFamily:diMono, color:'var(--muted)' }}>{fetching ? 'Fetching from ' + (upFile ? upFile.name : DI_KIND_LABEL[connector.kind]) + '\u2026' : upFile ? 'Ready \u2014 ' + upFile.name + ' will be imported.' : 'Idle \u2014 no request sent yet.'}</div>
            <div style={{ display:'flex', gap:10, marginTop:20 }}>
              <button type="button" data-ix="primary" onClick={runFetch} disabled={fetching} style={{ ...diBtnPri, opacity: fetching ? 0.7 : 1 }}><Icon d="M5 3l14 9-14 9V3z" size={14} />{fetching ? 'Executing\u2026' : 'Execute operation'}</button>
              <button type="button" data-ix="ghost" onClick={() => { setSelected(null); setStep(0); setUpFile(null); clearPreselect() }} disabled={fetching} style={diBtnSec}><Icon d="M19 12H5 M12 19l-7-7 7-7" size={14} />Change connector</button>
            </div>
          </div>
          <div style={{ ...S.card, marginBottom:0, padding:18, alignSelf:'start' }}>
            <div style={diCaps}>Field mapping in effect</div>
            <ul style={{ listStyle:'none', margin:'10px 0 0', padding:0, display:'flex', flexDirection:'column', gap:7 }}>
              {connector.fieldMap.map(f => (
                <li key={f.source} style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:10, fontSize:12.2, fontFamily:diMono }}>
                  <span style={{ color:'var(--ink)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{f.source}</span>
                  <span style={{ color:'var(--primary)', fontWeight:600, flex:'none' }}>{'\u2192 ' + f.target}</span>
                </li>
              ))}
            </ul>
          </div>
        </div>
      )}
      {step === 2 && records && summary && connector && (
        <div style={{ display:'flex', flexDirection:'column', gap:16 }}>
          <DIStatCards stats={[
            { label:'Records fetched', value:summary.total, sub:'from source', icon:'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4 M7 10l5 5 5-5 M12 15V3' },
            { label:'Will import', value:summary.succeeded, pct:Math.round((summary.succeeded / summary.total) * 100), sub:Math.round((summary.succeeded / summary.total) * 100) + '%', tone:'green', icon:'M12 22a10 10 0 1 1 0-20 10 10 0 0 1 0 20z M8.5 12.5l2.5 2.5 4.5-5' },
            { label:'With warnings', value:summary.warnings, pct:Math.round((summary.warnings / summary.total) * 100), sub:Math.round((summary.warnings / summary.total) * 100) + '%', tone:'amber', icon:'M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z M12 9v4 M12 17h.01' },
            { label:'Rejected', value:summary.failed, pct:Math.round((summary.failed / summary.total) * 100), sub:Math.round((summary.failed / summary.total) * 100) + '%', tone:'red', icon:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z M15 9l-6 6 M9 9l6 6' },
          ]} />
          <DIRecordTable records={records} />
          <div style={{ display:'flex', gap:10, flexWrap:'wrap' }}>
            <button type="button" data-ix="primary" onClick={commit} style={diBtnPri}><Icon d="M20 6L9 17l-5-5" size={15} />Commit {summary.succeeded} valid records</button>
            <button type="button" data-ix="ghost" onClick={() => setStep(1)} style={diBtnSec}><Icon d="M23 4v6h-6 M20.49 15a9 9 0 1 1-2.12-9.36L23 10" size={14} />Re-fetch</button>
          </div>
        </div>
      )}
      {step === 3 && committed && (
        <div style={{ ...S.card, marginBottom:0, padding:26 }}>
          <DIPill status={committed.status} />
          <h2 style={{ margin:'12px 0 0', fontSize:17, fontWeight:600, color:'var(--ink)' }}>Import {committed.id} finished</h2>
          <p style={{ margin:'6px 0 0', fontSize:13.2, color:'var(--muted)', maxWidth:620 }}>

          <div style={{ display:'flex', gap:10, marginTop:20 }}>
            <button type="button" data-ix="primary" onClick={() => onOpenRun(committed.id)} style={diBtnPri}><Icon d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z" size={15} />Open run detail</button>
            <button type="button" data-ix="ghost" onClick={reset} style={diBtnSec}><Icon d="M12 5v14 M5 12h14" size={14} />Start another import</button>
          </div>
        </div>
      )}
    </div>
  )
}

function DIDonut({ run }) {
  const clean = run.succeeded - run.warnings
  const segs = [
    { label:'Imported clean', value:clean, color:'#16A34A', grad:'url(#diGradG)' },
    { label:'With warnings', value:run.warnings, color:'#F59E0B', grad:'url(#diGradA)' },
    { label:'Rejected', value:run.failed, color:'#DC2626', grad:'url(#diGradR)' },
  ].filter(s => s.value > 0)
  const R = 50, C = 2 * Math.PI * R
  const gap = segs.length > 1 ? 2.5 : 0
  let cum = 0
  const arcs = segs.map(s => {
    const frac = s.value / run.total
    const dash = Math.max(0, frac * C - gap)
    const a = { ...s, dash, offset:-cum * C }
    cum += frac
    return a
  })
  const rate = Math.round((run.succeeded / run.total) * 100)
  return (
    <section style={{ ...S.card, padding:18, marginBottom:0, display:'flex', flexDirection:'column' }}>
      <div style={diCaps}>Run outcome</div>
      <div style={{ display:'flex', alignItems:'center', gap:20, marginTop:14, flex:1 }}>
        <div style={{ position:'relative', width:132, height:132, flex:'none' }}>
          <svg width="132" height="132" viewBox="0 0 120 120" role="img" aria-label={rate + '% of records imported'}>
            <defs>
              <linearGradient id="diGradG" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor="#3DC46E" /><stop offset="1" stopColor="#0E8A3C" /></linearGradient>
              <linearGradient id="diGradA" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor="#FBC14B" /><stop offset="1" stopColor="#E08A06" /></linearGradient>
              <linearGradient id="diGradR" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stopColor="#F0655A" /><stop offset="1" stopColor="#C21F1F" /></linearGradient>
            </defs>
            <circle cx="60" cy="60" r={R} fill="none" stroke="#E9EEF5" strokeWidth="13" />
            {arcs.map(a => (
              <circle key={a.label} cx="60" cy="60" r={R} fill="none" stroke={a.grad} strokeWidth="13" strokeLinecap="round"
                strokeDasharray={a.dash + ' ' + C} strokeDashoffset={a.offset} transform="rotate(-90 60 60)" />
            ))}
            <circle cx="60" cy="60" r={R + 4.5} fill="none" stroke="rgba(255,255,255,.55)" strokeWidth="1.5" />
            <circle cx="60" cy="60" r={R - 4.5} fill="none" stroke="rgba(16,42,84,.07)" strokeWidth="1" />
          </svg>
          <div style={{ position:'absolute', inset:0, display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center' }}>
            <span style={{ fontSize:23, fontWeight:700, color:'var(--ink)', fontVariantNumeric:'tabular-nums', lineHeight:1 }}>{rate}%</span>
            <span style={{ marginTop:4, fontSize:10.6, fontWeight:700, letterSpacing:'.06em', textTransform:'uppercase', color:'var(--muted)' }}>imported</span>
          </div>
        </div>
        <div style={{ display:'flex', flexDirection:'column', gap:10, minWidth:0 }}>
          {segs.map(s => (
            <div key={s.label} style={{ display:'flex', alignItems:'center', gap:9 }}>
              <span aria-hidden style={{ width:9, height:9, borderRadius:3, flex:'none', background:s.color }} />
              <span style={{ fontSize:12.8, color:'var(--muted)', whiteSpace:'nowrap' }}>{s.label}</span>
              <span style={{ marginLeft:'auto', fontSize:12.8, fontWeight:700, fontFamily:diMono, color:'var(--ink)', fontVariantNumeric:'tabular-nums' }}>{s.value}</span>
            </div>
          ))}
          <div style={{ display:'flex', alignItems:'center', gap:9, borderTop:'1px solid var(--border)', paddingTop:10 }}>
            <span style={{ fontSize:12.8, color:'var(--muted)' }}>Total fetched</span>
            <span style={{ marginLeft:'auto', fontSize:12.8, fontWeight:700, fontFamily:diMono, color:'var(--ink)' }}>{run.total}</span>
          </div>
        </div>
      </div>
    </section>
  )
}

function DIRunDetail({ run, rules, onBack, onReimport, toast }) {
  const connector = diConnectorById(run.connectorId)
  const breakdown = rules
    .map(rule => ({ rule, count:run.records.filter(r => r.issues.some(i => i.ruleId === rule.id)).length }))
    .filter(b => b.count > 0)
    .sort((a, b) => b.count - a.count)
  return (
    <div style={{ animation:'fadeUp .28s ease' }}>
      <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start', gap:16, flexWrap:'wrap', marginBottom:14 }}>
        <div style={{ display:'flex', gap:14, alignItems:'flex-start' }}>
          <button type="button" data-ix="ghost" aria-label="Back to run history" title="Back to run history" onClick={onBack} style={{ ...diBtnSec, width:46, padding:0, justifyContent:'center', flex:'none' }}><Icon d="M19 12H5 M12 19l-7-7 7-7" size={16} /></button>
          <div>
            <h1 style={{ fontSize:20, fontWeight:600, margin:0, color:'var(--ink)' }}>Run {run.id}</h1>
            <p style={{ margin:'4px 0 0', fontSize:13.2, color:'var(--muted)' }}>{(connector ? connector.name : run.connectorId) + ' \u00b7 started ' + diFmtDate(run.startedAt) + ' by ' + run.triggeredBy}</p>
          </div>
        </div>
        <div style={{ display:'flex', gap:10, flexWrap:'wrap' }}>
          <button type="button" data-ix="ghost" onClick={() => toast('Failure report exported.', 'success')} style={diBtnSec}><Icon d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4 M7 10l5 5 5-5 M12 15V3" size={15} />Export failures</button>
          <button type="button" data-ix="primary" onClick={() => onReimport(run.connectorId)} style={diBtnPri}><Icon d="M23 4v6h-6 M20.49 15a9 9 0 1 1-2.12-9.36L23 10" size={14} />Re-import</button>
        </div>
      </div>
      <div style={{ display:'flex', gap:8, flexWrap:'wrap', alignItems:'center', marginBottom:16 }}>
        <DIPill status={run.status} />
        <DITag label={'Duration ' + diDur(run.durationMs)} />
        <DITag label="Partial commit policy" />
      </div>
      <DIStatCards stats={[
        { label:'Records fetched', value:run.total, sub:'from source', icon:'M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4 M7 10l5 5 5-5 M12 15V3' },
        { label:'Imported', value:run.succeeded, pct:Math.round((run.succeeded / run.total) * 100), sub:Math.round((run.succeeded / run.total) * 100) + '%', tone:'green', icon:'M12 22a10 10 0 1 1 0-20 10 10 0 0 1 0 20z M8.5 12.5l2.5 2.5 4.5-5' },
        { label:'Imported with warnings', value:run.warnings, pct:Math.round((run.warnings / run.total) * 100), sub:Math.round((run.warnings / run.total) * 100) + '%', tone:'amber', icon:'M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z M12 9v4 M12 17h.01' },
        { label:'Rejected', value:run.failed, pct:Math.round((run.failed / run.total) * 100), sub:Math.round((run.failed / run.total) * 100) + '%', tone:'red', icon:'M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z M15 9l-6 6 M9 9l6 6' },
      ]} />
      <div style={{ display:'grid', gridTemplateColumns:'minmax(280px, 360px) minmax(0, 1fr)', gap:16, marginBottom:16, alignItems:'stretch' }}>
        <DIDonut run={run} />
        <section style={{ ...S.card, padding:18, marginBottom:0 }}>
          <div style={{ display:'flex', alignItems:'baseline', justifyContent:'space-between', gap:10 }}>
            <div style={diCaps}>Failure reasons by rule</div>
            {breakdown.length > 0 && <span style={{ fontSize:11.8, color:'var(--muted)' }}>share of {run.total} records</span>}
          </div>
          {breakdown.length > 0 ? (
            <div style={{ display:'flex', flexDirection:'column', gap:14, marginTop:14 }}>
              {breakdown.map(({ rule, count }, i) => {
                const maxCount = breakdown[0].count
                const pct = Math.round((count / run.total) * 100)
                const err = rule.severity === 'Error'
                return (
                  <div key={rule.id}>
                    <div style={{ display:'flex', alignItems:'center', gap:9, marginBottom:6, minWidth:0 }}>
                      <span style={{ fontSize:11.4, fontWeight:700, fontFamily:diMono, color: err ? '#B42318' : 'var(--warning-text)', background: err ? '#FDECEC' : 'var(--amber-tint)', borderRadius:6, padding:'2px 7px', flex:'none' }}>{rule.id}</span>
                      <span style={{ fontSize:13, fontWeight:600, color:'var(--ink)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{rule.name}</span>
                      <span style={{ marginLeft:'auto', flex:'none', fontSize:12.2, fontFamily:diMono, color:'var(--ink)', fontVariantNumeric:'tabular-nums' }}><strong>{count}</strong><span style={{ color:'var(--muted)' }}>{' \u00b7 ' + pct + '%'}</span></span>
                    </div>
                    <div style={{ height:10, borderRadius:999, background:'#E9EEF5', boxShadow:'inset 0 1px 2px rgba(16,42,84,.12)', overflow:'hidden' }}>
                      <div style={{ height:'100%', borderRadius:999, width:Math.max(3, Math.round((count / maxCount) * 100)) + '%', background: err ? 'linear-gradient(180deg, #F27059, #C21F1F)' : 'linear-gradient(180deg, #FBC14B, #E08A06)', boxShadow:'inset 0 1px 0 rgba(255,255,255,.5), inset 0 -1px 1px rgba(0,0,0,.1)', animation:'diBarGrow .7s cubic-bezier(.22,1,.36,1) both', animationDelay:(i * 70) + 'ms' }} />
                    </div>
                  </div>
                )
              })}
            </div>
          ) : (
            <div style={{ display:'flex', flexDirection:'column', alignItems:'center', justifyContent:'center', gap:8, padding:'30px 0' }}>
              <span style={{ display:'flex', alignItems:'center', justifyContent:'center', width:38, height:38, borderRadius:'50%', background:'var(--green-tint)', color:'var(--success-text)' }}><Icon d="M20 6L9 17l-5-5" size={17} sw={2.5} /></span>
              <span style={{ fontSize:13.2, color:'var(--muted)' }}>No validation failures in this run.</span>
            </div>
          )}
        </section>
      </div>
      <DIRecordTable records={run.records} />
    </div>
  )
}
