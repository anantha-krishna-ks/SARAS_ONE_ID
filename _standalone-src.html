html,body,#root{margin:0;padding:0;}
body{font-family:'Poppins',system-ui,sans-serif;color:var(--ink);background:var(--surface-page);-webkit-font-smoothing:antialiased;}
a{color:var(--primary);text-decoration:none;}
a:hover{color:var(--primary-hover);}
button{font-family:inherit;}
button:not(:disabled){cursor:pointer;}
button:disabled{opacity:.5;cursor:not-allowed;}
[data-ix="primary"]:active:not(:disabled),[data-ix="ghost"]:active:not(:disabled){transform:scale(.97);}
[data-ix]{transition:transform .15s cubic-bezier(.22,1,.36,1),box-shadow .16s ease,background-color .16s ease,border-color .16s ease,color .16s ease,filter .16s ease;}
[data-ix="primary"]:hover:not(:disabled){transform:translateY(-1.5px)!important;filter:brightness(1.08)!important;box-shadow:0 8px 18px -6px rgba(0,112,224,.5)!important;}
[data-ix="ghost"]:hover:not(:disabled){background:var(--primary-tint-2)!important;border-color:var(--primary)!important;color:var(--primary)!important;transform:translateY(-1.5px)!important;}
[data-ix="ic"]:hover:not(:disabled){background:var(--primary-tint)!important;border-color:var(--border-blue)!important;color:var(--primary)!important;}
[data-ix="dang"]:hover:not(:disabled){background:#FEECEC!important;border-color:#F5C6C6!important;color:var(--danger)!important;}
[data-ix="orgtoggle"]:hover{transform:translateY(-50%) scale(1.14)!important;box-shadow:0 3px 8px -2px rgba(16,42,84,.4)!important;}
[data-ix="orgtoggle"]:active{transform:translateY(-50%) scale(.94)!important;}
[data-ix="stp"]:hover:not(:disabled){background:#E6EEF8!important;color:var(--primary)!important;}
[data-ix="stp"]:active:not(:disabled){transform:scale(.9)!important;}
[data-ix="stp"]:disabled{cursor:not-allowed!important;background:#F4F6F9!important;}
[data-stepper]:focus-within{border-color:var(--primary)!important;box-shadow:0 0 0 3px rgba(10,74,140,.13)!important;}
[data-ix="close"]{color:var(--muted);}
[data-ix="close"]:hover:not(:disabled){background:var(--surface-alt)!important;color:var(--ink)!important;}
[data-ix="close"]:hover .cx{transform:rotate(90deg);}
[data-ix="primary"]:disabled{background:#C4CDD9!important;color:#fff!important;cursor:not-allowed!important;box-shadow:none!important;filter:none!important;}
[data-ix="nav"]:not([aria-current]):hover{background:var(--primary-tint)!important;color:var(--primary)!important;}
@keyframes barIn{from{transform:translateY(-50%) scaleY(0);}to{transform:translateY(-50%) scaleY(1);}}
[data-app-tile]{transition:transform .22s cubic-bezier(.22,1,.36,1),border-color .22s ease,background .22s ease,box-shadow .22s ease;}
[data-app-tile]:hover{background:linear-gradient(160deg,rgba(255,255,255,.2),rgba(255,255,255,.09))!important;box-shadow:inset 0 2px 0 var(--acc),0 12px 26px -16px rgba(0,0,0,.5)!important;}
[data-app-tile]:hover .app-arrow{opacity:1!important;transform:translateX(0)!important;}
[data-app-tile]:focus-visible{outline:2px solid rgba(255,255,255,.7);outline-offset:2px;}
[data-ix="treerow"]{cursor:pointer;transition:background .14s ease,border-color .14s ease;}
[data-ix="treerow"]:hover{background:var(--primary-tint-2)!important;border-color:var(--border-blue)!important;}
[data-ix="rolerow"]:hover[aria-pressed="false"]{background:var(--primary-tint-2)!important;}
[data-ix="tab"]:hover[aria-selected="false"]{color:var(--ink)!important;border-bottom-color:var(--border-blue)!important;}
[data-ix="prow"]:hover{background:var(--surface-alt)!important;}
[data-ix="approw"]:hover[aria-pressed="false"]{background:var(--primary-tint-2)!important;}
[data-ix="lnk"]:hover{background:var(--primary-tint-2)!important;}
[data-ix="chk"]:active{transform:scale(.9);}
[data-ix="acc"] svg{transition:transform .18s ease;}
[data-ix="treerow"] .ou-actions{opacity:0;transition:opacity .14s ease;}
[data-ix="treerow"]:hover .ou-actions,[data-ix="treerow"]:focus-within .ou-actions{opacity:1;}
[data-ix="opt"]:hover{background:var(--primary-tint-2)!important;}
[data-ix="seg-on"]:hover{filter:brightness(1.08);}

tr[data-ix="row"]:hover{background:var(--primary-tint-2)!important;}

[data-ix="tclose"]:hover{background:var(--surface-alt)!important;color:var(--ink)!important;}
:focus-visible{outline:3px solid rgba(0,112,224,.35);outline-offset:2px;border-radius:6px;}
.skip-link{position:absolute;left:12px;top:-48px;z-index:100;background:var(--primary);color:#fff;padding:10px 16px;border-radius:10px;font-weight:600;font-size:13.5px;transition:top .18s ease;}
.skip-link:focus{top:12px;color:#fff;}
::-webkit-scrollbar{width:10px;height:10px;}
::-webkit-scrollbar-thumb{background:#cdd6e2;border-radius:999px;border:2px solid transparent;background-clip:content-box;}
@keyframes cbTick{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes popIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
@keyframes auraDrift { from { transform: translateX(-1.5%); } to { transform: translateX(1.5%); } }

@keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

@keyframes mapBob{0%,100%{transform:translateY(0);}50%{transform:translateY(-6px);}}
@keyframes mapPulse{0%{transform:scale(.75);opacity:.55;}70%{transform:scale(1.6);opacity:0;}100%{opacity:0;}}
@keyframes mapFadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
@keyframes travel{0%{stroke-dashoffset:0;}100%{stroke-dashoffset:-100;}}

[data-ix="card"]:hover .card-arrow{opacity:1!important;transform:translate(0,0)!important;}

function flattenPrivKeys(app){
  const out = []
  app.nodes.forEach(n => n.group ? n.perms.forEach(p => out.push(p.k)) : out.push(n.k))
  return out
}

// ---- Privilege catalogue (hierarchical) ----
// Mirrors the SARAS One data dictionary for `permissions`:
// id, parent_id (self-ref → hierarchy), tenant_id, app_id (→ app_client),
// code, name, description, wbs, is_active, is_default, permission_uuid.
function toPriv(app, n, parentWbs){
  const seg = n.k.split('.').pop().toUpperCase()
  const wbs = (parentWbs || app.code) + '.' + seg
  const children = n.group ? n.perms.map(p => toPriv(app, p, wbs)) : []
  return {
    kind:'priv',
    code:'PRM_' + n.k.replace(/\./g, '_').toUpperCase(),
    name:n.name,
    desc:n.desc || (n.group ? 'Grouping of related privileges.' : ''),
    wbs,
    active:true,
    isDefault:/view|browse/i.test(n.name),
    children,
  }
}

// Build a rendered list model for a generic screen. `toast` powers row actions.
function buildList(screen, listSearch, toast, handlers){
  const def = listMeta[screen]
  if(!def) return null
  const q = (listSearch || '').trim().toLowerCase()
  const thBase = { fontSize:'12px', fontWeight:600, letterSpacing:'.06em', textTransform:'uppercase', color:'#0a4a8c', padding:'14px 16px', borderBottom:'1px solid var(--border-blue)', whiteSpace:'nowrap' }
  const columns = def.cols.map(l => ({ label:l, align:'left', sortable:true, thStyle:{ ...thBase, textAlign:'left' } }))
  const hasActions = !!(def.actions && def.actions.length)
  if(hasActions) columns.push({ label:'Actions', align:'right', sortable:false, thStyle:{ ...thBase, textAlign:'right' } })
  let pairs = def.rows.map((r, i) => ({ r, tag: def.rowTags ? def.rowTags[i] : null }))
  if(q) pairs = pairs.filter(p => p.r.some(c => String((c && c.b) || (c && c.m) || c || '').toLowerCase().includes(q)))
  const mapped = pairs.map((p, i) => ({
    key: i,
    tag: p.tag,
    cells: p.r.map(mkCell),
    actions: (def.actions || []).map(a => { const A = ACTIONS[a]; const h = handlers && handlers[a]; return { icon:A.icon, ariaLabel:A.label, onClick: h ? () => h(p.r) : () => toast(A.msg, A.kind) } }),
  }))
  return {
    title:def.title, subtitle:def.sub, exportable:!!def.exportable,
    exportAction:() => toast('Exporting ' + def.title + ' to Excel\u2026', 'success'),
    columns, rows:mapped, hasActions, count:mapped.length, filters: def.filters || null,
    newAction: handlers && handlers.add ? { label: def.newLabel || 'New', onClick: handlers.add } : null,
    hasRows:mapped.length > 0, empty:mapped.length === 0, minWidth:(def.minW || 760) + 'px',
  }
}

function Stepper({ value, onChange, min = 0, max = 9999, step = 1, label, helperText }) {
  const [draft, setDraft] = useState(null)
  const clamp = (n) => Math.min(max, Math.max(min, n))
  const commit = () => { if (draft !== null) { const n = parseInt(draft, 10); onChange(isNaN(n) ? value : clamp(n)) } setDraft(null) }
  const btn = (dis, side) => ({ flex:'none', width:38, alignSelf:'stretch', border:'none', [side]:'1px solid var(--border)', background:'var(--surface-alt)', color: dis ? '#B9C2CF' : 'var(--primary)', fontSize:18, lineHeight:1, display:'flex', alignItems:'center', justifyContent:'center', padding:0 })
  return (
    <div style={{ display:'flex', flexDirection:'column', gap:6, minWidth:0 }}>
      {label && <label style={{ fontSize:13.6, fontWeight:500, color:'var(--ink)', lineHeight:1.3 }}>{label}</label>}
      <div data-stepper style={{ display:'flex', alignItems:'stretch', height:42, borderRadius:10, border:'1.5px solid #D5DBE4', overflow:'hidden', background:'var(--surface)' }}>
        <button type="button" data-ix="stp" aria-label={'Decrease ' + (label || 'value')} disabled={value <= min} onClick={() => { setDraft(null); onChange(clamp(value - step)) }} style={btn(value <= min, 'borderRight')}>−</button>
        <input aria-label={label} value={draft === null ? String(value) : draft} inputMode="numeric"
          onChange={(e) => setDraft(e.target.value.replace(/[^0-9]/g, ''))}
          onBlur={commit}
          onKeyDown={(e) => { if (e.key === 'Enter') { e.currentTarget.blur() } else if (e.key === 'ArrowUp') { e.preventDefault(); setDraft(null); onChange(clamp(value + step)) } else if (e.key === 'ArrowDown') { e.preventDefault(); setDraft(null); onChange(clamp(value - step)) } }}
          style={{ flex:1, minWidth:0, border:'none', outline:'none', textAlign:'center', fontFamily:'inherit', fontVariantNumeric:'tabular-nums', fontSize:14.6, fontWeight:600, color:'var(--ink)', background:'transparent', padding:'0 4px' }} />
        <button type="button" data-ix="stp" aria-label={'Increase ' + (label || 'value')} disabled={value >= max} onClick={() => { setDraft(null); onChange(clamp(value + step)) }} style={btn(value >= max, 'borderLeft')}>+</button>
      </div>
      {helperText && <div style={{ fontSize:12, color:'var(--muted)', lineHeight:1.4, overflowWrap:'anywhere' }}>{helperText}</div>}
    </div>
  )
}

function useForm(initial, validate) {
  const [values, setValues] = useState(initial)
  const [submitted, setSubmitted] = useState(false)
  const [shake, setShake] = useState(false)
  const errs = validate(values)
  const valid = Object.keys(errs).length === 0
  const set = (k) => (e) => { const val = e && e.target ? e.target.value : e; setValues(v => ({ ...v, [k]: val })) }
  const err = (k) => (submitted && errs[k]) || false
  const trySubmit = (onOk) => { if (valid) onOk(); else { setSubmitted(true); setShake(true) } }
  return { values, set, err, submitted, valid, shake, clearShake: () => setShake(false), trySubmit }
}

function Dropdown({ value, options, open, onToggle, onSelect, right, ariaLabel, prefix, leadIcon, menuPortal }) {
  const btnRef = React.useRef(null)
  const [pos, setPos] = React.useState(null)
  React.useLayoutEffect(() => {
    if (!(menuPortal && open && btnRef.current)) return
    const place = () => {
      const r = btnRef.current.getBoundingClientRect()
      const est = Math.min(260, (options ? options.length : 5) * 40 + 14)
      const spaceBelow = window.innerHeight - r.bottom - 8, spaceAbove = r.top - 8
      const up = spaceBelow < est && spaceAbove > spaceBelow
      const maxH = Math.max(120, Math.min(260, up ? spaceAbove : spaceBelow))
      const h = Math.min(est, maxH)
      let top = up ? r.top - 6 - h : r.bottom + 6
      top = Math.max(8, Math.min(top, window.innerHeight - 8 - h))
      const left = Math.max(8, Math.min(r.left, window.innerWidth - 8 - r.width))
      setPos({ left, width:r.width, top, maxH })
    }
    place(); window.addEventListener('scroll', place, true); window.addEventListener('resize', place)
    return () => { window.removeEventListener('scroll', place, true); window.removeEventListener('resize', place) }
  }, [menuPortal, open, options])
  const trigger = { width:'100%', height:44, borderRadius:10, padding:'0 12px 0 8px', display:'flex', alignItems:'center', justifyContent:'space-between', fontFamily:'inherit', fontSize:14.3, color:'var(--ink)', cursor:'pointer', background: open ? 'var(--primary-tint)' : 'var(--surface)', border:'1.5px solid ' + (open ? 'var(--primary)' : '#D5DBE4') }
  const baseMenu = { listStyle:'none', margin:0, padding:6, background:'var(--surface)', border:'1px solid var(--border)', borderRadius:12, boxShadow:'0 12px 32px -12px rgba(16,42,84,.25)', maxHeight:260, overflow:'auto', animation:'popIn .14s ease' }
  const menu = menuPortal
    ? { ...baseMenu, position:'fixed', zIndex:5200, left: pos ? pos.left : -9999, width: pos ? pos.width : 'auto', top: pos ? pos.top : -9999, maxHeight: pos ? pos.maxH : 260 }
    : { ...baseMenu, position:'absolute', top:'calc(100% + 6px)', zIndex:3000, ...(right ? { right:0, minWidth:220 } : { left:0, right:0 }) }
  const list = (
    <ul role="listbox" aria-label={ariaLabel} style={menu}>
      {options.map(o => {
        const sel = o === value
        return (
          <li key={o} role="option" data-ix="opt" aria-selected={sel} onClick={() => onSelect(o)}
            style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:10, padding:'10px 12px', borderRadius:8, cursor:'pointer', fontSize:13.8, fontWeight: sel ? 600 : 500, color: sel ? 'var(--on-tint-blue)' : 'var(--ink)', background: sel ? 'var(--primary-tint)' : 'transparent' }}>
            {o}{sel && <Icon d="M20 6L9 17l-5-5" size={15} sw={2.5} />}
          </li>
        )
      })}
    </ul>
  )
  return (
    <div style={{ position:'relative' }}>
      <button ref={btnRef} type="button" data-ix="ix" onClick={onToggle} aria-haspopup="listbox" aria-expanded={open} aria-label={ariaLabel} style={trigger}>
        <span style={{ display:'flex', alignItems:'center', gap:8, minWidth:0, flex:'1 1 0', textAlign:'left', overflow:'hidden' }}>{leadIcon && <span aria-hidden style={{ flex:'none', width:27, height:27, borderRadius:7, display:'flex', alignItems:'center', justifyContent:'center', background:'linear-gradient(155deg, var(--primary-tint), var(--primary-tint-2))', border:'1px solid var(--border-blue)', color:'var(--on-tint-blue)' }}><Icon d={leadIcon} size={15} sw={2.1} style={{ stroke:'var(--on-tint-blue)' }} /></span>}{prefix && <span style={{ fontSize:12.6, fontWeight:600, color:'var(--muted)', whiteSpace:'nowrap' }}>{prefix}</span>}<span style={{ whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{value}</span></span>
        <Icon d="M6 9l6 6 6-6" style={{ transform: open ? 'rotate(180deg)' : 'none', transition:'transform .18s ease', flex:'none', stroke:'var(--muted)' }} />
      </button>
      {open && (menuPortal ? ReactDOM.createPortal(list, document.body) : list)}
    </div>
  )
}

    <span aria-hidden style={{ display:'inline-flex', width:32, height:32, borderRadius:8, alignItems:'center', justifyContent:'center', flex:'none', background:'var(--primary-tint)', color:'var(--primary)' }}><Icon d={icon} size={15} sw={1.9} /></span>
    <span style={{ display:'flex', flexDirection:'column', gap:3, minWidth:0, flex:1 }}>
      <span style={{ fontSize:11.2, fontWeight:600, letterSpacing:'.05em', textTransform:'uppercase', color:'var(--muted)', lineHeight:1.3 }}>{label}</span>
      <span style={{ fontSize:13.8, fontWeight:500, color:'var(--ink)', lineHeight:1.4, fontFamily: mono ? 'ui-monospace,SFMono-Regular,Menlo,monospace' : 'inherit', overflowWrap:'anywhere', textWrap:'pretty' }}>{value}</span>
    </span>
  </div>
)

function MyProfile({ toast }) {
  const [role, setRole] = useState(ME.role)
  const [defRole, setDefRole] = useState(ME.role)
  const [pick, setPick] = useState(null) // 'current' | 'default'
  const [pending, setPending] = useState(null)
  const [alsoDefault, setAlsoDefault] = useState(false)
  const [conn, setConn] = useState({ 'Microsoft': { on:true, id:'anita.k@outlook.com', at:'14 Aug 2026' }, 'Google': null, 'Meta': null, 'Apple': null, 'Microsoft Entra ID': { on:true, id:'anita.k@excelsoftcorp.com', at:'12 Mar 2024' }, 'Okta': null })
  const [busy, setBusy] = useState(null)

  const available = roles.filter(r => r.status === 'Active')
  const curRole = roles.find(r => r.name === role)
  const defRoleObj = roles.find(r => r.name === defRole)
  const closePick = () => { setPick(null); setPending(null); setAlsoDefault(false) }
  const applyRole = () => {
    if (pick === 'current') { setRole(pending); if (alsoDefault) setDefRole(pending); toast('Switched to ' + pending + (alsoDefault ? ' and set as default.' : ' for this session.'), 'success') }
    else { setDefRole(pending); toast('Default role set to ' + pending + '.', 'success') }
    closePick()
  }
  const setCurrentAsDefault = () => { setDefRole(role); toast(role + ' is now your default role.', 'success') }
  const revertToDefault = () => { setRole(defRole); toast('Reverted to default role ' + defRole + '.', 'success') }

  const connect = (p) => {
    setBusy(p.k)
    setTimeout(() => {
      setConn(c => ({ ...c, [p.k]: { on:true, id: p.group === 'Enterprise' ? ME.email : ME.login + '@' + p.k.toLowerCase().replace(/\s.*/, '') + '.com', at:'Today' } }))
      setBusy(null); toast(p.k + ' connected to your account.', 'success')
    }, 900)
  }
  const remove = (p) => { setConn(c => ({ ...c, [p.k]: null })); toast(p.k + ' disconnected.', 'success') }
  const connectedCount = Object.values(conn).filter(Boolean).length

  return (
    <div style={{ animation:'fadeUp .28s ease', display:'flex', flexDirection:'column', gap:18 }}>
      <PageHead title="My Profile" sub="Your account details, role and sign-in methods." />

      <section style={{ ...S.card, overflow:'hidden' }} aria-label="Profile summary">
        <div style={{ display:'flex', alignItems:'center', gap:18, padding:'22px 22px 20px', flexWrap:'wrap', background:'linear-gradient(180deg, var(--primary-tint) 0%, var(--surface) 100%)' }}>
          <Avatar name={ME.name} initials={ME.initials} size={64} ring={{ boxShadow:'0 6px 16px -6px rgba(10,74,140,.5), 0 0 0 4px var(--surface)' }} />
          <div style={{ display:'flex', flexDirection:'column', gap:4, minWidth:0, flex:1 }}>
            <span style={{ display:'flex', alignItems:'center', gap:10, flexWrap:'wrap' }}>
              <span style={{ fontSize:19, fontWeight:600, color:'var(--ink)' }}>{ME.name}</span>
              <span style={{ display:'inline-flex', alignItems:'center', gap:6, fontSize:11.5, fontWeight:700, padding:'3px 10px', borderRadius:999, background:'#E7F6EE', color:'#1F7A4D' }}><span style={{ width:6, height:6, borderRadius:'50%', background:'#2E9E6B' }} />{ME.status}</span>
              {ME.mfa && <span style={{ display:'inline-flex', alignItems:'center', gap:5, fontSize:11.5, fontWeight:700, padding:'3px 10px', borderRadius:999, background:'var(--primary-tint)', color:'var(--on-tint-blue)' }}><Icon d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z M9 12l2 2 4-4" size={12} sw={2.2} />MFA on</span>}
            </span>
            <span style={{ fontSize:13.4, color:'var(--muted)' }}>{ME.designation} · {ME.tenant}</span>
            <span style={{ fontSize:13, color:'var(--muted)' }}>{ME.email}</span>
          </div>
          <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
            <button data-ix="ghost" onClick={() => toast('Password reset link sent to ' + ME.email + '.', 'success')} style={S.ghost}><Icon d="M5 11h14v10H5z M8 11V7a4 4 0 0 1 8 0" />Change password</button>
            <button data-ix="primary" onClick={() => toast('Profile edit coming soon.', 'success')} style={S.primary}><Icon d="M12 20h9 M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z" />Edit profile</button>
          </div>
        </div>
        <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fill, minmax(min(100%, 240px), 1fr))', gap:1, padding:1, borderTop:'1px solid var(--border)', background:'var(--border)' }}>
          <Detail label="Login ID" value={ME.login} mono icon="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2 M12 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z" />
          <Detail label="Email" value={ME.email} icon="M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z M22 6l-10 7L2 6" />
          <Detail label="Phone" value={ME.phone} icon="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z" />
          <Detail label="Account type" value={ME.type} icon="M12 2 3 7v6c0 5 4 8 9 9 5-1 9-4 9-9V7l-9-5z" />
          <Detail label="Tenant" value={ME.tenant} icon="M3 21h18 M5 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16 M9 7h4 M9 11h4 M9 15h4" />
          <Detail label="Designation" value={ME.designation} icon="M20 7H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2z M16 7V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v2" />
          <Detail label="Member since" value={ME.created} icon="M3 4h18v18H3z M16 2v4 M8 2v4 M3 10h18" />
          <Detail label="Last login" value={ME.lastLogin} icon="M12 8v4l3 3 M12 22a10 10 0 1 0 0-20 10 10 0 0 0 0 20z" />
        </div>
      </section>

      <div style={{ display:'flex', flexDirection:'column', gap:18 }}>
        <Card title="Roles" sub="Current role applies to this session; default role is loaded at every sign-in." icon="M12 2 3 7v6c0 5 4 8 9 9 5-1 9-4 9-9V7l-9-5z M9 12l2 2 4-4"
          action={role !== defRole && !pick && <button data-ix="ghost" onClick={revertToDefault} style={{ ...S.ghost, height:38, fontSize:13 }}><Icon d="M3 12a9 9 0 1 0 2.64-6.36 M3 3v6h6" size={14} />Revert to default</button>}>
          <div style={{ padding:'16px 18px', display:'flex', flexDirection:'column', gap:14 }}>
            <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(min(100%, 300px), 1fr))', gap:12 }}>
              {[
                { kind:'current', label:'Current role', name:role, r:curRole, hint: role === defRole ? 'Same as your default role.' : 'Temporary — resets to default at next sign-in.', icon:'M12 2 3 7v6c0 5 4 8 9 9 5-1 9-4 9-9V7l-9-5z' },
                { kind:'default', label:'Default role', name:defRole, r:defRoleObj, hint:'Assigned automatically on every sign-in.', icon:'M12 17.3l-6.2 3.3 1.2-6.9L2 8.8l6.9-1L12 1.5l3.1 6.3 6.9 1-5 4.9 1.2 6.9z' },
              ].map(t => {
                const active = pick === t.kind
                return (
                  <div key={t.kind} style={{ display:'flex', flexDirection:'column', gap:12, padding:'14px 16px', borderRadius:12, background: t.kind === 'current' ? 'linear-gradient(180deg, var(--primary-tint), rgba(230,240,252,.4))' : 'var(--surface)', border:'1.5px solid ' + (active ? 'var(--primary)' : t.kind === 'current' ? 'var(--border-blue)' : 'var(--border)') }}>
                    <div style={{ display:'flex', alignItems:'center', gap:14 }}>
                      <span aria-hidden style={{ display:'inline-flex', width:44, height:44, borderRadius:11, alignItems:'center', justifyContent:'center', flex:'none', background: t.kind === 'current' ? 'var(--primary)' : 'var(--primary-tint)', color: t.kind === 'current' ? '#fff' : 'var(--primary)' }}><Icon d={t.icon} size={20} sw={1.9} /></span>
                      <span style={{ display:'flex', flexDirection:'column', gap:3, minWidth:0, flex:1 }}>
                        <span style={{ fontSize:11.2, fontWeight:700, letterSpacing:'.05em', textTransform:'uppercase', color:'var(--primary)' }}>{t.label}</span>
                        <span style={{ fontSize:15.5, fontWeight:600, color:'var(--ink)' }}>{t.name}</span>
                        {t.r && <span style={{ fontSize:12.4, color:'var(--muted)' }}>{t.r.code} · {t.r.scope} scope · {t.r.privs} privileges</span>}
                      </span>
                    </div>
                    <span style={{ fontSize:12.2, color:'var(--muted)' }}>{t.hint}</span>
                    {!pick && (
                      <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
                        <button data-ix="ghost" onClick={() => { setPending(t.name); setPick(t.kind) }} style={{ ...S.ghost, height:36, fontSize:12.6, padding:'0 12px', borderRadius:9 }}><Icon d="M17 1l4 4-4 4 M3 11V9a4 4 0 0 1 4-4h14 M7 23l-4-4 4-4 M21 13v2a4 4 0 0 1-4 4H3" size={14} />Change</button>
                        {t.kind === 'current' && role !== defRole && <button data-ix="ghost" onClick={setCurrentAsDefault} style={{ ...S.ghost, height:36, fontSize:12.6, padding:'0 12px', borderRadius:9 }}><Icon d="M12 17.3l-6.2 3.3 1.2-6.9L2 8.8l6.9-1L12 1.5l3.1 6.3 6.9 1-5 4.9 1.2 6.9z" size={14} />Set as default</button>}
                      </div>
                    )}
                  </div>
                )
              })}
            </div>
            {pick && (
              <div style={{ display:'flex', flexDirection:'column', gap:10, animation:'fadeUp .22s ease' }}>
                <span style={{ fontSize:12.6, fontWeight:600, color:'var(--ink)' }}>{pick === 'current' ? 'Switch role for this session' : 'Choose the role to load at every sign-in'}</span>
                <div role="radiogroup" aria-label="Available roles" style={{ display:'flex', flexDirection:'column', gap:6, maxHeight:280, overflowY:'auto', paddingRight:2 }}>
                  {available.map(r => {
                    const sel = pending === r.name
                    const tag = r.name === role && r.name === defRole ? 'Current · Default' : r.name === role ? 'Current' : r.name === defRole ? 'Default' : null
                    return (
                      <button key={r.code} role="radio" aria-checked={sel} data-ix="opt" onClick={() => setPending(r.name)} style={{ display:'flex', alignItems:'center', gap:12, textAlign:'left', padding:'10px 12px', borderRadius:10, border:'1.5px solid ' + (sel ? 'var(--primary)' : 'var(--border)'), background: sel ? 'var(--primary-tint)' : 'var(--surface)', fontFamily:'inherit', cursor:'pointer' }}>
                        <span aria-hidden style={{ width:18, height:18, borderRadius:'50%', flex:'none', border:'2px solid ' + (sel ? 'var(--primary)' : '#B9C4D4'), display:'flex', alignItems:'center', justifyContent:'center' }}>{sel && <span style={{ width:8, height:8, borderRadius:'50%', background:'var(--primary)' }} />}</span>
                        <span style={{ display:'flex', flexDirection:'column', gap:1, minWidth:0, flex:1 }}>
                          <span style={{ fontSize:13.6, fontWeight:600, color:'var(--ink)' }}>{r.name}{tag && <span style={{ marginLeft:8, fontSize:10.5, fontWeight:700, padding:'1px 7px', borderRadius:999, background:'#EEF1F6', color:'var(--muted)' }}>{tag}</span>}</span>
                          <span style={{ fontSize:12, color:'var(--muted)' }}>{r.desc}</span>
                        </span>
                        <span style={{ fontSize:11.5, fontWeight:600, color:'var(--muted)', whiteSpace:'nowrap' }}>{r.scope}</span>
                      </button>
                    )
                  })}
                </div>
                {pick === 'current' && <label style={{ display:'flex', alignItems:'center', gap:10, fontSize:12.8, color:'var(--ink)', cursor:'pointer' }}><MiniSwitch on={alsoDefault} onToggle={() => setAlsoDefault(v => !v)} label="Also make this my default role" />Also make this my default role</label>}
                <div style={{ display:'flex', justifyContent:'flex-end', gap:8, paddingTop:4 }}>
                  <button data-ix="ghost" onClick={() => { setPick(null); setPending(null); setAlsoDefault(false) }} style={{ ...S.ghost, height:40 }}>Cancel</button>
                  <button data-ix="primary" disabled={!pending || pending === (pick === 'current' ? role : defRole)} onClick={applyRole} style={{ ...S.primary, height:40 }}>{pick === 'current' ? 'Switch role' : 'Save default'}</button>
                </div>
              </div>
            )}
          </div>
        </Card>

        <Card title="Connect Authentication Providers" sub="Link external identities to sign in to SARAS One." icon="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71 M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"
          action={<span style={{ fontSize:11.5, fontWeight:700, padding:'3px 10px', borderRadius:999, background:'var(--primary-tint)', color:'var(--on-tint-blue)', whiteSpace:'nowrap' }}>{connectedCount} of {PROVIDERS.length} connected</span>}>
          <div style={{ padding:'10px 12px 14px', display:'flex', flexDirection:'column', gap:6 }}>
            {PROVIDERS.map(p => {
              const c = conn[p.k]
              const loading = busy === p.k
              return (
                <div key={p.k} style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:12, padding:'11px 12px', borderRadius:11, border:'1px solid ' + (c ? 'var(--border-blue)' : 'var(--border)'), background: c ? 'var(--surface)' : 'var(--surface-page)', transition:'all .15s ease', flexWrap:'wrap' }}>
                  <span style={{ display:'flex', alignItems:'center', gap:12, minWidth:0, flex:1 }}>
                    <span aria-hidden style={{ display:'inline-flex', width:40, height:40, borderRadius:10, alignItems:'center', justifyContent:'center', flex:'none', background:'#fff', border:'1px solid ' + (c ? 'var(--border-blue)' : 'var(--border)'), filter: c ? 'none' : 'grayscale(1) opacity(.6)', transition:'filter .2s ease' }}><ProviderLogo k={p.k} /></span>
                    <span style={{ display:'flex', flexDirection:'column', gap:2, minWidth:0 }}>
                      <span style={{ display:'flex', alignItems:'center', gap:8, flexWrap:'wrap' }}>
                        <span style={{ fontSize:13.8, fontWeight:600, color:'var(--ink)' }}>{p.k}</span>
                        <span style={{ fontSize:10.5, fontWeight:700, padding:'1px 7px', borderRadius:999, background:'#EEF1F6', color:'var(--muted)' }}>{p.group}</span>
                      </span>
                      {c
                        ? <span style={{ display:'flex', alignItems:'center', gap:6, fontSize:12, color:'#1F7A4D', fontWeight:600, flexWrap:'wrap' }}><Icon d="M20 6L9 17l-5-5" size={12} sw={2.6} />Connected as <span style={{ fontFamily:'ui-monospace,SFMono-Regular,Menlo,monospace', fontWeight:500, color:'var(--ink)' }}>{c.id}</span><span style={{ color:'var(--muted)', fontWeight:400 }}>· {c.at}</span></span>
                        : <span style={{ fontSize:12, color:'var(--muted)' }}>{loading ? 'Redirecting to ' + p.k + '…' : p.desc}</span>}
                    </span>
                  </span>
                  <span style={{ display:'flex', gap:6, flex:'none' }}>
                    {c ? (
                      <>
                        <button data-ix="ghost" onClick={() => { remove(p); setTimeout(() => connect(p), 200) }} style={{ ...S.ghost, height:36, fontSize:12.6, padding:'0 12px', borderRadius:9 }}><Icon d="M21 12a9 9 0 1 1-2.64-6.36 M21 3v6h-6" size={14} />Reconnect</button>
                        <button data-ix="dang" onClick={() => remove(p)} style={{ ...S.ghost, height:36, fontSize:12.6, padding:'0 12px', borderRadius:9, borderColor:'var(--border)', color:'var(--muted)' }}><Icon d="M18 6L6 18 M6 6l12 12" size={14} />Remove</button>
                      </>
                    ) : (
                      <button data-ix="primary" disabled={loading} onClick={() => connect(p)} style={{ ...S.primary, height:36, fontSize:12.8, padding:'0 14px', borderRadius:9 }}>{loading ? <span aria-hidden style={{ width:14, height:14, border:'2px solid rgba(255,255,255,.4)', borderTopColor:'#fff', borderRadius:'50%', animation:'spin .7s linear infinite' }} /> : <Icon d="M12 5v14 M5 12h14" size={14} />}{loading ? 'Connecting' : 'Connect'}</button>
                    )}
                  </span>
                </div>
              )
            })}
            <p style={{ margin:'8px 4px 0', fontSize:12, color:'var(--muted)' }}>Only providers enabled for your tenant are listed. Local username &amp; password sign-in stays available.</p>
          </div>
        </Card>
      </div>
    </div>
  )
}

function AuthProvidersModal({ tenant, onClose, stop, toast }) {
  const groups = [
    { k:'local', label:'Local Authentication', desc:'Username and password accounts managed in SARAS One.', icon:'M5 11h14v10H5z M8 11V7a4 4 0 0 1 8 0', providers:[] },
    { k:'social', label:'Social Authentication', desc:'Sign in with consumer identity providers.', icon:'M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2 M9 11a4 4 0 1 0 0-8 4 4 0 0 0 0 8z M22 21v-2a4 4 0 0 0-3-3.87 M16 3.13a4 4 0 0 1 0 7.75', providers:['Microsoft', 'Google', 'Meta', 'Apple'] },
    { k:'ent', label:'Enterprise Federation', desc:'Federated single sign-on for workforce identity.', icon:'M3 21h18 M5 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16 M9 7h4 M9 11h4 M9 15h4', providers:['Microsoft Entra ID', 'Okta', 'SAML 2.0'] },
  ]
  const [state, setState] = useState({ local:true, social:true, ent:false, 'Microsoft':true, 'Google':true, 'Meta':false, 'Apple':false, 'Microsoft Entra ID':false, 'Okta':false, 'SAML 2.0':false })
  const flip = (k) => setState(s => ({ ...s, [k]:!s[k] }))
  const initials = { 'Microsoft':'MS', 'Google':'G', 'Meta':'M', 'Apple':'A', 'Microsoft Entra ID':'ME', 'Okta':'OK', 'SAML 2.0':'SA' }
  const save = () => { onClose(); toast('Authentication providers updated for ' + tenant.name + '.', 'success') }
  return (
    <Modal title={'Authentication providers \u2014 ' + tenant.name} desc="Choose how accounts in this tenant can sign in." onClose={onClose} stop={stop} width={640} footer={<ModalFooter onClose={onClose} onSave={save} save="Save providers" />}>
      <div style={{ maxHeight:'min(64vh, 620px)', overflowY:'auto', padding:'20px 24px 24px', display:'flex', flexDirection:'column', gap:16 }}>
        {groups.map(g => {
          const on = !!state[g.k]
          const enabledCount = g.providers.filter(p => state[p]).length
          return (
            <section key={g.k} aria-label={g.label} style={{ flex:'none', border:'1.5px solid ' + (on ? 'var(--border-blue)' : 'var(--border)'), borderRadius:14, background:'var(--surface)', overflow:'hidden', boxShadow: on ? '0 2px 8px -4px rgba(16,42,84,.12)' : 'none', opacity: on ? 1 : .78, transition:'all .2s ease' }}>
              <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:14, padding:'15px 18px', background: on ? 'linear-gradient(180deg, var(--primary-tint), rgba(230,240,252,.4))' : 'var(--surface-page)', transition:'background .2s ease' }}>
                <span style={{ display:'flex', alignItems:'center', gap:13, minWidth:0 }}>
                  <span style={{ display:'inline-flex', width:40, height:40, borderRadius:10, alignItems:'center', justifyContent:'center', flex:'none', background: on ? 'var(--primary)' : '#DCE2EC', color: on ? '#fff' : 'var(--muted)', transition:'all .2s ease' }}><Icon d={g.icon} size={18} sw={1.9} /></span>
                  <span style={{ display:'flex', flexDirection:'column', gap:2, minWidth:0 }}>
                    <span style={{ display:'flex', alignItems:'center', gap:8 }}>
                      <span style={{ fontSize:14.8, fontWeight:600, color:'var(--ink)', whiteSpace:'nowrap' }}>{g.label}</span>
                      {g.providers.length > 0 && on && <span style={{ fontSize:11, fontWeight:700, padding:'2px 8px', borderRadius:999, background:'#fff', border:'1px solid var(--border-blue)', color:'var(--primary)', whiteSpace:'nowrap' }}>{enabledCount + ' of ' + g.providers.length + ' on'}</span>}
                      {!on && <span style={{ fontSize:11, fontWeight:700, padding:'2px 8px', borderRadius:999, background:'#EEF1F6', color:'var(--muted)', whiteSpace:'nowrap' }}>Off</span>}
                    </span>
                    <span style={{ fontSize:12.2, color:'var(--muted)' }}>{g.desc}</span>
                  </span>
                </span>
                <MiniSwitch on={on} onToggle={() => flip(g.k)} label={g.label} />
              </div>
              {g.providers.length > 0 && on && <div style={{ borderTop:'1px solid var(--border)', background:'var(--surface)', padding:'6px 10px 10px' }}>
                {g.providers.map(p => (
                  <div key={p} style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:12, padding:'9px 8px 9px 10px', borderRadius:9, marginTop:4, background: state[p] ? 'var(--surface)' : 'var(--surface-page)', border:'1px solid ' + (state[p] ? 'var(--border)' : 'transparent'), transition:'all .15s ease' }}>
                    <span style={{ display:'flex', alignItems:'center', gap:11, minWidth:0 }}>
                      <span aria-hidden style={{ display:'inline-flex', width:32, height:32, borderRadius:8, alignItems:'center', justifyContent:'center', fontSize:11.5, fontWeight:700, flex:'none', background: state[p] ? 'var(--primary-tint)' : '#EEF1F6', border:'1px solid ' + (state[p] ? 'var(--border-blue)' : 'var(--border)'), color: state[p] ? 'var(--primary)' : 'var(--muted)', transition:'all .15s ease' }}>{initials[p]}</span>
                      <span style={{ display:'flex', flexDirection:'column', gap:0, minWidth:0 }}>
                        <span style={{ fontSize:13.8, fontWeight:600, color:'var(--ink)', whiteSpace:'nowrap' }}>{p}</span>
                        <span style={{ fontSize:11.4, fontWeight:600, color: state[p] ? '#2E9E6B' : 'var(--muted)' }}>{state[p] ? 'Enabled' : 'Disabled'}</span>
                      </span>
                    </span>
                    <MiniSwitch on={!!state[p]} onToggle={() => flip(p)} label={p} />
                  </div>
                ))}
              </div>}
            </section>
          )
        })}
      </div>
    </Modal>
  )
}

function syncFmt(ts) { if (!ts) return '—'; const d = new Date(ts); return syPad(d.getDate()) + ' ' + SY_MON[d.getMonth()] + ' ' + d.getFullYear() + ', ' + syPad(d.getHours()) + ':' + syPad(d.getMinutes()) + ':' + syPad(d.getSeconds()) }

const SY_CHANGE = { ACCOUNT:['status','Active','Suspended'], ACCOUNT_ROLE:['access_level','Local','Deep'], TENANT:['plan','Standard','Enterprise'], ROLE:['description','Reviews items','Reviews and approves items'], ORG_UNIT:['parent_code','EXA-ROOT','EXA-SCI'], PRIVILEGE:['active',true,false], LOOKUP:['sort_order',3,1] }
const syHex = (seed, n) => { let s = ''; for (let i = 0; i < n; i++) s += '0123456789abcdef'[Math.floor(Math.abs(Math.sin(seed * 12.9898 + i * 78.233) * 43758.5453)) % 16]; return s }
const syUuid = (s) => syHex(s, 8) + '-' + syHex(s + 1, 4) + '-4' + syHex(s + 2, 3) + '-a' + syHex(s + 3, 3) + '-' + syHex(s + 4, 12)
const syCap = (s) => s.split(' ').map(w => w ? w[0].toUpperCase() + w.slice(1) : w).join(' ')
function sySample(col, code, i, ts) {
  const t = col.type, n = col.name, base = code.split(':')[0]
  if (t === 'uuid') return syUuid(i * 7 + n.split('').reduce((h, ch) => h * 31 + ch.charCodeAt(0), 0) % 9973)
  if (t === 'boolean') return i % 3 !== 0
  if (t === 'datetime') return new Date(ts).toISOString()
  if (t === 'number') return (i % 9) + 1
  if (t === 'enum') return n === 'status' ? 'Active' : n === 'scope' ? 'Tenant' : n === 'access_level' ? 'Local' : n === 'type' ? 'Department' : n === 'plan' ? 'Enterprise' : 'Default'
  if (n === 'email') return base + '@academy.excelsoft.edu'
  if (n === 'login' || n === 'code') return base
  if (n === 'first_name') return syCap(base.split('.')[0])
  if (n === 'last_name') return syCap(base.split('.')[1] || 'user')
  if (n === 'name') return syCap(base.replace(/[._-]/g, ' ').toLowerCase())
  if (n === 'tenant_code') return 'EXA-01'
  if (n === 'role_code') return code.split(':')[1] || 'CANDIDATE'
  if (n === 'phone') return '+91 98450 ' + String(10000 + i * 37).slice(-5)
  if (n === 'domain') return 'academy.excelsoft.edu'
  if (n === 'org_unit' || n === 'parent_code') return 'EXA-SCI'
  if (n === 'country') return 'India'
  return base
}

const SY_NOW = Date.now()
const syncOutbox = Array.from({ length: 68 }, (_, i) => {
  const entity = SY_MIX[i % SY_MIX.length]
  const ent = syncEntities.find(e => e.code === entity)
  const codes = SY_CODES[entity]
  const code = codes[(i * 3 + 1) % codes.length]
  const operation = i % 7 === 3 ? 'Delete' : i % 3 === 0 ? 'Create' : 'Update'
  const ageMin = i < 6 ? i * 2 + 1 : Math.round(12 + Math.pow(i - 5, 1.7) * 8)
  const ts = SY_NOW - ageMin * 60000 - ((i * 13) % 60) * 1000
  const stuck = i === 14 || i === 27
  const status = i < 2 ? 'New' : i < 4 ? 'Expanded' : (i < 8 || stuck) ? 'In Process' : 'Applied'
  const apps = syncApps.filter(a => a.subscribed && a.subs[entity]).map(a => a.name)
  const deliveries = status === 'New' ? [] : apps.map((app, k) => {
    if (status === 'Expanded') return { app, status:'Pending', at:null }
    if (status === 'Applied') return { app, status:'Applied', at: ts + (8 + k * 5 + (i % 7)) * 1000 }
    if (stuck && k === apps.length - 1) return { app, status:'Failed', at: ts + 40000, error:'HTTP 503 from subscriber endpoint — retry 3 of 5 scheduled' }
    if (k === 0 || (k === 1 && !stuck && apps.length > 2)) return { app, status:'Applied', at: ts + (6 + k * 4) * 1000 }
    return { app, status:'Pending', at:null }
  })
  const completedAt = status === 'Applied' ? Math.max(ts + 3000, ...deliveries.map(d => d.at)) : null
  const id = 'EVT-' + (482190 - i)
  const data = operation === 'Delete' ? { [ent.cols[0].name]: sySample(ent.cols[0], code, i, ts), deleted: true } : Object.fromEntries(ent.cols.map(c => [c.name, sySample(c, code, i, ts)]))
  const ch = SY_CHANGE[entity]
  const payload = { eventId:id, entity, operation:operation.toUpperCase(), recordCode:code, tenant:'EXA-01', occurredAt:new Date(ts).toISOString(), actor: i % 4 === 0 ? 'system:hrms-import' : 'anita.k@excelsoftcorp.com', version: 3 + (i % 5), data, ...(operation === 'Update' ? { changes:[{ field:ch[0], old:ch[1], new:ch[2] }] } : {}) }
  return { id, entity, entityName:ent.name, code, operation, ts, status, completedAt, subs: status === 'New' ? null : deliveries.length, applied: deliveries.filter(d => d.status === 'Applied').length, failed: deliveries.filter(d => d.status === 'Failed').length, deliveries, payload }
})

const SY_TOKEN = /("(?:\\u[a-fA-F0-9]{4}|\\[^u]|[^\\"])*")(\s*:)?|\b(true|false|null)\b|(-?\d+(?:\.\d+)?(?:[eE][+-]?\d+)?)/g
function syJsonLine(line) {
  const out = []
  let last = 0, m, k = 0
  SY_TOKEN.lastIndex = 0
  while ((m = SY_TOKEN.exec(line))) {
    if (m.index > last) out.push(line.slice(last, m.index))
    if (m[1]) {
      if (m[2]) { out.push(<span key={k++} style={{ color:'#0a4a8c', fontWeight:600 }}>{m[1]}</span>); out.push(m[2]) }
      else out.push(<span key={k++} style={{ color:'var(--success-text)' }}>{m[1]}</span>)
    } else if (m[3]) out.push(<span key={k++} style={{ color:'#6D28D9', fontWeight:600 }}>{m[3]}</span>)
    else out.push(<span key={k++} style={{ color:'#B45309' }}>{m[4]}</span>)
    last = SY_TOKEN.lastIndex
  }
  if (last < line.length) out.push(line.slice(last))
  return out
}

  return { hi:Math.ceil(max / step) * step, step }

  const x = v => pl + v / sc.hi * iw
  const ticks = []; for (let v = 0; v <= sc.hi + 1e-9; v += sc.step) ticks.push(v)
  const tot = (k) => rows.reduce((a, r) => a + r[k], 0)
  const cur = hi !== null ? vis[hi] : null
  const scroller = React.useRef(null)
  const st = scroller.current ? scroller.current.scrollTop : 0
  const pill = (k, t) => { const on = sortBy === k; return <button key={k} type="button" role="tab" aria-selected={on} onClick={() => setSortBy(k)} style={{ border:'none', borderRadius:7, padding:'0 10px', height:28, fontFamily:'inherit', fontSize:12.4, fontWeight: on ? 700 : 600, color: on ? 'var(--ink)' : 'var(--muted)', background: on ? 'var(--surface)' : 'transparent', boxShadow: on ? '0 2px 6px -2px rgba(16,42,84,.2)' : 'none', cursor:'pointer', whiteSpace:'nowrap' }}>{t}</button> }
  return (
    <div style={{ padding:'14px 18px 8px', display:'flex', flexDirection:'column', gap:10 }}>
      <div style={{ display:'flex', alignItems:'center', gap:18, flexWrap:'wrap' }}>
        {SY_SEG.map(s => (
          <span key={s.k} style={{ display:'inline-flex', alignItems:'center', gap:8, fontSize:12.8, color:'var(--ink)' }}>
            <span aria-hidden style={{ width:10, height:10, borderRadius:3, background:'linear-gradient(180deg,' + s.c[0] + ',' + s.c[1] + ')' }}></span>
            {s.label}<b style={{ fontWeight:600, fontVariantNumeric:'tabular-nums' }}>{tot(s.k)}</b>
          </span>
        ))}
        <div role="tablist" aria-label="Sort subscribers" style={{ marginLeft:'auto', display:'inline-flex', gap:2, padding:3, background:'#EAEEF3', border:'1px solid var(--border)', borderRadius:10 }}>
          {pill('attention', 'Needs attention')}{pill('events', 'Most events')}{pill('az', 'A–Z')}
        </div>
      </div>
      <div ref={ref} style={{ position:'relative', width:'100%' }} onMouseLeave={() => setHi(null)}>
        <div ref={scroller} onScroll={() => setHi(null)} style={{ maxHeight: showAll ? MAXH : 'none', overflowY: showAll ? 'auto' : 'visible' }}>
          <svg width={W} height={H} role="img" aria-label={vis.map(r => r.a.name + ': ' + r.applied + ' succeeded, ' + r.pending + ' pending, ' + r.failed + ' failed').join('; ')} style={{ display:'block' }}>
            <defs>
              {SY_SEG.map(s => <linearGradient key={s.k} id={'syh' + s.k} x1="0" x2="0" y1="0" y2="1"><stop offset="0" stopColor={s.c[0]} /><stop offset="1" stopColor={s.c[1]} /></linearGradient>)}
              <linearGradient id="syhgl" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stopColor="#fff" stopOpacity=".34" /><stop offset=".5" stopColor="#fff" stopOpacity=".06" /><stop offset="1" stopColor="#fff" stopOpacity="0" /></linearGradient>
              <filter id="syhsh" x="-5%" y="-60%" width="110%" height="260%"><feDropShadow dx="0" dy="3" stdDeviation="3" floodColor="#0B3A75" floodOpacity=".2" /></filter>
              {vis.map((r, i) => { const by = pt + i * rowH + (rowH - bh) / 2; return <clipPath key={i} id={'syhc' + i}><rect x={pl} y={by} width={Math.max(0, x(r.delivered) - pl)} height={bh} rx={bh / 2} /></clipPath> })}
            </defs>
            {ticks.map(v => <line key={v} x1={x(v)} x2={x(v)} y1={0} y2={H} stroke="#E4E9F0" strokeDasharray={v ? '3 4' : ''} />)}
            {vis.map((r, i) => {
              const cy = pt + i * rowH + rowH / 2, by = cy - bh / 2
              let acc = 0
              return (
                <g key={r.a.code} onMouseEnter={() => setHi(i)}>
                  <rect x={0} y={pt + i * rowH} width={W} height={rowH} fill={hi === i ? 'rgba(0,112,224,.05)' : 'transparent'} />
                  <text x={pl - 12} y={cy + 4} textAnchor="end" fontSize={narrow ? 12 : 13} fill={hi === i ? '#1A1E26' : '#344054'} fontWeight={hi === i ? 600 : 500}>{r.a.name.length > (narrow ? 14 : 22) ? r.a.name.slice(0, narrow ? 13 : 21) + '…' : r.a.name}</text>
                  {r.delivered > 0 ? (
                    <g filter="url(#syhsh)" opacity={hi === null || hi === i ? 1 : 0.55}>
                      <g clipPath={'url(#syhc' + i + ')'}>
                        {SY_SEG.map(s => { const v = r[s.k]; if (!v) return null; const x0 = x(acc); acc += v; return <rect key={s.k} x={x0} y={by} width={x(acc) - x0} height={bh} fill={'url(#syh' + s.k + ')'} /> })}
                        <rect x={pl} y={by} width={x(r.delivered) - pl} height={bh / 2} fill="url(#syhgl)" pointerEvents="none" />
                      </g>
                    </g>
                  ) : <rect x={pl} y={by} width={Math.min(iw, 40)} height={bh} rx={bh / 2} fill="#EEF2F7" />}
                  <text x={x(r.delivered) + 8} y={cy + 4} fontSize="12.5" fontWeight="600" fill={r.delivered ? '#1A1E26' : '#5A6675'} style={{ fontVariantNumeric:'tabular-nums' }}>{r.delivered || '0'}</text>
                </g>
              )
            })}
            <line x1={pl} x2={pl} y1={0} y2={H} stroke="#C9D3E0" />
          </svg>
        </div>
        <svg width={W} height={22} aria-hidden="true" style={{ display:'block', borderTop:'1px solid #C9D3E0' }}>
          {ticks.map(v => <text key={v} x={x(v)} y={16} textAnchor="middle" fontSize="12" fill="#5A6675">{v % 1 ? v.toFixed(1) : v}</text>)}
        </svg>
        {cur && (
          <div style={{ position:'absolute', left:Math.min(Math.max(x(cur.delivered / 2), 110), W - 110), top:pt + hi * rowH + (rowH - bh) / 2 - 8 - st, transform:'translate(-50%, -100%)', background:'#1A2740', color:'#fff', borderRadius:8, padding:'8px 12px', pointerEvents:'none', whiteSpace:'nowrap', boxShadow:'0 10px 24px -8px rgba(16,42,84,.5)', display:'flex', flexDirection:'column', gap:4, zIndex:2 }}>
            <span style={{ fontSize:11.5, color:'#C9D6EA' }}>{cur.a.name} · {cur.delivered} events</span>
            <span style={{ display:'flex', gap:12, fontSize:12.6, fontWeight:600 }}>
              {SY_SEG.map(s => <span key={s.k} style={{ display:'inline-flex', alignItems:'center', gap:6 }}><span aria-hidden style={{ width:8, height:8, borderRadius:2, background:s.c[0] }}></span>{cur[s.k]} {s.label.toLowerCase()}</span>)}
            </span>
          </div>
        )}
      </div>
      {rest.length > 0 && (
        <div style={{ display:'flex', alignItems:'center', gap:12, padding:'8px 12px', borderRadius:10, background:'var(--primary-tint-2)', flexWrap:'wrap' }}>
          <span style={{ flex:1, minWidth:0, fontSize:12.8, color:'#344054' }}>
            {showAll ? 'Showing all ' + sorted.length + ' subscribers' : <span><b style={{ fontWeight:600, color:'var(--ink)' }}>+{rest.length} more</b> · {restEv} events{restIssues ? ' · ' + restIssues + ' with pending or failed' : ' · all healthy'}</span>}
          </span>
          <button type="button" onClick={() => { setShowAll(v => !v); setHi(null) }} style={{ border:'none', background:'transparent', color:'var(--primary)', fontFamily:'inherit', fontSize:12.8, fontWeight:600, cursor:'pointer', padding:'6px 4px', minHeight:32 }}>{showAll ? 'Show top ' + LIMIT : 'Show all'}</button>
        </div>
      )}
    </div>
  )
}

const SY_WINDOWS = [
  { k:'1h', t:'1 hour', long:'Last 1 hour', ms:36e5 },
  { k:'4h', t:'4 hours', long:'Last 4 hours', ms:4 * 36e5 },
  { k:'8h', t:'8 hours', long:'Last 8 hours', ms:8 * 36e5 },
  { k:'24h', t:'24 hours', long:'Last 24 hours', ms:864e5 },
  { k:'today', t:'Today', long:'Today' },
  { k:'7d', t:'7 days', long:'Last 7 days', ms:7 * 864e5 },
]

function SyncDashboard({ go }) {
  const [win, setWin] = React.useState('24h')
  const [openApps, setOpenApps] = React.useState({})
  const shWrap = React.useRef(null), shHead = React.useRef(null)
  const [sh, setSh] = React.useState({ vis:false, left:0, width:0, top:64, sx:0, tw:0 })
  const shSync = React.useCallback(() => {
    const w = shWrap.current, h = shHead.current
    if (!w || !h) return
    const hdr = document.querySelector('header')
    const top = hdr ? Math.max(0, hdr.getBoundingClientRect().bottom) : 0
    const hr = h.getBoundingClientRect(), wr = w.getBoundingClientRect()
    const vis = hr.bottom < top && wr.bottom > top + hr.height + 56
    setSh(p => (p.vis === vis && p.left === wr.left && p.width === w.clientWidth && p.top === top && p.sx === w.scrollLeft && p.tw === w.scrollWidth) ? p : { vis, left:wr.left, width:w.clientWidth, top, sx:w.scrollLeft, tw:w.scrollWidth })
  }, [])
  React.useEffect(() => {
    document.addEventListener('scroll', shSync, true); window.addEventListener('resize', shSync); shSync()
    return () => { document.removeEventListener('scroll', shSync, true); window.removeEventListener('resize', shSync) }
  }, [shSync])
  React.useEffect(() => { shSync() })
  const shCols = <colgroup><col /><col style={{ width:96 }} /><col style={{ width:88 }} /><col style={{ width:92 }} /><col style={{ width:84 }} /><col style={{ width:112 }} /><col style={{ width:124 }} /></colgroup>
  const shRow = <tr><Th label="Application" align="left" /><Th label="Entities" align="left" /><Th label="Events" align="left" /><Th label="Pending" align="left" /><Th label="Failed" align="left" /><Th label="Succeeded" align="left" /><Th label="Last applied" align="left" /></tr>
  const W = SY_WINDOWS.find(w => w.k === win)
  const now = Date.now()
  const since = W.k === 'today' ? new Date(new Date().setHours(0, 0, 0, 0)).getTime() : now - W.ms
  const sinceTxt = (() => { const d = new Date(since), p = (n) => String(n).padStart(2, '0'); return W.ms && W.ms >= 864e5 ? syncFmt(since).split(', ')[0] + ', ' + p(d.getHours()) + ':' + p(d.getMinutes()) : p(d.getHours()) + ':' + p(d.getMinutes()) })()
  const tag = W.k === 'today' ? 'today' : W.k
  const ev = syncOutbox.filter(e => e.ts >= since)
  const appliedN = ev.filter(e => e.status === 'Applied').length
  const cnt = (s) => ev.filter(e => e.status === s).length
  const inflight = cnt('New') + cnt('Expanded') + cnt('In Process')
  const allDel = ev.flatMap(e => e.deliveries.map(d => ({ ...d, e })))
  const failed = allDel.filter(d => d.status === 'Failed')
  const failedApps = Array.from(new Set(failed.map(d => d.app)))
  const subApps = syncApps.filter(a => a.subscribed)
  const health = subApps.map(a => {
    const d = allDel.filter(x => x.app === a.name)
    const perEnt = Object.keys(a.subs).map(code => {
      const de = d.filter(x => x.e.entity === code), en = syncEntities.find(z => z.code === code) || { name:code }
      return { code, name:en.name, cols:a.subs[code].length, events:de.length, pending:de.filter(x => x.status === 'Pending').length, failed:de.filter(x => x.status === 'Failed').length, applied:de.filter(x => x.status === 'Applied').length, last:de.reduce((m, x) => x.status === 'Applied' && x.at > m ? x.at : m, 0) }
    }).sort((p, q) => (q.failed - p.failed) || (q.pending - p.pending) || (q.events - p.events))
    return { a, perEnt, ents:Object.keys(a.subs).length, delivered:d.length, applied:d.filter(x => x.status === 'Applied').length, pending:d.filter(x => x.status === 'Pending').length, failed:d.filter(x => x.status === 'Failed').length, last:d.reduce((m, x) => x.status === 'Applied' && x.at > m ? x.at : m, 0) }
  })
  const activeSubs = health.filter(h => h.delivered > 0).length
  const winSeg = (
    <div role="tablist" aria-label="Time window" style={{ display:'inline-flex', alignItems:'stretch', boxSizing:'border-box', height:44, padding:4, gap:2, background:'#EAEEF3', border:'1px solid var(--border)', borderRadius:12, maxWidth:'100%', overflowX:'auto', flex:'none' }}>
      {SY_WINDOWS.map(w => { const on = w.k === win; return (
        <button key={w.k} type="button" role="tab" aria-selected={on} title={w.long} onClick={() => setWin(w.k)}
          style={{ border:'none', borderRadius:9, padding:'0 14px', fontFamily:'inherit', fontSize:13.2, fontWeight: on ? 700 : 600, color: on ? 'var(--ink)' : 'var(--muted)', background: on ? 'var(--surface)' : 'transparent', boxShadow: on ? '0 3px 8px -2px rgba(16,42,84,.18), 0 1px 2px rgba(16,42,84,.08)' : 'none', cursor:'pointer', whiteSpace:'nowrap', flex:'none', transition:'background .2s ease,color .2s ease,box-shadow .2s ease' }}>{w.t}</button>
      )})}
    </div>
  )
  const kpi = (label, value, sub, tone, pct, icon) => (
    <div style={{ ...S.card, padding:'17px 18px 15px', display:'flex', flexDirection:'column', gap:12, minWidth:0, border:'1px solid var(--border-blue)', boxShadow:'0 1px 2px rgba(16,42,84,.05), 0 5px 16px -8px rgba(16,42,84,.12)' }}>
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', gap:10 }}>
        <span style={{ fontSize:11.5, fontWeight:600, letterSpacing:'.06em', textTransform:'uppercase', color:'var(--muted)' }}>{label}</span>
        <Icon d={icon} size={17} style={{ color:'var(--muted)', opacity:.5, flex:'none' }} />
      </div>
      <div style={{ fontSize:30, fontWeight:600, color:'var(--ink)', lineHeight:1, fontVariantNumeric:'tabular-nums', letterSpacing:'-.02em' }}>{value.toLocaleString()}</div>
      <div style={{ display:'flex', alignItems:'center', gap:10, marginTop:'auto', minHeight:24, minWidth:0 }}>
        <div style={{ flex:'1 0 48px', height:5, borderRadius:999, background:'#E9EEF5', overflow:'hidden' }}><div style={{ height:'100%', borderRadius:999, width:Math.min(100, Math.max(2, pct || 0)) + '%', background:SY_KTONE[tone] }} /></div>
        <span title={sub} style={{ fontSize:11.8, color:'var(--muted)', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis', minWidth:0 }}>{sub}</span>
      </div>
    </div>
  )
  const head = (title, sub, action) => (
    <div style={{ ...S.cardHead, display:'flex', alignItems:'center', justifyContent:'space-between', gap:12 }}>
      <div><div style={{ fontSize:14.6, fontWeight:600, color:'var(--ink)' }}>{title}</div>{sub && <div style={{ fontSize:12.2, color:'var(--muted)', marginTop:2 }}>{sub}</div>}</div>
      {action}
    </div>
  )
  const linkBtn = { border:'none', background:'transparent', color:'var(--primary)', fontFamily:'inherit', fontSize:12.8, fontWeight:600, cursor:'pointer', display:'inline-flex', alignItems:'center', gap:5, padding:'6px 4px' }
  return (
    <div style={{ animation:'fadeUp .28s ease' }}>
      <PageHead title="Sync Dashboard" sub={'Health of change delivery to subscribed applications · ' + W.long + ' (since ' + sinceTxt + ')'}>{winSeg}</PageHead>
      {failed.length > 0 && (
        <div role="status" style={{ display:'flex', alignItems:'center', gap:12, padding:'12px 16px', marginBottom:16, borderRadius:12, background:'#FDECEC', border:'1px solid #F3C6C6', color:'#B42318', flexWrap:'wrap' }}>
          <Icon d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z M12 9v4 M12 17h.01" size={18} sw={2.2} />
          <span style={{ flex:1, minWidth:0, fontSize:13.2, fontWeight:500 }}><b style={{ fontWeight:700 }}>{failed.length} {failed.length === 1 ? 'delivery' : 'deliveries'} failed</b> — {failedApps.join(', ')}. Retries are scheduled automatically.</span>
          <button type="button" onClick={() => go('syncOutbox')} style={{ ...linkBtn, color:'#B42318' }}>Review in outbox<Icon d="M5 12h14 M13 6l6 6-6 6" size={14} /></button>
        </div>
      )}
      <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(210px, 1fr))', gap:14, marginBottom:16 }}>
        {kpi('Events', ev.length, ev.length ? appliedN + ' fully applied' : 'No events in this window', 'green', ev.length ? appliedN / ev.length * 100 : 0, 'M22 12h-4l-3 9L9 3l-3 9H2')}
        {kpi('In flight', inflight, cnt('New') + ' new · ' + cnt('Expanded') + ' expanded · ' + cnt('In Process') + ' in process', 'amber', ev.length ? inflight / ev.length * 100 : 0, 'M12 8v4l3 2 M12 21a9 9 0 1 1 0-18 9 9 0 0 1 0 18z')}
        {kpi('Failed deliveries', failed.length, failed.length ? 'across ' + failedApps.length + (failedApps.length === 1 ? ' application' : ' applications') : 'None', 'red', allDel.length ? failed.length / allDel.length * 100 : 0, 'M18 6L6 18 M6 6l12 12')}
        {kpi('Active subscribers', activeSubs, 'of ' + subApps.length + ' subscribed received events', 'blue', subApps.length ? activeSubs / subApps.length * 100 : 0, 'M4 4h6v6H4z M14 4h6v6h-6z M4 14h6v6H4z M17 14v6 M14 17h6')}
      </div>
      <section style={{ ...S.card, marginBottom:16 }}>
        {head('Event pipeline', ev.length + ' events captured · ' + W.long.toLowerCase(), <button type="button" onClick={() => go('syncOutbox')} style={linkBtn}>Open outbox<Icon d="M5 12h14 M13 6l6 6-6 6" size={14} /></button>)}
        <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(190px, 1fr))', gap:12, padding:16 }}>
          {syncEventStatuses.map((s, i) => {
            const c = syncStatusMeta[s]
            return (
              <div key={s} style={{ position:'relative', padding:'14px 16px', borderRadius:12, background:c.bg, border:'1px solid ' + (c.bd === 'transparent' ? 'var(--border)' : c.bd), display:'flex', flexDirection:'column', gap:6 }}>
                <span style={{ display:'flex', alignItems:'center', gap:8, fontSize:12.6, fontWeight:700, color:c.color }}><span aria-hidden style={{ width:8, height:8, borderRadius:'50%', background:c.dot }} />{i + 1}. {s}</span>

      <div style={{ display:'flex', flexDirection:'column', gap:16 }}>

          {head('Subscriber health', 'Deliveries per subscribed application · ' + W.long.toLowerCase() + ' · open a row for its entities', <button type="button" onClick={() => go('syncSubscribers')} style={linkBtn}>Manage<Icon d="M5 12h14 M13 6l6 6-6 6" size={14} /></button>)}

                  const isOpen = !!openApps[h.a.code]

                  return (

                    <td style={{ padding:'12px 16px', fontSize:13.6, fontWeight:600, color:'var(--ink)' }}>

                  </tr>
                  {isOpen && (
                    <tr>
                      <td colSpan={7} style={{ padding:'0 16px 14px', background:'var(--primary-tint-2)' }}>
                        <div style={{ position:'relative', borderRadius:12, background:'var(--surface)', border:'1px solid var(--border-blue)', boxShadow:'0 1px 2px rgba(16,42,84,.05), 0 6px 16px -10px rgba(16,42,84,.18)', overflow:'hidden', animation:'fadeUp .2s ease both' }}>
                          {h.perEnt.map((p, k) => {
                            const last = k === h.perEnt.length - 1
                            const seg = (v, c) => v ? <span style={{ flex:v, background:c }}></span> : null
                            const n = (v, tone, strong) => <div style={{ padding:'0 16px', fontSize:13, fontVariantNumeric:'tabular-nums', color: v ? tone : '#475467', fontWeight: v && strong ? 600 : 400 }}>{v || '0'}</div>
                            return (
                              <div key={p.code} data-ix="row" style={{ display:'grid', gridTemplateColumns:'minmax(0,1fr) 95px 88px 92px 84px 112px 107px', alignItems:'center', minHeight:52, borderTop: k ? '1px solid var(--border)' : 'none' }}>
                                <div style={{ position:'relative', padding:'9px 16px 9px 44px', minWidth:0 }}>
                                  <span aria-hidden style={{ position:'absolute', left:11, top: k ? 0 : 10, bottom: last ? '50%' : 0, width:1.5, background:'#C9D6E8' }}></span>
                                  <span aria-hidden style={{ position:'absolute', left:11, top:'50%', width:16, height:1.5, background:'#C9D6E8' }}></span>
                                  <span aria-hidden style={{ position:'absolute', left:26, top:'50%', width:8, height:8, marginTop:-3.25, borderRadius:'50%', background: p.failed ? '#DC2626' : p.pending ? '#F59E0B' : p.events ? '#16A34A' : '#C9D3E0', boxShadow:'0 0 0 3px #fff' }}></span>
                                  <div style={{ fontSize:13.2, fontWeight:600, color:'var(--ink)', overflowWrap:'anywhere' }}>{p.name}</div>
                                  <div aria-hidden style={{ display:'flex', gap:2, height:4, width:'min(160px, 100%)', marginTop:6, borderRadius:999, overflow:'hidden', background:'#E9EEF5' }}>
                                    {seg(p.applied, '#0070E0')}{seg(p.pending, '#F59E0B')}{seg(p.failed, '#DC2626')}

function Breadcrumbs({ screen, go }) {
  if (screen === 'dashboard') return null
  const labels = Object.fromEntries(nav.map(n => [n.key, n.label]))
  labels.passwordPolicy = 'Password Policy'
  labels.org = 'Organization Structure'
  labels.userNotifs = 'User notifications'
  labels.myProfile = 'My Profile'
  const parents = { passwordPolicy:'tenants', org:'tenants' }
  const trail = []
  let cur = screen
  while (parents[cur]) { trail.unshift(parents[cur]); cur = parents[cur] }
  const items = [{ key:'dashboard', label:'Home' }, ...trail.map(k => ({ key:k, label:labels[k] || k })), { key:screen, label:labels[screen] || screen, current:true }]
  return (
    <nav aria-label="Breadcrumb" style={{ marginBottom:14 }}>
      <ol style={{ display:'flex', alignItems:'center', flexWrap:'wrap', gap:6, listStyle:'none', margin:0, padding:0, fontSize:12.6 }}>

  const step = [1, 2, 2.5, 5, 10].find(s => s * mag >= raw) * mag
  const lo = Math.floor(min / step) * step, hi = Math.ceil(max / step) * step, ticks = []
  for (let v = lo; v <= hi + 1e-9; v += step) ticks.push(Math.round(v * 100) / 100)

function useDashWidth(init = 560) {
  const ref = React.useRef(null)
  const [w, setW] = useState(init)
  React.useEffect(() => {
    const el = ref.current; if (!el || typeof ResizeObserver === 'undefined') return
    const ro = new ResizeObserver(es => { const cw = Math.round(es[0].contentRect.width); if (cw > 0) setW(Math.max(220, cw)) })
    ro.observe(el); return () => ro.disconnect()
  }, [])
  return [ref, w]
}

function dashTenantStats(t) {
  const seed = t.code.charCodeAt(0) + t.code.charCodeAt(1) + t.code.charCodeAt(2)
  const factor = t.status === 'Active' ? 1 : t.status === 'Provisioning' ? 0.45 : 0.04
  const signins = Array.from({ length:14 }, (_, i) => Math.max(0, Math.round(t.users * factor * (0.42 + 0.16 * Math.sin((i + seed) / 1.6) + (((i + seed) % 7) >= 5 ? -0.2 : 0.05)))))
  const mix = t.status === 'Active' ? [0.86, 0.08, 0.04, 0.02] : t.status === 'Provisioning' ? [0.45, 0.5, 0, 0.05] : [0.02, 0, 0.98, 0]
  const status = ['Active', 'Invited', 'Suspended', 'Locked'].map((k, i) => ({ label:k, value:Math.round(t.users * mix[i]), color:DASH_STATUS[k] })).filter(p => p.value > 0)
  const rolesSplit = [['Tenant Admin', 0.02], ['Content Author', 0.18], ['Reviewer', 0.12], ['Candidate', 0.68]].map(([k, s], i) => ({ label:k, value:Math.max(1, Math.round(t.users * s)), color:DASH_PAL[i] }))
  const hr0 = new Date().getHours()

function DashBars({ data, labels, tips, tones, h = 220, unit = '', id }) {

function DashTenant({ t, toast, go, self }) {
  const st = dashTenantStats(t)
  const tl = licenses.filter(l => l.tenant === t.name).sort((a, b) => a.days - b.days)
  const seats = tl.reduce((a, l) => a + l.seats, 0), used = tl.reduce((a, l) => a + l.used, 0)
  const util = seats ? Math.round(used / seats * 100) : 0
  const next = tl[0]
  const days = dashDays(14)
  const avg = Math.round(st.signins.reduce((a, b) => a + b, 0) / 14)
  const peak = Math.max(...st.signins), peakDay = days[st.signins.indexOf(peak)]
  const initials = t.name.split(' ').map(w => w[0]).join('').slice(0, 2).toUpperCase()
  const flexRow = { display:'flex', flexWrap:'wrap', gap:16, alignItems:'stretch' }
  const hours = dashHours()
  const ccNow = st.concurrent[23], ccPeak = Math.max(...st.concurrent), ccPeakAt = hours[st.concurrent.indexOf(ccPeak)]
  const nf = st.notif, nfRate = nf.sent ? (nf.failed / nf.sent * 100).toFixed(1) : '0.0', nfMax = Math.max(...nf.channels.map(c => c.value))
  const sec = st.security, secDelta = sec.prev ? Math.round((sec.failed - sec.prev) / sec.prev * 100) : 0, secUp = secDelta > 0, secMax = Math.max(...sec.reasons.map(r => r.value))
  const appSeed = t.code.charCodeAt(0) + t.code.charCodeAt(1)
  const apps = [['Candidate Management', 'CM', 0.88], ['Test Delivery', 'TD', 0.8], ['Item Authoring & Test Bank', 'IA', 0.62], ['Remote Proctoring', 'RP', 0.54], ['eMarking', 'EM', 0.47], ['Test Construction', 'TC', 0.36], ['Learning Experience', 'LE', 0.29], ['Certification & Badging', 'CB', 0.2], ['Career Portal', 'CP', 0.12]].map(([name, code, s], i) => { const pct = Math.max(3, Math.min(98, Math.round((s + (((appSeed + i * 7) % 9) - 4) / 100) * 100))); return { name, code, pct, active:Math.round(t.users * pct / 100), delta:((appSeed * (i + 3)) % 23) - 8 } }).sort((a, b) => b.active - a.active)
  const appsLow = apps.filter(a => a.pct < 25)
  const nfTone = nf.failed === 0 ? 'var(--ink)' : nf.failed / nf.sent > 0.03 ? '#B42318' : 'var(--warning-text)'
  const appLic = dashAppLic(t).map(x => ({ ...(apps.find(a => a.code === x.code) || {}), ...x })).sort((a, b) => a.days - b.days)
  const [expWin, setExpWin] = useState(90)
  const expTone = d => d < 0 ? { c:'#B42318', bg:'#FEF2F2', bd:'#F3C2C2', bar:'#DC2626', l: d < -30 ? 'Expired' : 'In grace' } : d <= 7 ? { c:'#B42318', bg:'#FEF2F2', bd:'#F3C2C2', bar:'#DC2626', l:'Critical' } : d <= 30 ? { c:'var(--warning-text)', bg:'var(--amber-tint)', bd:'#F5D68A', bar:'#F59E0B', l:'Expiring soon' } : { c:'var(--success-text)', bg:'var(--green-tint)', bd:'#BBE5C8', bar:'#16A34A', l:'Active' }
  const appShown = appLic.filter(a => expWin === 0 || a.days <= expWin)
  const nextApp = appLic.find(a => a.days >= 0) || appLic[0]
  const in30 = appLic.filter(a => a.days >= 0 && a.days <= 30).length, lapsed = appLic.filter(a => a.days < 0).length

  const attnCard = (

            <div style={{ display:'flex', flexDirection:'column', padding:'6px 10px 10px' }}>

                <span aria-hidden="true" style={{ width:34, height:34, borderRadius:9, display:'flex', alignItems:'center', justifyContent:'center', background:'var(--surface-page)', border:'1px solid var(--border)', color:a.tone }}><Icon d={a.icon} size={15} /></span>
                <span style={{ display:'flex', flexDirection:'column', gap:2, minWidth:0 }}><span style={{ fontSize:13.2, fontWeight:600, color:'var(--ink)' }}>{a.label}</span><span style={{ fontSize:12, color:'var(--muted)', overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap' }}>{a.hint}</span></span>
                <span style={{ fontSize:17, fontWeight:600, color:a.tone, fontVariantNumeric:'tabular-nums' }}>{dashFmt(a.value)}</span>
                <Icon d="M9 18l6-6-6-6" size={14} style={{ color:'var(--muted)' }} />
              </button>)}
            </div>
          </DashCard>
  )
  return (
    <div style={{ display:'flex', flexDirection:'column', gap:16, animation:'fadeUp .24s ease' }}>
      <div style={{ ...S.card, padding:'16px 18px', display:'flex', alignItems:'center', gap:16, flexWrap:'wrap' }}>
        <span aria-hidden="true" style={{ width:48, height:48, borderRadius:12, background:'#0a4a8c', color:'#fff', display:'flex', alignItems:'center', justifyContent:'center', fontSize:16, fontWeight:600, flex:'none' }}>{initials}</span>

          <span style={{ fontSize:17, fontWeight:600, color:'var(--ink)' }}>{t.name}</span>
          <span style={{ display:'flex', alignItems:'center', gap:'4px 12px', flexWrap:'wrap', fontSize:12.5, color:'var(--muted)' }}>

        </div>
        {!self && <button data-ix="ghost" onClick={() => go('tenants')} style={{ ...S.ghost, height:38, whiteSpace:'nowrap' }}><Icon d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6 M15 3h6v6 M10 14L21 3" size={15} />Manage tenant</button>}

        <DashKpi label="Account utilization" value={util + '%'} icon={DASH_ICON.key} tone={util >= 90 ? 'danger' : util >= 75 ? 'warn' : undefined} sub={dashFmt(used) + ' of ' + dashFmt(seats) + ' accounts'} />
        <DashKpi label="Next app license expiry" value={nextApp ? nextApp.days + ' days' : '—'} icon={DASH_ICON.clock} tone={nextApp && nextApp.days <= 7 ? 'danger' : nextApp && nextApp.days <= 30 ? 'warn' : undefined} sub={nextApp ? nextApp.name + ' · ' + dashDate(nextApp.days) : 'No active licenses'} />

      <DashCard title="Application license expiry" sub="When each application's license ends"
