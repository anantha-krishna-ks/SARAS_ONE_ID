function flatOrgUnits(nodes, trail, out) {
  nodes.forEach(n => { const path = trail.concat([n.name]); out.push({ code: n.code, name: n.name, type: n.type, path, depth: path.length - 1 }); if (n.children) flatOrgUnits(n.children, path, out) })
  return out
}

function MapVirtualList({ items, rowHeight, height, renderRow, empty, bg }) {
  const [st, setST] = React.useState(0)
  const ov = 6
  const total = items.length
  const vis = Math.ceil(height / rowHeight) + ov * 2
  const start = Math.max(0, Math.floor(st / rowHeight) - ov)
  const end = Math.min(total, start + vis)
  React.useEffect(() => { setST(0) }, [items])
  return (
    <div onScroll={e => setST(e.currentTarget.scrollTop)} style={{ height, overflowY:'auto', overflowX:'hidden', background: bg || 'var(--surface)' }}>
      {total === 0 ? <div style={{ height:'100%', display:'flex', alignItems:'center', justifyContent:'center' }}>{empty}</div> : (
        <div style={{ height: total * rowHeight, position:'relative' }}>
          <div style={{ position:'absolute', top: start * rowHeight, left:0, right:0 }}>
            {items.slice(start, end).map(it => renderRow(it))}
          </div>
        </div>
      )}
    </div>
  )
}

function flattenOrg(nodes, trail, out) {
  nodes.forEach(n => {
    const path = trail.concat([n.name])
    out.push({ code:n.code, name:n.name, type:n.type, path })
    if (n.children) flattenOrg(n.children, path, out)
  })
  return out
}

function findOrgChain(nodes, name, trail) {
  for (const n of nodes) {
    const path = trail.concat([n])
    if (n.name === name) return path
    if (n.children) { const r = findOrgChain(n.children, name, path); if (r) return r }
  }
  return null
}

function OrgUnitCascade({ value, onChange }) {
  const [openLv, setOpenLv] = React.useState(null)
  const chain = (value && findOrgChain(orgTree, value, [])) || []
  const levels = []
  let opts = orgTree
  for (let d = 0; opts && opts.length; d++) {
    const sel = chain[d] || null
    levels.push({ opts, sel, d })
    opts = sel ? (sel.children || null) : null
  }
  return (
    <div>

function RoleModal({ onClose, stop, toast, record, onSubmit }) {
  const edit = !!record
  const [active, setActive] = useState(record ? record.status !== 'Inactive' : true)
  const [mfaRequired, setMfaRequired] = useState(!!(record && record.mfaRequired))
  const [roleApps, setRoleApps] = useState((record && record.apps) || [])
  const f = useForm({ code:record?.code||'', name:record?.name||'', desc:record?.desc||'' }, v => {
    const e = {}
    if (!v.code.trim()) e.code = 'Role code is required.'
    if (!v.name.trim()) e.name = 'Role name is required.'
    return e
  })
  const validateMsg = () => {
    const issues = []
    if (!f.values.subject.trim()) issues.push('Subject is empty.')
    if (!f.values.shortMsg.trim() && !f.values.longMsg.trim()) issues.push('Provide a short or long message body.')
    if ((channels.includes('SMS') || channels.includes('Push')) && !f.values.shortMsg.trim()) issues.push('Short message is required for SMS / push channels.')
    const used = []
    const re = /\{\{\s*([\w.]+)\s*\}\}|\{(\w+)\}/g
    const scan = f.values.subject + ' ' + f.values.shortMsg + ' ' + f.values.longMsg
    let m
    while ((m = re.exec(scan))) used.push(m[1] || m[2])
    used.filter((v, i) => used.indexOf(v) === i).forEach(p => { if (!params.includes(p)) issues.push('Placeholder \u201c' + p + '\u201d is not in the parameters list.') })
    const ok = issues.length === 0
    setMsgCheck({ ok, issues })
    toast(ok ? 'Message validated \u2014 ready to send.' : 'Validation found ' + issues.length + ' issue' + (issues.length > 1 ? 's' : '') + '.', ok ? 'success' : 'warning')
  }
  const exportEvt = () => toast('Exporting event configuration\u2026', 'success')
  const save = () => f.trySubmit(() => {
    onSubmit && onSubmit({ code:f.values.code.trim(), name:f.values.name.trim(), desc:f.values.desc.trim(), scope: record?.scope || 'Tenant', status: active ? 'Active' : 'Inactive', mfaRequired }, record)
    onClose()
    toast(edit ? 'Role updated successfully.' : 'Role created successfully.', 'success')
  })
  return (
    <Modal title={edit ? 'Edit role' : 'New role'} desc={edit ? 'Update this role.' : 'Define a role.'} onClose={onClose} stop={stop} width={780} shake={f.shake} onShakeEnd={f.clearShake} footer={<ModalFooter onClose={onClose} onSave={save} save={edit ? 'Save changes' : 'Create role'} />}>
      <div style={{ padding:24, display:'flex', flexDirection:'column', gap:16 }}>
        {f.submitted && !f.valid && <ErrBanner />}
        <div style={{ display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(240px, 1fr))', gap:16 }}>
          <Field id="r-code" label="Role code" req value={f.values.code} onChange={f.set('code')} error={f.err('code')} placeholder="e.g. CONTENT_AUTHOR" />
          <Field id="r-name" label="Role name" req value={f.values.name} onChange={f.set('name')} error={f.err('name')} placeholder="e.g. Content Reviewer" />
        </div>
        <div>
          <label htmlFor="r-desc" style={S.label}>Description</label>
          <textarea id="r-desc" rows={3} value={f.values.desc} onChange={f.set('desc')} placeholder="What can this role do?" style={{ ...S.input, height:'auto', padding:'11px 14px', resize:'vertical' }} />
        </div>
        <div>
          <label style={S.label}>Applications</label>
          <AppMultiPicker value={roleApps} onChange={setRoleApps} apps={privApps} ariaLabel="Applications" />
          <div style={{ marginTop:6, fontSize:12.4, color:'var(--muted)' }}>Applications this role can access. Select one or more.</div>
        </div>
        <ToggleField title="MFA Required" hint="Accounts with this role must complete multi-factor authentication at sign-in." checked={mfaRequired} onChange={setMfaRequired} />
        {edit && <ToggleField title="Active" hint="Whether this role is active and assignable." checked={active} onChange={setActive} />}
      </div>
    </Modal>
  )
}

function MapPermsModal({ onClose, stop, toast, roleName }) {
  const [sel, setSel] = useState(() => new Set(['tnt.view','acc.view','rol.view','rol.mappriv']))
  const [active, setActive] = useState(0)
  const [q, setQ] = useState('')

  const allLeaves = privApps.flatMap(flattenPrivKeys)
  const total = allLeaves.length
  const count = sel.size
  const valid = count > 0

  const setKeys = (keys, on) => setSel(s => { const n = new Set(s); keys.forEach(k => on ? n.add(k) : n.delete(k)); return n })
  const toggleLeaf = (k) => setSel(s => { const n = new Set(s); n.has(k) ? n.delete(k) : n.add(k); return n })
  const appOn = (app) => flattenPrivKeys(app).filter(k => sel.has(k)).length
  const stateOf = (keys) => { const on = keys.filter(k => sel.has(k)).length; return on === 0 ? 'none' : on === keys.length ? 'all' : 'some' }

  const grantAll = () => setSel(new Set(allLeaves))

  const app = privApps[active]

  const cats = []

function Checkbox({ checked, defaultChecked, onChange, indeterminate, size, disabled }) {

          <span aria-hidden style={{ flex:'none', width:32, height:32, borderRadius:9, background:'var(--primary-tint)', color:'var(--on-tint-blue)', display:'flex', alignItems:'center', justifyContent:'center' }}><Icon d={folder} size={17} /></span>
          <span style={{ fontSize:13, color:'var(--ink)', lineHeight:1.5 }}>{child ? <>Nested under <strong>{record.parentName}</strong> as a <strong>level {lvl}</strong> unit.</> : (edit ? <>Level <strong>{lvl}</strong> unit in the hierarchy.</> : <>A new <strong>top-level</strong> (level 0) unit.</>)}</span>
        </div>
        <Section title="Details" icon="M9 3h6v4H9z M4 17h6v4H4z M14 17h6v4h-6z M12 7v4 M7 17v-2a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v2" cols={2}>
          <Field id="ou-code" label="Code" req value={f.values.code} onChange={f.set('code')} error={f.err('code')} placeholder="e.g. SCI" />
          <Field id="ou-name" label="Name" req value={f.values.name} onChange={f.set('name')} error={f.err('name')} placeholder="e.g. School of Sciences" />
          <Field id="ou-type" label="Type"><Dropdown {...ddProps('ouType', ['Org Group','Organization','Faculty','Department','Division','Section','Branch'])} ariaLabel="Type" /></Field>
          {edit && <Field id="ou-wbs" label="Work breakdown structure"><div style={{ display:'flex', alignItems:'center', gap:8, minHeight:44, padding:'8px 12px', borderRadius:10, background:'var(--surface-alt)', border:'1px dashed var(--border)', fontSize:13.6, fontFamily:'ui-monospace,SFMono-Regular,Menlo,monospace' }}><Icon d="M5 11h14v10H5z M8 11V7a4 4 0 0 1 8 0" size={14} style={{ flex:'none', stroke:'var(--muted)' }} /><span style={{ color:'var(--ink)' }}>{record.wbs || '\u2014'}</span><span style={{ marginLeft:'auto', fontSize:10.6, fontWeight:600, letterSpacing:'.04em', textTransform:'uppercase', color:'var(--muted)', fontFamily:'inherit' }}>Read-only</span></div></Field>}
        </Section>
        {!child && !edit && (
          <div>
            <label style={S.label}>Parent unit</label>
            <div style={{ maxHeight:220, overflowY:'auto', border:'1px solid var(--border)', borderRadius:12, padding:6, background:'var(--surface)', display:'flex', flexDirection:'column', gap:2 }}>
              <button type="button" onClick={() => setParent('None (root)')} style={{ display:'flex', alignItems:'center', gap:9, width:'100%', textAlign:'left', padding:'9px 10px', border:'none', borderRadius:8, cursor:'pointer', background: parentSel === 'None (root)' ? 'var(--primary-tint)' : 'transparent', font:'inherit' }}>
                <Icon d="M3 21h18 M5 21V5a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v16 M9 7h4" size={15} style={{ flex:'none', stroke: parentSel === 'None (root)' ? 'var(--primary)' : 'var(--muted)' }} />
                <span style={{ fontSize:13.2, fontWeight: parentSel === 'None (root)' ? 600 : 500, color:'var(--ink)' }}>None (root)</span>
                {parentSel === 'None (root)' && <Icon d="M20 6L9 17l-5-5" size={14} sw={2.5} style={{ marginLeft:'auto', flex:'none', stroke:'var(--primary)' }} />}
              </button>
              {renderParentTree(orgTree, 0)}
            </div>
          </div>
        )}
      </div>
    </Modal>
  )
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
